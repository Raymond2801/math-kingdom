  function updateQuestionDisplay() {
    const q = state.currentQuestion;
    const questionEl = document.getElementById("question");
    if (q.isWordProblem) {
      questionEl.textContent = q.text;
      questionEl.classList.add("wordProblemText");
    } else {
      questionEl.textContent = `${q.a} ${q.op} ${q.b} = ?`;
      questionEl.classList.remove("wordProblemText");
    }
    document.getElementById("answerDisplay").textContent = state.currentAnswer || " ";
  }

  // =========================================================================
  // DIFFICULTY ADAPTATION (adaptive tier within the current level)
  // =========================================================================
  function onCorrectAnswer() {
    state.correctStreak++;
    state.wrongStreak = 0;
    if (state.correctStreak >= BALANCE.STREAK_UP_THRESHOLD && state.difficultyIndex < DIFFICULTY_TIER_COUNT - 1) {
      state.difficultyIndex++;
      state.correctStreak = 0;
      Audio_.tierUp();
      showFeedback(t("niceStreak"), "#2b6cb0");
    }

    state.cannonStreak++;
    updateStreakDisplay();
    const newCannonLevel = cannonLevelForStreak(state.cannonStreak);
    if (newCannonLevel > state.cannonLevel) {
      state.cannonLevel = newCannonLevel;
      state.pendingCannonDowngrade = false;
      triggerCannonUpgradeEffect(newCannonLevel);
    }
  }

  function onWrongAnswer() {
    state.wrongStreak++;
    state.correctStreak = 0;
    if (state.wrongStreak >= BALANCE.STREAK_DOWN_THRESHOLD && state.difficultyIndex > 0) {
      state.difficultyIndex--;
      state.wrongStreak = 0;
    }

    state.cannonStreak = 0;
    state.pendingCannonDowngrade = true;
    updateStreakDisplay();
  }

  // =========================================================================
  // CANNON UPGRADES — driven by a consecutive-correct streak, independent of
  // the difficulty-tier streak above. Upgrades apply the instant they're
  // earned; a wrong answer resets the streak but the cannon itself only
  // downgrades at the next wave boundary (see startWave), so one mistake
  // doesn't feel like it costs you the upgrade immediately.
  // =========================================================================
  function cannonLevelForStreak(streak) {
    if (streak >= BALANCE.CANNON_STREAK_TIER2) return 2;
    if (streak >= BALANCE.CANNON_STREAK_TIER1) return 1;
    return 0;
  }

  function updateStreakDisplay() {
    const el = document.getElementById("streakDisplay");
    if (state.cannonStreak > 0) {
      el.textContent = `🔥 x${state.cannonStreak}`;
      el.style.visibility = "visible";
    } else {
      el.style.visibility = "hidden";
    }
  }

  function triggerCannonUpgradeEffect(level) {
    Audio_.upgrade();
    showFeedback(level >= 2 ? t("cannonUpgraded2") : t("cannonUpgraded1"), "#e8a400");
    const rect = canvas.getBoundingClientRect();
    const muzzle = getCannonMuzzle(rect);
    for (let i = 0; i < 16; i++) {
      state.particles.push({
        x: muzzle.x, y: muzzle.y,
        vx: (Math.random() - 0.5) * 7,
        vy: (Math.random() - 0.5) * 7 - 2,
        life: 30,
        color: `hsl(${45 + Math.random() * 15}, 95%, ${60 + Math.random() * 20}%)`,
      });
    }
  }

  function showFeedback(text, color) {
    const el = document.getElementById("feedback");
    el.textContent = text;
    el.style.color = color || "#333";
    clearTimeout(showFeedback._t);
    showFeedback._t = setTimeout(() => { el.textContent = " "; }, 1200);
  }

  // =========================================================================
  // MONSTER / WAVE MANAGEMENT
  // =========================================================================
  function monstersInWave(wave) {
    return BALANCE.BASE_MONSTERS_PER_WAVE + (wave - 1) * BALANCE.MONSTERS_PER_WAVE_INCREMENT;
  }
  function speedForWave(wave) {
    const lvl = currentLevel();
    return (BALANCE.BASE_MONSTER_SPEED + (wave - 1) * BALANCE.WAVE_SPEED_INCREMENT) * lvl.monsterSpeedMultiplier;
  }
  function spawnIntervalForWave(wave) {
    return Math.max(
      BALANCE.MIN_SPAWN_INTERVAL_MS,
      BALANCE.BASE_SPAWN_INTERVAL_MS - (wave - 1) * BALANCE.SPAWN_INTERVAL_DECREMENT_MS
    );
  }

  function startWave(waveNum) {
    const world = currentWorld();
    const lvl = currentLevel();
    state.wave = waveNum;
    const regularCount = monstersInWave(waveNum);
    state.isBossWave = !!(lvl.hasBoss && waveNum === BALANCE.TOTAL_WAVES);
    state.monstersRemainingToSpawn = regularCount + (state.isBossWave ? 1 : 0);
    state.monstersAliveOrPending = state.monstersRemainingToSpawn;
    state.spawnIntervalMs = spawnIntervalForWave(waveNum);
    state.spawnTimer = 0;
    state.waveInProgress = true;
    document.getElementById("waveInfo").textContent =
      `${world.emoji} ${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)} — ${t("waveLabel")} ${waveNum}/${BALANCE.TOTAL_WAVES}`;

    // Cannon downgrades only take effect at a wave boundary, never mid-wave.
    if (state.pendingCannonDowngrade) {
      const recomputed = cannonLevelForStreak(state.cannonStreak);
      if (recomputed < state.cannonLevel) {
        state.cannonLevel = recomputed;
      }
      state.pendingCannonDowngrade = false;
    }
  }

  function spawnMonster() {
    const rect = canvas.getBoundingClientRect();
    const world = currentWorld();
    const lvl = currentLevel();
    const isBoss = state.isBossWave && state.monstersRemainingToSpawn === 1;
    const spawnXFraction = lvl.spawnXFraction || BALANCE.SPAWN_X_FRACTION;
    const speciesList = DRAGON_SPECIES_BY_WORLD[world.id];
    const speciesKey = isBoss ? BOSS_DRAGON_SPECIES_BY_WORLD[world.id] : speciesList[(state.wave - 1) % speciesList.length];
    const isBossWaveOfFinalLevel = state.levelIndex === 2 && state.isBossWave;
    const hpDistribution = isBossWaveOfFinalLevel ? HP_DISTRIBUTION_LEVEL3_BOSS_WAVE : HP_DISTRIBUTION_BY_LEVEL_INDEX[state.levelIndex];
    const hp = isBoss ? BALANCE.BOSS_HP : pickWeighted(hpDistribution);
    const scale = isBoss ? BALANCE.BOSS_SCALE : 1;
    const size = BASE_MONSTER_SIZE * scale;
    // Dragons walk along the grass line, not scattered at random heights —
    // groundY matches the same line the castle/ground strip is drawn on, with
    // a tiny per-monster jitter so they don't all form a perfectly flat row.
    const groundY = getCastleGeometry(rect).groundY;
    const jitter = randInt(-4, 4);
    state.monsters.push({
      x: rect.width * spawnXFraction,
      y: groundY - size * 0.4 + jitter,
      speciesKey,
      speed: speedForWave(state.wave) * (isBoss ? BALANCE.BOSS_SPEED_MULTIPLIER : hpSpeedMultiplier(hp)),
      hp,
      maxHp: hp,
      isBoss: isBoss,
      scale,
      dying: false,
      dieTimer: 0,
      bobOffset: Math.random() * Math.PI * 2,
      blinkOffset: Math.random() * 3000,
    });
    state.monstersRemainingToSpawn--;
  }

  // Castle geometry is computed once here and reused by both the collision
  // check (how close a monster must get to reach the castle) and the
  // renderer (drawCastle/getCannonMuzzle), so the hit boundary always lines
  // up with the wall's drawn right edge regardless of canvas size.
  function getCastleGeometry(rect) {
    const groundY = rect.height * 0.75;
    const wallHeight = rect.height * 0.5;
    const wallWidth = Math.max(90, rect.width * 0.14);
    const wallX = -wallWidth * 0.25; // partially off the left edge is fine
    const wallY = groundY - wallHeight;
    const towerWidth = wallWidth * 0.5;
    const towerHeight = wallHeight * 1.25;
    const towerX = wallX + wallWidth - towerWidth * 0.55;
    const towerY = groundY - towerHeight;
    return { groundY, wallX, wallY, wallWidth, wallHeight, towerX, towerY, towerWidth, towerHeight };
  }

  function getCannonMuzzle(rect) {
    const g = getCastleGeometry(rect);
    return { x: g.wallX + g.wallWidth * 0.55, y: g.wallY - 6 };
  }

  // Second cannon, unlocked at a 10-answer streak, sits up on the tower.
  function getSecondCannonMuzzle(rect) {
    const g = getCastleGeometry(rect);
    return { x: g.towerX + g.towerWidth * 0.5, y: g.towerY - 6 };
  }

  function castleX() {
    const rect = canvas.getBoundingClientRect();
    const g = getCastleGeometry(rect);
    return g.wallX + g.wallWidth;
  }

  // =========================================================================
  // SHOOTING
  // =========================================================================
  // Targeting priority is shortest time-to-castle (remaining distance / own
  // speed), not raw distance. Sorting by distance alone lets a slow, tanky
  // multi-HP dragon get perpetually bypassed by faster newcomers that spawn
  // later but overtake it — "closest" looks locally correct at every instant,
  // yet the slow one can go untouched for its whole approach and reach the
  // castle. Time-to-impact fixes that: whoever will actually arrive soonest
  // is engaged first. Ties (near-simultaneous arrival) favor lower remaining
  // HP, so nearly-dead dragons get finished off rather than left dangling.
  function sortByThreat(monsters) {
    const cx = castleX();
    return monsters.slice().sort((a, b) => {
      const ta = (a.x - cx) / a.speed;
      const tb = (b.x - cx) / b.speed;
      if (Math.abs(ta - tb) > 1e-6) return ta - tb;
      return a.hp - b.hp;
    });
  }

  // Below cannonLevel 2 this fires one cannonball at the most urgent dragon,
  // same as always. At level 2 (10-streak) each correct answer fires from
  // both cannons at once, targeting the two most urgent dragons.
  function fireAtClosestMonster() {
    const alive = state.monsters.filter(m => !m.dying);
    if (alive.length === 0) return false;
    const sorted = sortByThreat(alive);
    const rect = canvas.getBoundingClientRect();
    const dual = state.cannonLevel >= 2;
    const targets = dual ? sorted.slice(0, 2) : sorted.slice(0, 1);
    const muzzles = [getCannonMuzzle(rect)];
    if (dual) muzzles.push(getSecondCannonMuzzle(rect));
    const speedMult = state.cannonLevel >= 1 ? BALANCE.CANNON_TIER1_SPEED_MULT : 1;

    targets.forEach((target, i) => {
      const muzzle = muzzles[i] || muzzles[0];
      const dist = Math.max(1, Math.hypot(target.x - muzzle.x, target.y - muzzle.y));
      state.cannonballs.push({
        x: muzzle.x,
        y: muzzle.y,
        target,
        initialDist: dist,
        rotation: 0,
        speedMult,
      });
    });
    state.cannonRecoil = 1;
    Audio_.shoot();
    return true;
  }

  // Small burst of particles at the cannonball's impact point, distinct from
  // the particles hitMonster() spawns at the monster itself.
  function spawnImpactBurst(x, y) {
    for (let i = 0; i < 10; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 1,
        life: 20,
        color: `hsl(${20 + Math.random() * 30}, 95%, ${55 + Math.random() * 15}%)`,
      });
    }
  }

  // An arrow hitting its target: regular monsters die in one hit, the boss
  // takes BALANCE.BOSS_HP hits before dying.
  function hitMonster(m) {
    m.hp--;
    state.score += BALANCE.SCORE_PER_CORRECT;
    document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
    Audio_.hit();

    for (let i = 0; i < 4; i++) {
      state.particles.push({
        x: m.x, y: m.y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 1,
        life: 30,
        color: `hsl(${Math.random() * 60 + 30}, 90%, 60%)`,
      });
    }

    if (m.hp <= 0) {
      m.dying = true;
      m.dieTimer = 0;
      if (m.isBoss) {
        state.score += BALANCE.BOSS_KILL_BONUS;
        document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
        showFeedback(t("bossDefeated"), "#e8590c");
      }
      for (let i = 0; i < (m.isBoss ? 20 : 8); i++) {
        state.particles.push({
          x: m.x, y: m.y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 1,
          life: 34,
          color: `hsl(${Math.random() * 60 + 30}, 90%, 60%)`,
        });
      }
    } else if (m.isBoss) {
      showFeedback(tf("bossHitLeft", { hp: m.hp, maxHp: m.maxHp }), "#e8590c");
    }
  }

  // =========================================================================
  // HEARTS / GAME END
  // =========================================================================
  function loseHeart() {
    state.hearts--;
    updateHeartsDisplay();
    Audio_.heartLost();
    if (state.hearts <= 0) {
      endGame("gameover");
    }
  }

  function updateHeartsDisplay() {
    let s = "";
    for (let i = 0; i < BALANCE.TOTAL_HEARTS; i++) {
      s += i < state.hearts ? "❤️" : "🖤";
    }
    document.getElementById("hearts").textContent = s;
  }

  function setBottomPanelEnabled(enabled) {
    document.getElementById("bottomPanel").classList.toggle("disabled", !enabled);
  }

  function setHudMode(mode) {
    document.getElementById("hudNormal").style.display = mode === "quiz" ? "none" : "flex";
    document.getElementById("quickUnlockBar").style.display = mode === "quiz" ? "flex" : "none";
    if (mode !== "playing") {
      document.getElementById("streakDisplay").style.visibility = "hidden";
    }
  }

  // outcome: "gameover" | "levelComplete" | "worldComplete" | "victory"
  function endGame(outcome) {
    if (state.gameEnded) return;
    state.gameEnded = true;
    state.running = false;
    state.inputEnabled = false;
    setBottomPanelEnabled(false);

    const world = currentWorld();
    const lvl = currentLevel();
    const titleEl = document.getElementById("overlayTitle");
    const subEl = document.getElementById("overlaySubtitle");
    const primaryBtn = document.getElementById("primaryBtn");
    document.getElementById("levelSelectBtn").textContent = t("chooseLevel");

    if (outcome === "gameover") {
      titleEl.textContent = t("gameOverTitle");
      subEl.textContent = `${t("scoreLabel")}: ${state.score}`;
      primaryBtn.textContent = t("retryLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      Audio_.gameOver();
    } else if (outcome === "levelComplete") {
      const wp = getWorldProgress(world.id);
      if (wp.unlockedLevel <= lvl.id && lvl.id < world.levels.length) {
        wp.unlockedLevel = lvl.id + 1;
        saveProgress();
      }
      const nextLvl = world.levels[lvl.id];
      titleEl.textContent = `${t("levelCompleteTitle")} ${lvl.emoji}`;
      subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${levelName(world.id, nextLvl.id)}`;
      primaryBtn.textContent = t("nextLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, nextLvl.id); };
      Audio_.victory();
      startConfetti();
    } else if (outcome === "worldComplete") {
      const isLastWorld = world.id >= WORLDS.length;
      if (!isLastWorld) {
        const nextWorld = WORLDS[world.id];
        const nwp = getWorldProgress(nextWorld.id);
        nwp.unlocked = true;
        saveProgress();
        titleEl.textContent = `${t("worldCompleteTitle")} ${world.emoji}`;
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${worldName(nextWorld.id)}`;
        primaryBtn.textContent = t("nextWorld");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); showLevelSelect(nextWorld.id); };
      } else {
        titleEl.textContent = t("victoryTitle");
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("savedKingdom")}`;
        primaryBtn.textContent = t("retryLevel");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      }
      Audio_.victory();
      startConfetti();
    }

    document.getElementById("overlay").classList.add("active");
  }

  // Confetti particles for victory (canvas-drawn, separate lightweight system)
  let confetti = [];
  function startConfetti() {
    confetti = [];
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < 80; i++) {
      confetti.push({
        x: Math.random() * rect.width,
        y: -20 - Math.random() * rect.height,
        vy: 2 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 2,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`,
        size: 4 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  // =========================================================================
  // LANGUAGE TOGGLE
  // =========================================================================
  function updateLangToggleUI() {
    document.getElementById("langBtnVi").classList.toggle("activeLang", currentLang === "vi");
    document.getElementById("langBtnEn").classList.toggle("activeLang", currentLang === "en");
  }

  function setLanguage(lang) {
    if (lang !== "vi" && lang !== "en") return;
    currentLang = lang;
    saveLang(lang);
    showWorldSelect();
  }

  document.getElementById("langBtnVi").addEventListener("click", () => setLanguage("vi"));
  document.getElementById("langBtnEn").addEventListener("click", () => setLanguage("en"));

  // =========================================================================
  // WORLD SELECT / LEVEL SELECT SCREENS
  // =========================================================================
  function renderWorldCards() {
    const container = document.getElementById("worldCards");
    container.innerHTML = "";
    WORLDS.forEach((world) => {
      const wp = getWorldProgress(world.id);
      const card = document.createElement("div");
      card.className = "worldCard" + (wp.unlocked ? "" : " locked");
      card.innerHTML =
        `<div class="worldCardEmoji">${wp.unlocked ? world.emoji : "🔒"}</div>` +
        `<div class="worldCardTitle">${t("worldLabel")} ${world.id}: ${worldName(world.id)}</div>` +
        `<div class="worldCardAge">${ageRangeText(world.id)}</div>`;
      if (wp.unlocked) {
        const playBtn = document.createElement("button");
        playBtn.className = "worldActionBtn primary";
        playBtn.textContent = t("play");
        playBtn.addEventListener("click", () => { Audio_.resumeCtx(); showLevelSelect(world.id); });
        card.appendChild(playBtn);
      } else {
        const sub = document.createElement("div");
        sub.className = "worldCardSub";
        sub.textContent = t("lockedWorldSub");
        card.appendChild(sub);
        const quickBtn = document.createElement("button");
        quickBtn.className = "worldActionBtn secondary";
        quickBtn.textContent = t("quickUnlock");
        quickBtn.addEventListener("click", () => startQuickUnlockQuiz(world.id));
        card.appendChild(quickBtn);
      }
      container.appendChild(card);
    });
  }

  function renderLevelCards(worldId) {
    const world = getWorld(worldId);
    const wp = getWorldProgress(worldId);
    document.getElementById("levelSelectTitle").textContent = `${t("worldLabel")} ${world.id}: ${worldName(world.id)}`;
    const container = document.getElementById("levelCards");
    container.innerHTML = "";
    world.levels.forEach((lvl) => {
      const unlocked = lvl.id <= wp.unlockedLevel;
      const btn = document.createElement("button");
      btn.className = "levelCard" + (unlocked ? "" : " locked");
      btn.disabled = !unlocked;
      btn.innerHTML =
        `<div class="levelCardEmoji">${unlocked ? lvl.emoji : "🔒"}</div>` +
        `<div class="levelCardTitle">${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)}</div>` +
        `<div class="levelCardSub">${unlocked ? t("tapToPlay") : t("locked")}</div>`;
      if (unlocked) {
        btn.addEventListener("click", () => startLevel(world.id, lvl.id));
      }
      container.appendChild(btn);
    });
  }

  function showWorldSelect() {
    state.mode = "menu";
    state.running = false;
    state.inputEnabled = false;
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.querySelector("#worldSelectOverlay h1").textContent = t("gameTitle");
    document.querySelector("#worldSelectOverlay p").textContent = t("tagline");
    document.getElementById("waveInfo").textContent = t("selectWorldPlaceholder");
    updateLangToggleUI();
    renderWorldCards();
    document.getElementById("worldSelectOverlay").classList.add("active");
    setBottomPanelEnabled(false);
    setHudMode("menu");
  }

  function showLevelSelect(worldId) {
    state.mode = "menu";
    state.running = false;
    state.inputEnabled = false;
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("backToWorldsBtn").textContent = t("backToWorlds");
    renderLevelCards(worldId);
    document.getElementById("levelSelectOverlay").classList.add("active");
    setBottomPanelEnabled(false);
    setHudMode("menu");
  }

  document.getElementById("levelSelectBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showLevelSelect(currentWorld().id);
  });
  document.getElementById("backToWorldsBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();
  });

  function startLevel(worldId, levelId) {
    Audio_.resumeCtx();
    state.worldIndex = WORLDS.findIndex(w => w.id === worldId);
    state.levelIndex = getWorld(worldId).levels.findIndex(l => l.id === levelId);
    state.mode = "playing";
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    setHudMode("playing");
    resetState();
  }

  // =========================================================================
  // QUICK UNLOCK — answer 3 sample questions correctly in a row to skip ahead
  // =========================================================================
  function startQuickUnlockQuiz(worldId) {
    Audio_.resumeCtx();
    state.mode = "quiz";
    state.quickUnlockWorldId = worldId;
    state.quickUnlockStreak = 0;
    state.running = false;
    state.inputEnabled = true;
    state.waitingForNextQuestion = false;
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("quickUnlockCancelBtn").textContent = t("cancel");
    setBottomPanelEnabled(true);
    setHudMode("quiz");
    updateQuickUnlockProgress();
    generateQuizQuestion();
  }

  function updateQuickUnlockProgress() {
    const world = getWorld(state.quickUnlockWorldId);
    document.getElementById("quickUnlockProgress").textContent =
      `${t("quickUnlockProgressLabel")}: ${worldName(world.id)} — ${state.quickUnlockStreak}/${BALANCE.QUICK_UNLOCK_STREAK_REQUIRED} ${t("correctInARow")}`;
  }

  function generateQuizQuestion() {
    const world = getWorld(state.quickUnlockWorldId);
    state.currentQuestion = generateQuestionForLevel(world.levels[0], 1);
    state.currentAnswer = "";
    updateQuestionDisplay();
  }

  document.getElementById("quickUnlockCancelBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();
  });

  function submitQuickUnlockAnswer() {
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      state.quickUnlockStreak++;
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      if (state.quickUnlockStreak >= BALANCE.QUICK_UNLOCK_STREAK_REQUIRED) {
        const wp = getWorldProgress(state.quickUnlockWorldId);
        wp.unlocked = true;
        saveProgress();
        Audio_.tierUp();
        const worldId = state.quickUnlockWorldId;
        state.mode = "menu";
        showLevelSelect(worldId);
        return;
      }
      updateQuickUnlockProgress();
      generateQuizQuestion();
    } else {
      state.quickUnlockStreak = 0;
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(tf("quickUnlockWrong", { ans: correctAns }), "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      updateQuickUnlockProgress();
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        generateQuizQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  // =========================================================================
  // INPUT HANDLING
  // =========================================================================
  function handleKey(key) {
    if (!state.inputEnabled || state.waitingForNextQuestion) return;
    if (key === "clear") {
      state.currentAnswer = "";
    } else if (key === "enter") {
      submitAnswer();
      return;
    } else {
      if (state.currentAnswer.length < 3) {
        state.currentAnswer += key;
      }
    }
    updateQuestionDisplay();
  }

  function submitAnswer() {
    if (state.currentAnswer === "") return;
    if (state.mode === "quiz") {
      submitQuickUnlockAnswer();
      return;
    }
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      fireAtClosestMonster();
      onCorrectAnswer();
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      newQuestion();
    } else {
      onWrongAnswer();
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(`${t("oopsAnswerWas")} ${correctAns}`, "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        newQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  document.getElementById("numpad").addEventListener("click", (e) => {
    const btn = e.target.closest(".numBtn");
    if (!btn) return;
    Audio_.resumeCtx();
    handleKey(btn.dataset.key);
  });

  window.addEventListener("keydown", (e) => {
    Audio_.resumeCtx();
    if (e.key >= "0" && e.key <= "9") {
      handleKey(e.key);
    } else if (e.key === "Enter") {
      handleKey("enter");
    } else if (e.key === "Backspace" || e.key === "Escape") {
      handleKey("clear");
    }
  });

  // =========================================================================
  // MAIN UPDATE / RENDER LOOP
  // =========================================================================
  function update(dt) {
    // spawning
    if (state.waveInProgress && state.monstersRemainingToSpawn > 0) {
      state.spawnTimer += dt;
      if (state.spawnTimer >= state.spawnIntervalMs) {
        state.spawnTimer = 0;
        spawnMonster();
      }
    }

    // monsters
    const cx = castleX();
    for (let i = state.monsters.length - 1; i >= 0; i--) {
      const m = state.monsters[i];
      if (m.dying) {
        m.dieTimer += dt;
        if (m.dieTimer > 300) {
          state.monsters.splice(i, 1);
          state.monstersAliveOrPending--;
        }
        continue;
      }
      m.x -= m.speed * (dt / 16.6667);
      if (m.x <= cx + 20) {
        state.monsters.splice(i, 1);
        state.monstersAliveOrPending--;
        loseHeart();
      }
    }

    // cannon recoil decay (visual only)
    if (state.cannonRecoil > 0) {
      state.cannonRecoil -= dt / 150;
      if (state.cannonRecoil < 0) state.cannonRecoil = 0;
    }

    // cannonballs
    for (let i = state.cannonballs.length - 1; i >= 0; i--) {
      const ball = state.cannonballs[i];
      if (ball.target.dying || !state.monsters.includes(ball.target)) {
        state.cannonballs.splice(i, 1);
        continue;
      }
      const dx = ball.target.x - ball.x;
      const dy = ball.target.y - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const speed = BALANCE.CANNONBALL_SPEED * (ball.speedMult || 1) * (dt / 16.6667);
      // Register a hit whenever this frame's movement would reach or pass the
      // target, not just when already within 15px — a large dt (a throttled
      // background tab, a slow device) can otherwise let a fast cannonball
      // overshoot its target in a single step and never register the hit,
      // wasting the shot while the dragon keeps marching untouched.
      if (dist < 15 || speed >= dist) {
        hitMonster(ball.target);
        spawnImpactBurst(ball.target.x, ball.target.y);
        state.cannonballs.splice(i, 1);
      } else {
        ball.x += (dx / dist) * speed;
        ball.y += (dy / dist) * speed;
        ball.rotation += 0.25 * (dt / 16.6667);
      }
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // confetti
    if (confetti.length > 0) {
      const rect = canvas.getBoundingClientRect();
      for (const c of confetti) {
        c.y += c.vy * (dt / 16.6667);
        c.x += c.vx * (dt / 16.6667);
        c.rot += c.vrot;
        if (c.y > rect.height + 20) {
          c.y = -20;
          c.x = Math.random() * rect.width;
        }
      }
    }

    // wave completion check
    if (!state.gameEnded && state.waveInProgress && state.monstersRemainingToSpawn <= 0 && state.monstersAliveOrPending <= 0) {
      state.waveInProgress = false;
      if (state.wave >= BALANCE.TOTAL_WAVES) {
        const lvl = currentLevel();
        const world = currentWorld();
        if (lvl.id < world.levels.length) {
          endGame("levelComplete");
        } else {
          endGame("worldComplete");
        }
      } else {
        setTimeout(() => {
          if (!state.gameEnded) startWave(state.wave + 1);
        }, 1500);
      }
    }
  }

  // =========================================================================
  // CANVAS ART — castle, cannon, and monster shapes. No image assets; every
  // creature is body + eyes + feet drawn with primitives, animated with a
  // walking bob, an occasional blink, and a squash-then-pop death animation.
  // =========================================================================
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCastle(ctx, rect) {
    const g = getCastleGeometry(rect);
    // main wall with a simple brick texture
    ctx.fillStyle = "#9a9a9a";
    ctx.fillRect(g.wallX, g.wallY, g.wallWidth, g.wallHeight);
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1;
    const rowH = 18;
    const rows = Math.ceil(g.wallHeight / rowH);
    for (let row = 0; row <= rows; row++) {
      const y = g.wallY + row * rowH;
      ctx.beginPath(); ctx.moveTo(g.wallX, y); ctx.lineTo(g.wallX + g.wallWidth, y); ctx.stroke();
    }
    for (let row = 0; row < rows; row++) {
      const y = g.wallY + row * rowH;
      const offset = row % 2 === 0 ? 0 : 15;
      for (let bx = g.wallX + offset; bx < g.wallX + g.wallWidth; bx += 30) {
        ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + rowH); ctx.stroke();
      }
    }
    // battlements along the top of the wall
    ctx.fillStyle = "#9a9a9a";
    const crenelCount = 5;
    const crenelW = g.wallWidth / (crenelCount * 2 - 1);
    for (let i = 0; i < crenelCount; i++) {
      ctx.fillRect(g.wallX + i * crenelW * 2, g.wallY - 14, crenelW, 14);
    }
    // tower
    ctx.fillStyle = "#8a8a8a";
    ctx.fillRect(g.towerX, g.towerY, g.towerWidth, g.towerHeight);
    const towerRows = Math.ceil(g.towerHeight / rowH);
    for (let row = 0; row <= towerRows; row++) {
      const y = g.towerY + row * rowH;
      ctx.beginPath(); ctx.moveTo(g.towerX, y); ctx.lineTo(g.towerX + g.towerWidth, y); ctx.stroke();
    }
    ctx.fillStyle = "#8a8a8a";
    const towerCrenelCount = 3;
    const towerCrenelW = g.towerWidth / (towerCrenelCount * 2 - 1);
    for (let i = 0; i < towerCrenelCount; i++) {
      ctx.fillRect(g.towerX + i * towerCrenelW * 2, g.towerY - 12, towerCrenelW, 12);
    }
    // flag
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 3;
    const flagPoleX = g.towerX + g.towerWidth * 0.5;
    ctx.beginPath(); ctx.moveTo(flagPoleX, g.towerY - 12); ctx.lineTo(flagPoleX, g.towerY - 40); ctx.stroke();
    ctx.fillStyle = "#e05a5a";
    ctx.beginPath();
    ctx.moveTo(flagPoleX, g.towerY - 40);
    ctx.lineTo(flagPoleX + 22, g.towerY - 33);
    ctx.lineTo(flagPoleX, g.towerY - 26);
    ctx.closePath();
    ctx.fill();
    // arched door at the base of the wall
    ctx.fillStyle = "#5a3a1a";
    const doorW = g.wallWidth * 0.3, doorH = g.wallHeight * 0.35;
    const doorX = g.wallX + g.wallWidth * 0.25;
    const doorY = g.groundY - doorH;
    ctx.beginPath();
    ctx.moveTo(doorX, doorY + doorH);
    ctx.lineTo(doorX, doorY + doorH * 0.3);
    ctx.quadraticCurveTo(doorX, doorY, doorX + doorW / 2, doorY);
    ctx.quadraticCurveTo(doorX + doorW, doorY, doorX + doorW, doorY + doorH * 0.3);
    ctx.lineTo(doorX + doorW, doorY + doorH);
    ctx.closePath();
    ctx.fill();
  }

  function drawCannon(ctx, muzzle, aimAngle, recoil, barrelScale) {
    barrelScale = barrelScale || 1;
    ctx.save();
    ctx.translate(muzzle.x, muzzle.y);
    ctx.fillStyle = "#3a2a1a";
    ctx.beginPath(); ctx.arc(0, 4, 10 * barrelScale, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(aimAngle);
    const recoilOffset = -recoil * 8;
    ctx.fillStyle = "#333";
    roundRectPath(ctx, recoilOffset - 2, -7 * barrelScale, 36 * barrelScale, 14 * barrelScale, 6 * barrelScale);
    ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(recoilOffset, 0, 8 * barrelScale, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawDragonEye(ctx, x, y, r, isBlinking) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(x, y, r, isBlinking ? r * 0.15 : r, 0, 0, Math.PI * 2);
    ctx.fill();
    if (!isBlinking) {
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(x - r * 0.25, y, r * 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Wing silhouette is the main species "family" cue: membrane (natural
  // dragons), mechanical (rigid panel, World 2), or feather (owl-winged).
  function drawDragonWings(ctx, r, cfg, wingFlap) {
    ctx.save();
    ctx.translate(r * 0.05, -r * 0.05);
    ctx.rotate(-0.5 - wingFlap * 0.5);
    ctx.fillStyle = cfg.wingColor;
    if (cfg.wing === "feather") {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(r * (0.9 - i * 0.15), -r * (0.5 + i * 0.22), r * (0.25 - i * 0.05), -r * 0.1);
        ctx.closePath();
        ctx.fill();
      }
    } else if (cfg.wing === "mechanical") {
      roundRectPath(ctx, -r * 0.08, -r * 0.9, r * 0.28, r * 0.85, r * 0.08);
      ctx.fill();
      ctx.fillStyle = "#2a2a2a";
      ctx.beginPath(); ctx.arc(r * 0.06, -r * 0.05, r * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = cfg.wingColor;
      roundRectPath(ctx, r * 0.02, -r * 0.65, r * 0.2, r * 0.55, r * 0.06);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(r * 1.0, -r * 0.85, r * 0.2, -r * 0.1);
      ctx.quadraticCurveTo(r * 0.55, -r * 0.4, 0, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Horn style is the secondary species cue: natural curved horn, a
  // mechanical antenna, a feather tuft, or a faceted crystal.
  function drawDragonHorns(ctx, r, cfg) {
    const hx = -r * 0.85, hy = -r * 0.15;
    ctx.fillStyle = cfg.horn;
    if (cfg.hornType === "antenna") {
      ctx.strokeStyle = cfg.horn; ctx.lineWidth = r * 0.05;
      ctx.beginPath(); ctx.moveTo(hx, hy - r * 0.3); ctx.lineTo(hx - r * 0.05, hy - r * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx - r * 0.05, hy - r * 0.65, r * 0.08, 0, Math.PI * 2); ctx.fill();
    } else if (cfg.hornType === "tuft") {
      ctx.beginPath(); ctx.moveTo(hx + r * 0.1, hy - r * 0.25); ctx.lineTo(hx - r * 0.15, hy - r * 0.55); ctx.lineTo(hx + r * 0.2, hy - r * 0.35); ctx.closePath(); ctx.fill();
    } else if (cfg.hornType === "crystal") {
      ctx.beginPath(); ctx.moveTo(hx, hy - r * 0.25); ctx.lineTo(hx - r * 0.12, hy - r * 0.55); ctx.lineTo(hx + r * 0.08, hy - r * 0.4); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(hx + r * 0.05, hy - r * 0.25); ctx.quadraticCurveTo(hx - r * 0.2, hy - r * 0.55, hx - r * 0.05, hy - r * 0.15); ctx.closePath(); ctx.fill();
    }
  }

  function drawDragonSpecialFeatures(ctx, r, cfg) {
    if (cfg.fireGlow) {
      ctx.fillStyle = "rgba(255,150,50,0.55)";
      ctx.beginPath(); ctx.ellipse(-r * 1.05, r * 0.02, r * 0.18, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (cfg.runeGlow) {
      ctx.fillStyle = "rgba(210,180,255,0.9)";
      [[-r * 0.2, -r * 0.05], [r * 0.1, r * 0.15], [-r * 0.45, r * 0.1]].forEach(([px, py]) => {
        ctx.beginPath(); ctx.arc(px, py, r * 0.05, 0, Math.PI * 2); ctx.fill();
      });
    }
  }

  // Visual cue for HP: 2-HP dragons get metal armor plates on the back,
  // 3-HP "elite" dragons get gold plates plus a small crest spike.
  function drawHpModifiers(ctx, r, maxHp) {
    if (maxHp >= 2) {
      ctx.fillStyle = maxHp >= 3 ? "rgba(255,215,80,0.9)" : "rgba(130,140,150,0.9)";
      [[-r * 0.25, -r * 0.32], [r * 0.05, -r * 0.36], [r * 0.32, -r * 0.24]].forEach(([px, py]) => {
        roundRectPath(ctx, px - r * 0.11, py - r * 0.065, r * 0.22, r * 0.13, r * 0.04);
        ctx.fill();
      });
    }
    if (maxHp >= 3) {
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.5);
      ctx.lineTo(-r * 0.78, -r * 0.82);
      ctx.lineTo(-r * 0.62, -r * 0.55);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Every monster in the game is a dragon walking left toward the castle:
  // tail + back legs + wings drawn first (behind the body), then body, belly,
  // front leg, neck/head, horns, special features, HP modifiers, and eye.
  function drawDragon(ctx, size, cfg, isBlinking, wingFlap, legPhase, maxHp) {
    const r = size / 2;
    const legSwing = Math.sin(legPhase) * r * 0.18;
    const tailWag = Math.sin(legPhase) * 3;

    ctx.strokeStyle = cfg.body; ctx.lineWidth = r * 0.32; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(r * 0.5, r * 0.1);
    ctx.quadraticCurveTo(r * 1.1, r * 0.3 + tailWag, r * 1.3, -r * 0.05 + tailWag);
    ctx.stroke();

    ctx.strokeStyle = cfg.body; ctx.lineWidth = r * 0.26;
    ctx.beginPath(); ctx.moveTo(r * 0.22, r * 0.5); ctx.lineTo(r * 0.22 + legSwing, r * 0.92); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.28, r * 0.5); ctx.lineTo(-r * 0.28 - legSwing, r * 0.92); ctx.stroke();

    drawDragonWings(ctx, r, cfg, wingFlap);

    ctx.fillStyle = cfg.body;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.72, r * 0.58, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = cfg.belly;
    ctx.beginPath(); ctx.ellipse(-r * 0.05, r * 0.2, r * 0.48, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = cfg.body; ctx.lineWidth = r * 0.26;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.4); ctx.lineTo(-r * 0.5 - legSwing, r * 0.85); ctx.stroke();

    ctx.fillStyle = cfg.body;
    ctx.beginPath(); ctx.ellipse(-r * 0.82, -r * 0.15, r * 0.38, r * 0.33, -0.15, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(-r * 1.12, -r * 0.05, r * 0.18, r * 0.14, -0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a2a2a";
    ctx.beginPath(); ctx.arc(-r * 1.24, -r * 0.05, r * 0.03, 0, Math.PI * 2); ctx.fill();

    drawDragonHorns(ctx, r, cfg);
    drawDragonSpecialFeatures(ctx, r, cfg);
    drawHpModifiers(ctx, r, maxHp);
    drawDragonEye(ctx, -r * 0.78, -r * 0.22, r * 0.12, isBlinking);
  }

  const BASE_MONSTER_SIZE = 46; // px "diameter" at scale 1, before per-monster/boss scale

  function drawBossHpBar(ctx, m, size) {
    const barWidth = size * 1.3;
    const barHeight = 8;
    const x = m.x - barWidth / 2;
    const y = m.y - size * 0.9 - 16;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    roundRectPath(ctx, x, y, barWidth, barHeight, 4); ctx.fill();
    const hpFrac = Math.max(0, m.hp / m.maxHp);
    ctx.fillStyle = "#e8590c";
    roundRectPath(ctx, x, y, barWidth * hpFrac, barHeight, 4); ctx.fill();
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(`${m.hp}/${m.maxHp}`, m.x, y - 2);
  }

  // Small HP pips above non-boss multi-HP dragons (armored/elite), separate
  // from the full boss HP bar which shows a fraction + number instead.
  function drawHpPips(ctx, m, size) {
    const pipR = 4;
    const spacing = 10;
    const totalWidth = (m.maxHp - 1) * spacing;
    const startX = m.x - totalWidth / 2;
    const y = m.y - size * 0.7 - 10;
    for (let i = 0; i < m.maxHp; i++) {
      ctx.beginPath();
      ctx.arc(startX + i * spacing, y, pipR, 0, Math.PI * 2);
      ctx.fillStyle = i < m.hp ? "#e8590c" : "rgba(0,0,0,0.25)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  function drawMonster(ctx, m) {
    const bob = Math.sin(Date.now() / 200 + m.bobOffset) * 4;
    let alpha = 1, popScale = 1, squashX = 1, squashY = 1;
    if (m.dying) {
      const t2 = m.dieTimer / 300;
      if (t2 < 0.25) {
        const squashT = t2 / 0.25;
        squashY = 1 - squashT * 0.35;
        squashX = 1 + squashT * 0.25;
      } else {
        const popT = (t2 - 0.25) / 0.75;
        popScale = 1 + popT * 0.6;
        squashY = 0.65 + popT * 0.35;
        squashX = 1.25 - popT * 0.25;
        alpha = 1 - popT;
      }
    }
    const renderScale = (m.scale || 1) * popScale;
    const size = BASE_MONSTER_SIZE * renderScale;
    const blinkCycle = (Date.now() / 1000 + m.blinkOffset / 300) % 3.2;
    const isBlinking = !m.dying && blinkCycle > 3.0;
    const legPhase = Date.now() / 150 + m.bobOffset * 3;
    const wingFlap = Math.sin(Date.now() / 220 + m.bobOffset * 1.3) * 0.5 + 0.5;
    const cfg = DRAGON_SPECIES[m.speciesKey];

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(m.x, m.y + bob);
    ctx.scale(squashX, squashY);
    drawDragon(ctx, size, cfg, isBlinking, wingFlap, legPhase, m.maxHp);
    ctx.restore();

    if (m.isBoss && !m.dying) {
      drawBossHpBar(ctx, m, size);
    } else if (!m.dying && m.maxHp > 1) {
      drawHpPips(ctx, m, size);
    }
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    ctx2d.clearRect(0, 0, w, h);

    // background sky
    const grad = ctx2d.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#bfe6f5");
    grad.addColorStop(1, "#d9f2c4");
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0, 0, w, h);

    // ground strip
    ctx2d.fillStyle = "#8fbf5f";
    ctx2d.fillRect(0, h * 0.75, w, h * 0.25);

    // castle + cannon(s) — main cannon aims at the most urgent alive dragon
    // (shortest time-to-castle); the second cannon (10-answer streak) aims at
    // the next most urgent, matching whatever fireAtClosestMonster() targets.
    drawCastle(ctx2d, rect);
    const barrelScale = state.cannonLevel >= 1 ? BALANCE.CANNON_TIER1_BARREL_SCALE : 1;
    const aliveSorted = sortByThreat(state.monsters.filter(m => !m.dying));
    const muzzle = getCannonMuzzle(rect);
    let aimAngle = 0;
    if (aliveSorted[0]) {
      aimAngle = Math.atan2(aliveSorted[0].y - muzzle.y, aliveSorted[0].x - muzzle.x);
    }
    drawCannon(ctx2d, muzzle, aimAngle, state.cannonRecoil, barrelScale);
    if (state.cannonLevel >= 2) {
      const muzzle2 = getSecondCannonMuzzle(rect);
      const target2 = aliveSorted[1] || aliveSorted[0];
      let aimAngle2 = 0;
      if (target2) aimAngle2 = Math.atan2(target2.y - muzzle2.y, target2.x - muzzle2.x);
      drawCannon(ctx2d, muzzle2, aimAngle2, state.cannonRecoil, barrelScale);
    }

    // monsters
    for (const m of state.monsters) {
      drawMonster(ctx2d, m);
    }

    // cannonballs (arc up then back down toward the target using a sine offset)
    for (const ball of state.cannonballs) {
      const dx = ball.target.x - ball.x;
      const dy = ball.target.y - ball.y;
      const remainingDist = Math.sqrt(dx * dx + dy * dy);
      const progress = Math.min(1, Math.max(0, 1 - remainingDist / ball.initialDist));
      const arcHeight = Math.sin(progress * Math.PI) * BALANCE.CANNONBALL_ARC_HEIGHT;
      ctx2d.save();
      ctx2d.translate(ball.x, ball.y - arcHeight);
      ctx2d.rotate(ball.rotation);
      ctx2d.fillStyle = "#2b2b2b";
      ctx2d.beginPath();
      ctx2d.arc(0, 0, 9, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.fillStyle = "rgba(255,255,255,0.25)";
      ctx2d.beginPath();
      ctx2d.arc(-3, -3, 3, 0, Math.PI * 2);
      ctx2d.fill();
      ctx2d.restore();
    }

    // particles
    for (const p of state.particles) {
      ctx2d.globalAlpha = Math.max(0, p.life / 30);
      ctx2d.fillStyle = p.color;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;

    // confetti
    for (const c of confetti) {
      ctx2d.save();
      ctx2d.translate(c.x, c.y);
      ctx2d.rotate(c.rot);
      ctx2d.fillStyle = c.color;
      ctx2d.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
      ctx2d.restore();
    }
  }

  function loop(timestamp) {
    if (!state.lastFrameTime) state.lastFrameTime = timestamp;
    const dt = timestamp - state.lastFrameTime;
    state.lastFrameTime = timestamp;

    if (state.running) {
      update(dt);
    }
    if (confetti.length > 0 && !state.running) {
      // keep animating confetti after game ends
      const rect = canvas.getBoundingClientRect();
      for (const c of confetti) {
        c.y += c.vy * (dt / 16.6667);
        c.x += c.vx * (dt / 16.6667);
        c.rot += c.vrot;
        if (c.y > rect.height + 20) { c.y = -20; c.x = Math.random() * rect.width; }
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // GAME LIFECYCLE
  // =========================================================================
  function resetState() {
    state.hearts = BALANCE.TOTAL_HEARTS;
    state.score = 0;
    state.wave = 1;
    state.monsters = [];
    state.cannonballs = [];
    state.cannonRecoil = 0;
    state.particles = [];
    state.difficultyIndex = 0;
    state.correctStreak = 0;
    state.wrongStreak = 0;
    state.cannonStreak = 0;
    state.cannonLevel = 0;
    state.pendingCannonDowngrade = false;
    state.currentAnswer = "";
    state.running = true;
    state.inputEnabled = true;
    state.gameEnded = false;
    state.waveInProgress = false;
    state.waitingForNextQuestion = false;
    confetti = [];
    document.getElementById("score").textContent = `${t("scoreLabel")}: 0`;
    updateHeartsDisplay();
    updateStreakDisplay();
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    setBottomPanelEnabled(true);
    newQuestion();
    startWave(1);
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 100));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resizeCanvas);
  }
  resizeCanvas();
  updateHeartsDisplay();
  showWorldSelect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
