<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Math Kingdom</title>
<!-- Friendly display font (Vietnamese-capable). Falls back to system fonts offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
    --gold: #ffcf4a;
    --gold-deep: #c8902c;
    --night: #1b1538;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%;
    height: 100vh;   /* fallback for browsers without dvh support */
    height: 100dvh;  /* dynamic viewport height: accounts for Safari's collapsing toolbars */
    overflow: hidden;
    background: var(--night);
    font-family: var(--font);
    touch-action: manipulation;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    /* Respect notches/home-indicator/rounded corners on iPhone; padding is
       included in the 100dvh box via border-box, so it carves space inward
       instead of pushing the layout past the visible viewport. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #canvasWrapper {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------------------------------------------------------------- HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 10px;
    pointer-events: none;
    z-index: 10;
  }
  #hudNormal, #quickUnlockBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }
  #hudLeft { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #hearts, #score, #waveInfo, #quickUnlockProgress, #streakDisplay {
    font-size: clamp(13px, 3vw, 20px);
    font-weight: 800;
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    white-space: nowrap;
    background: rgba(20, 14, 48, 0.62);
    border: 1.5px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    padding: 4px 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
  }
  #hearts { letter-spacing: 1px; }
  #streakDisplay { background: linear-gradient(rgba(255,140,40,0.85), rgba(220,70,20,0.85)); border-color: rgba(255,230,160,0.7); }
  #waveInfo {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-radius: 18px;
    min-width: 0; max-width: 52%;
    padding: 4px 14px 5px;
  }
  #waveInfo .waveName { overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 0.92em; }
  .waveDots { display: flex; gap: 4px; }
  .waveDots .dot {
    display: block; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.22); border: 1.5px solid rgba(255,255,255,0.65);
  }
  .waveDots .dot.done { background: #7dff8a; border-color: #d6ffd9; }
  .waveDots .dot.now { background: var(--gold); border-color: #fff3c4; box-shadow: 0 0 8px var(--gold); }
  #quickUnlockProgress { border-radius: 18px; white-space: normal; }
  #quickUnlockCancelBtn {
    pointer-events: auto;
    padding: 6px 14px;
    font-size: 14px;
  }

  /* ----------------------------------------------------- bottom panel */
  #bottomPanel {
    flex: 0 0 auto;
    background: linear-gradient(#fff4d6, #f1dca6);
    border-top: 4px solid var(--gold-deep);
    box-shadow: inset 0 3px 0 #ffeeb8, 0 -6px 18px rgba(0,0,0,0.3);
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
    position: relative;
    z-index: 5;
  }
  #bottomPanel.disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  /* Menus get the whole screen: the question panel only exists while playing. */
  #gameContainer.menuMode #bottomPanel { display: none; }
  #question {
    display: flex; align-items: center; justify-content: center;
    width: 100%; max-width: 640px;
    min-height: 1.15em;
    padding: 2px 18px;
    text-align: center;
    font-size: clamp(30px, 6.2vw, 46px);
    line-height: 1.1;
    font-weight: 800;
    color: #3a2750;
    letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.65);
  }
  #question.wordProblemText {
    font-size: clamp(14px, 2.8vw, 20px);
    letter-spacing: normal;
    line-height: 1.32;
    font-weight: 700;
  }
  /* Word-problem levels reserve three lines so the panel (and therefore the
     3D scene above it) never changes height from one question to the next. */
  #bottomPanel.wordMode #question.wordProblemText { min-height: calc(3 * 1.32em); }
  #feedback {
    font-size: clamp(16px, 3.6vw, 24px);
    font-weight: 800;
    min-height: 1.35em;
    line-height: 1.35;
    transition: opacity 0.2s;
  }
  #answerDisplay {
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 800;
    line-height: 1.2;
    color: #2b6cb0;
    min-height: 1.3em;
    min-width: 130px;
    padding: 0 16px;
    text-align: center;
    background: #fffdf5;
    border: 3px solid var(--gold-deep);
    border-radius: 14px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.14);
  }
  #numpad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    width: 100%;
    max-width: 500px;
  }
  .numBtn {
    font-family: var(--font);
    font-size: clamp(20px, 4.4vw, 28px);
    font-weight: 800;
    padding: 6px 0 5px;
    border-radius: 14px;
    border: 2px solid rgba(60,30,0,0.28);
    background: linear-gradient(#ffe27a, #f6b73c);
    color: #4a2f12;
    box-shadow: 0 4px 0 #b07a14, inset 0 2px 0 rgba(255,255,255,0.6);
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .numBtn:hover { filter: brightness(1.06); }
  .numBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b07a14, inset 0 2px 0 rgba(255,255,255,0.6);
  }
  .numBtn.clear { background: linear-gradient(#ff9a8f, #e5544a); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25); box-shadow: 0 4px 0 #a13a32, inset 0 2px 0 rgba(255,255,255,0.45); }
  .numBtn.enter { background: linear-gradient(#9be08a, #4fa843); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25); box-shadow: 0 4px 0 #357a2c, inset 0 2px 0 rgba(255,255,255,0.45); }
  .numBtn.clear:active { box-shadow: 0 1px 0 #a13a32, inset 0 2px 0 rgba(255,255,255,0.45); }
  .numBtn.enter:active { box-shadow: 0 1px 0 #357a2c, inset 0 2px 0 rgba(255,255,255,0.45); }

  /* On short viewports (phones in landscape) shrink the bottom panel so the
     full number pad + question always fit without scrolling; the canvas
     above absorbs whatever space is left. */
  @media (max-height: 480px) {
    #bottomPanel { padding: 4px 10px 6px; gap: 3px; border-top-width: 3px; }
    .numBtn { padding: 3px 0 2px; box-shadow: 0 3px 0 #b07a14, inset 0 2px 0 rgba(255,255,255,0.6); }
    #numpad { gap: 5px; }
    #question { font-size: clamp(18px, 4.5vw, 28px); }
    #question.wordProblemText { font-size: clamp(12px, 2.4vw, 16px); }
    #feedback { font-size: clamp(13px, 3vw, 18px); min-height: 1.2em; }
    #answerDisplay { font-size: clamp(16px, 4vw, 22px); min-height: 1.1em; border-width: 2px; }
  }

  /* ------------------------------------------------------------ overlays */
  /* Overlays are sized to canvasWrapper only, so they never cover the number pad.
     The live 3D scene shows through behind the menus. */
  #overlay, #worldSelectOverlay, #levelSelectOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  /* flexible spacers centre the content but let it scroll from the top when it overflows */
  #overlay::before, #overlay::after,
  #worldSelectOverlay::before, #worldSelectOverlay::after,
  #levelSelectOverlay::before, #levelSelectOverlay::after { content: ""; flex: 1 0 0; }
  #overlay {
    background: radial-gradient(circle at 50% 40%, rgba(60,40,120,0.5), rgba(8,6,26,0.86));
    z-index: 20;
  }
  #overlay.active { display: flex; }
  #worldSelectOverlay, #levelSelectOverlay {
    background: linear-gradient(rgba(14,10,44,0.62), rgba(14,10,44,0.34) 42%, rgba(14,10,44,0.7));
    z-index: 30;
  }
  #worldSelectOverlay.active, #levelSelectOverlay.active { display: flex; }

  #overlayCard {
    background: linear-gradient(#41327f, #261a55);
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 20px 30px 24px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.22);
    max-width: min(92vw, 520px);
  }
  #overlayTitle {
    font-size: clamp(30px, 7vw, 54px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 6px;
    color: var(--gold);
    text-shadow: 0 3px 0 #8a5a0a, 0 6px 14px rgba(0,0,0,0.5);
  }
  #overlaySubtitle {
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: 700;
    margin-bottom: 18px;
  }
  #overlayButtons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .overlayBtn {
    font-family: var(--font);
    font-size: clamp(18px, 4.2vw, 26px);
    font-weight: 800;
    padding: 8px 32px;
    border-radius: 16px;
    border: 2px solid rgba(0,0,0,0.25);
    color: white;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    cursor: pointer;
  }
  .overlayBtn.primary {
    background: linear-gradient(#9be08a, #4fa843);
    box-shadow: 0 5px 0 #357a2c, inset 0 2px 0 rgba(255,255,255,0.4);
  }
  .overlayBtn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #357a2c; }
  .overlayBtn.secondary {
    background: linear-gradient(#7dbbff, #3f8efc);
    box-shadow: 0 5px 0 #2a5da0, inset 0 2px 0 rgba(255,255,255,0.4);
  }
  .overlayBtn.secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a5da0; }

  /* ------------------------------------------------------- menu screens */
  #worldSelectOverlay h1, #levelSelectOverlay h1 {
    font-size: clamp(30px, 8vw, 60px);
    font-weight: 800;
    line-height: 1.05;
    margin: 0 0 6px;
    color: var(--gold);
    text-shadow: 0 3px 0 #a0640a, 0 6px 0 #6b3f06, 0 10px 18px rgba(0,0,0,0.5);
  }
  #levelSelectOverlay h1 { font-size: clamp(22px, 5.5vw, 38px); text-shadow: 0 3px 0 #6b3f06, 0 6px 14px rgba(0,0,0,0.5); }
  #worldSelectOverlay p, #levelSelectOverlay p {
    font-size: clamp(13px, 3vw, 18px);
    font-weight: 700;
    max-width: 560px;
    margin: 4px 0 14px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  #langToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .langBtn {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(20,14,48,0.55);
    color: white;
    cursor: pointer;
  }
  .langBtn.activeLang {
    background: rgba(255,255,255,0.95);
    color: #222;
    border-color: #fff;
  }

  #levelSelectHeader {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  #backToWorldsBtn {
    font-family: var(--font);
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(20,14,48,0.55);
    color: white;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }

  #worldCards, #levelCards {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 700px;
  }
  .worldCard {
    --c1: #6dd5ed; --c2: #2193b0; --edge: #1a6f85;
    width: 178px;
    padding: 14px 12px 12px;
    border-radius: 20px;
    background: linear-gradient(var(--c1), var(--c2));
    border: 2px solid rgba(255,255,255,0.45);
    box-shadow: 0 5px 0 var(--edge), 0 10px 20px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .worldCard::after { /* soft gloss */
    content: ""; position: absolute; left: -20%; right: -20%; top: -40%; height: 70%;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.22), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .worldCard[data-world="1"], .levelCard[data-world="1"] { --c1: #7be07f; --c2: #2f9a45; --edge: #1d6a2e; }
  .worldCard[data-world="2"], .levelCard[data-world="2"] { --c1: #ffbd6b; --c2: #d9742a; --edge: #8f4a14; }
  .worldCard[data-world="3"], .levelCard[data-world="3"] { --c1: #b79bff; --c2: #5b3bb8; --edge: #36228a; }
  .worldCard.locked {
    --c1: #9a9aa6; --c2: #5d5d6a; --edge: #34343d;
    opacity: 0.92;
  }
  .worldCardEmoji {
    font-size: 34px; line-height: 1;
    width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.25); border-radius: 50%;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
  }
  .worldCardTitle { font-weight: 800; font-size: 15px; line-height: 1.15; margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .worldCardAge { font-size: 12px; font-weight: 700; background: rgba(0,0,0,0.25); padding: 1px 10px; border-radius: 999px; }
  .worldCardSub { font-size: 11px; font-weight: 600; opacity: 0.92; margin: 2px 0 8px; }
  .worldCardAge { margin-bottom: 8px; }
  .worldActionBtn {
    font-family: var(--font);
    margin-top: auto;
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    padding: 6px 6px;
    border-radius: 12px;
    border: 2px solid rgba(0,0,0,0.22);
    color: white;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    cursor: pointer;
    width: 100%;
    position: relative; z-index: 1;
  }
  .worldCardAge + .worldActionBtn, .worldCardSub + .worldActionBtn { margin-top: auto; }
  .worldActionBtn.primary { background: linear-gradient(#ffe27a, #f6a82c); color: #4a2f12; text-shadow: 0 1px 0 rgba(255,255,255,0.5); box-shadow: 0 3px 0 #a86c10; }
  .worldActionBtn.secondary { background: linear-gradient(#7dbbff, #3f8efc); box-shadow: 0 3px 0 #2a5da0; }
  .worldActionBtn:active { transform: translateY(2px); }

  .levelCard {
    --c1: #6dd5ed; --c2: #2193b0; --edge: #1a6f85;
    font-family: var(--font);
    width: 156px;
    padding: 14px 10px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.45);
    background: linear-gradient(var(--c1), var(--c2));
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--edge), 0 10px 20px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.45);
  }
  .levelCard:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
  .levelCard.locked {
    --c1: #9a9aa6; --c2: #5d5d6a; --edge: #34343d;
    cursor: not-allowed;
    opacity: 0.85;
  }
  .levelCardEmoji {
    font-size: 36px; line-height: 1; margin: 0 auto;
    width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.25); border-radius: 50%;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
  }
  .levelCardTitle { font-weight: 800; font-size: 16px; line-height: 1.15; margin-top: 8px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .levelCardSub { font-size: 12px; font-weight: 700; margin-top: 4px; opacity: 0.95; }

  /* narrow screens (placed last so it overrides the base card rules) */
  @media (max-width: 560px) {
    #langToggle { position: static; align-self: flex-end; margin-bottom: 6px; }
    #worldCards { flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .worldCard {
      width: min(100%, 340px);
      display: grid;
      grid-template-columns: 64px 1fr;
      grid-template-areas: "emoji title" "emoji age" "sub sub" "btn btn";
      column-gap: 12px; row-gap: 2px;
      align-items: center; justify-items: start;
      text-align: left;
      padding: 10px 12px 12px;
    }
    .worldCardEmoji { grid-area: emoji; width: 56px; height: 56px; }
    .worldCardTitle { grid-area: title; margin: 0; font-size: 14px; }
    .worldCardAge { grid-area: age; margin: 0; }
    .worldCardSub { grid-area: sub; margin: 6px 0 0; }
    .worldActionBtn { grid-area: btn; margin-top: 8px; }
    .worldCardAge + .worldActionBtn, .worldCardSub + .worldActionBtn { margin-top: 8px; }
    #levelCards { gap: 10px; }
    .levelCard { width: 148px; }
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="canvasWrapper">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="hudNormal">
        <div id="hudLeft">
          <div id="hearts">❤️❤️❤️</div>
          <div id="streakDisplay" style="visibility:hidden;">🔥 x0</div>
        </div>
        <div id="waveInfo">Select a World</div>
        <div id="score">Score: 0</div>
      </div>
      <div id="quickUnlockBar" style="display:none;">
        <div id="quickUnlockProgress">Quick Unlock: 0/3</div>
        <button id="quickUnlockCancelBtn" class="overlayBtn secondary">✕ Cancel</button>
      </div>
    </div>
    <div id="overlay">
      <div id="overlayCard">
        <div id="overlayTitle">Game Over</div>
        <div id="overlaySubtitle">Score: 0</div>
        <div id="overlayButtons">
          <button id="primaryBtn" class="overlayBtn primary">Retry Level</button>
          <button id="levelSelectBtn" class="overlayBtn secondary">Choose Level</button>
        </div>
      </div>
    </div>
    <div id="worldSelectOverlay" class="active">
      <div id="langToggle">
        <button id="langBtnVi" class="langBtn">🇻🇳 VI</button>
        <button id="langBtnEn" class="langBtn">🇬🇧 EN</button>
      </div>
      <h1>🏰 Math Kingdom 👾</h1>
      <p>Choose your world!</p>
      <div id="worldCards"></div>
    </div>
    <div id="levelSelectOverlay">
      <div id="levelSelectHeader">
        <button id="backToWorldsBtn">← Worlds</button>
        <h1 id="levelSelectTitle" style="margin:0;">World</h1>
      </div>
      <div id="levelCards"></div>
    </div>
  </div>
  <div id="bottomPanel" class="disabled">
    <div id="question">7 + 5 = ?</div>
    <div id="feedback">&nbsp;</div>
    <div id="answerDisplay">&nbsp;</div>
    <div id="numpad">
      <button class="numBtn" data-key="1">1</button>
      <button class="numBtn" data-key="2">2</button>
      <button class="numBtn" data-key="3">3</button>
      <button class="numBtn" data-key="4">4</button>
      <button class="numBtn" data-key="5">5</button>
      <button class="numBtn clear" data-key="clear">C</button>
      <button class="numBtn" data-key="6">6</button>
      <button class="numBtn" data-key="7">7</button>
      <button class="numBtn" data-key="8">8</button>
      <button class="numBtn" data-key="9">9</button>
      <button class="numBtn" data-key="0">0</button>
      <button class="numBtn enter" data-key="enter">✓</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // =========================================================================
  // GAME BALANCE CONSTANTS — tune these to change difficulty/feel
  // =========================================================================
  const BALANCE = {
    TOTAL_HEARTS: 3,              // lives before Game Over
    TOTAL_WAVES: 5,               // waves to clear per level
    BASE_MONSTER_SPEED: 0.35,     // px/frame at wave 1 (base, before per-wave scaling)
    WAVE_SPEED_INCREMENT: 0.07,   // added to monster speed per wave
    BASE_MONSTERS_PER_WAVE: 4,    // monsters in wave 1
    MONSTERS_PER_WAVE_INCREMENT: 2, // extra monsters added each subsequent wave
    BASE_SPAWN_INTERVAL_MS: 2600, // ms between spawns at wave 1
    SPAWN_INTERVAL_DECREMENT_MS: 250, // spawn gets faster (smaller interval) each wave
    MIN_SPAWN_INTERVAL_MS: 900,   // floor for spawn interval
    CANNONBALL_SPEED: 9,          // screen px/frame for the cannonball projectile
    SCORE_PER_CORRECT: 10,        // points per monster kill (or per boss hit)
    STREAK_UP_THRESHOLD: 5,       // consecutive correct answers to raise difficulty tier
    STREAK_DOWN_THRESHOLD: 2,     // consecutive wrong answers to lower difficulty tier

  // --- tiny colour helpers (cached: dragons are drawn every frame) ---------
  const colorCache = new Map();
  function hexParts(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [n >> 16, (n >> 8) & 255, n & 255];
  }
  // amt in [-1,1]: negative mixes toward black, positive toward white
  function shade(hex, amt) {
    const key = hex + "|" + amt;
    let v = colorCache.get(key);
    if (!v) {
      const [r, g, b] = hexParts(hex);
      const target = amt < 0 ? 0 : 255, k = Math.abs(amt);
      v = `rgb(${Math.round(r + (target - r) * k)},${Math.round(g + (target - g) * k)},${Math.round(b + (target - b) * k)})`;
      colorCache.set(key, v);
    }
    return v;
  }
  function rgba(hex, a) {
    const [r, g, b] = hexParts(hex);
    return `rgba(${r},${g},${b},${a})`;
  }

  function polyPath(ctx, r, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * r, pts[0][1] * r);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * r, pts[i][1] * r);
    ctx.closePath();
  }
  function fillStroke(ctx, fill) {
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.stroke();
  }

  // One wing, drawn for the RIGHT side in a frame whose origin is the
  // shoulder; the caller mirrors it for the left wing. flap > 0 lifts the tip.
  function drawDragonWing(ctx, r, cfg, flap, outline) {
    ctx.save();
    ctx.translate(0.40 * r, -0.02 * r);
    ctx.rotate(-flap);
    const W = [0.62, -0.80], F1 = [1.28, -1.00], F2 = [1.26, -0.28], F3 = [0.86, 0.36], B = [0.10, 0.50];
    const bone = shade(cfg.wingColor, -0.5);
    if (cfg.wing === "mechanical") {
      // rigid blade wing: layered steel blades with glowing seams
      const blades = [[1.34, -1.04], [1.40, -0.62], [1.32, -0.16], [1.04, 0.30]];
      blades.forEach(([tx, ty], i) => {
        const len = Math.hypot(tx, ty), ux = tx / len, uy = ty / len;
        const nx = -uy, ny = ux;
        polyPath(ctx, r, [[nx * 0.17, ny * 0.17], [tx * 0.62 + nx * 0.21, ty * 0.62 + ny * 0.21], [tx, ty],
          [tx * 0.62 - nx * 0.21, ty * 0.62 - ny * 0.21], [-nx * 0.17, -ny * 0.17]]);
        fillStroke(ctx, i % 2 ? shade(cfg.wingColor, 0.12) : cfg.wingColor);
        ctx.strokeStyle = rgba(cfg.eye, 0.6);
        ctx.lineWidth = r * 0.03;
        ctx.beginPath(); ctx.moveTo(tx * 0.25 * r, ty * 0.25 * r); ctx.lineTo(tx * 0.9 * r, ty * 0.9 * r); ctx.stroke();
        ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r * 0.036);
      });
      ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2);
      fillStroke(ctx, shade(cfg.wingColor, 0.25));
      ctx.fillStyle = cfg.eye; ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, Math.PI * 2); ctx.fill();
    } else if (cfg.wing === "feather") {
      for (let i = 0; i < 6; i++) {
        const ang = -0.92 + i * 0.30, len = 1.48 - Math.abs(i - 1.5) * 0.05;
        const tx = Math.cos(ang) * len, ty = Math.sin(ang) * len;
        const px = -Math.sin(ang) * 0.30, py = Math.cos(ang) * 0.30;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo((tx * 0.55 + px) * r, (ty * 0.55 + py) * r, tx * r, ty * r);
        ctx.quadraticCurveTo((tx * 0.55 - px) * r, (ty * 0.55 - py) * r, 0, 0);
        fillStroke(ctx, i % 2 ? shade(cfg.wingColor, 0.16) : cfg.wingColor);
      }
    } else {
      // bat-like membrane with scalloped trailing edge, bones and a wrist claw
      const scallop = (a, b) => {
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        return [(mx + (W[0] - mx) * 0.38) * r, (my + (W[1] - my) * 0.38) * r];
      };
      const g = ctx.createLinearGradient(0, 0, F2[0] * r, F2[1] * r);
      g.addColorStop(0, shade(cfg.wingColor, 0.12));
      g.addColorStop(1, shade(cfg.wingColor, -0.22));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W[0] * r, W[1] * r);
      ctx.lineTo(F1[0] * r, F1[1] * r);
      let c = scallop(F1, F2); ctx.quadraticCurveTo(c[0], c[1], F2[0] * r, F2[1] * r);
      c = scallop(F2, F3); ctx.quadraticCurveTo(c[0], c[1], F3[0] * r, F3[1] * r);
      c = scallop(F3, B); ctx.quadraticCurveTo(c[0], c[1], B[0] * r, B[1] * r);
      ctx.closePath();
      fillStroke(ctx, g);
      ctx.strokeStyle = bone; ctx.lineWidth = r * 0.07;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(W[0] * r, W[1] * r); ctx.lineTo(F1[0] * r, F1[1] * r);
      ctx.moveTo(W[0] * r, W[1] * r); ctx.lineTo(F2[0] * r, F2[1] * r);
      ctx.moveTo(W[0] * r, W[1] * r); ctx.lineTo(F3[0] * r, F3[1] * r);
      ctx.stroke();
      if (cfg.runeGlow) {
        ctx.strokeStyle = rgba(cfg.eye, 0.8); ctx.lineWidth = r * 0.03;
        ctx.beginPath();
        ctx.moveTo(0.1 * r, 0); ctx.lineTo((W[0] * 0.9) * r, (W[1] * 0.85) * r);
        ctx.moveTo(W[0] * 0.85 * r, W[1] * 0.85 * r); ctx.lineTo(F2[0] * 0.9 * r, F2[1] * 0.9 * r);
        ctx.moveTo(W[0] * 0.8 * r, W[1] * 0.8 * r); ctx.lineTo(F3[0] * 0.85 * r, F3[1] * 0.85 * r);
        ctx.stroke();
      }
      ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r * 0.036);
      polyPath(ctx, r, [[W[0] - 0.05, W[1] + 0.02], [W[0] - 0.01, W[1] - 0.20], [W[0] + 0.07, W[1] + 0.02]]);
      fillStroke(ctx, "#efe6c4");
    }
    ctx.restore();
  }

  function drawDragonHorn(ctx, r, cfg, outline) {
    // RIGHT horn only; caller mirrors
    if (cfg.hornType === "antenna") {
      polyPath(ctx, r, [[0.30, -0.66], [0.44, -1.0], [0.38, -0.62]]);
      fillStroke(ctx, cfg.horn);
      ctx.strokeStyle = shade(cfg.horn, -0.3); ctx.lineWidth = r * 0.06;
      ctx.beginPath(); ctx.moveTo(0.18 * r, -0.74 * r); ctx.lineTo(0.62 * r, -0.92 * r); ctx.stroke();
      ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1, r * 0.036);
      ctx.beginPath(); ctx.arc(0.64 * r, -0.93 * r, r * 0.07, 0, Math.PI * 2);
      fillStroke(ctx, cfg.eye);
    } else if (cfg.hornType === "tuft") {
      [[0.84, -0.99, 0.26, -0.70], [0.98, -0.82, 0.34, -0.66], [0.66, -1.04, 0.20, -0.74]].forEach(([tx, ty, bx, by]) => {
        polyPath(ctx, r, [[bx, by], [tx, ty], [bx + 0.16, by + 0.05]]);
        fillStroke(ctx, cfg.horn);
      });
    } else if (cfg.hornType === "crystal") {
      [[0.80, -1.02, 0.26, -0.70], [0.96, -0.80, 0.40, -0.64], [0.56, -1.0, 0.18, -0.72]].forEach(([tx, ty, bx, by], i) => {
        polyPath(ctx, r, [[bx, by], [tx, ty], [bx + 0.15, by + 0.06]]);
        fillStroke(ctx, i === 1 ? shade(cfg.horn, -0.18) : cfg.horn);
      });
    } else {
      // sweeping curved horn
      ctx.beginPath();
      ctx.moveTo(0.24 * r, -0.62 * r);
      ctx.quadraticCurveTo(0.80 * r, -0.70 * r, 0.88 * r, -1.02 * r);
      ctx.quadraticCurveTo(0.58 * r, -0.86 * r, 0.40 * r, -0.76 * r);
      ctx.closePath();
      fillStroke(ctx, cfg.horn);
    }
  }

  // Cog used by the mechanical dragons (forehead gear)
  function drawCog(ctx, x, y, rad, teeth, rot, fill, outline) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? rad * 0.78 : rad;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
    ctx.fillStyle = outline;
    ctx.beginPath(); ctx.arc(0, 0, rad * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // anim: { time (ms), seed, mouth (0..1 jaw opening), maxHp, isBoss }
  function drawDragon(ctx, size, cfg, anim) {
    const r = size / 2;
    const t = anim.time / 1000 + anim.seed;
    const flap = 0.2 + Math.sin(t * 5.4) * 0.42;
    const mouth = Math.max(0.12, Math.min(1, anim.mouth));
    const maxHp = anim.maxHp || 1;
    const detail = r > 16;
    const tiny = r < 14;   // far-away dragons: skip fine detail (they are a few px tall)
    const outline = shade(cfg.body, -0.85);
    const lw = Math.max(1, r * 0.036);
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);

    ctx.save();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.lineWidth = lw; ctx.strokeStyle = outline;

    // ---- aura: armored dragons shimmer, bosses smoulder -------------------
    if (anim.isBoss || maxHp >= 2) {
      const hex = anim.isBoss ? cfg.eye : (maxHp >= 3 ? "#ffd24d" : "#bcd0e6");
      const a = (anim.isBoss ? 0.42 : 0.30) * (0.8 + 0.2 * pulse);
      const g = ctx.createRadialGradient(0, 0.05 * r, r * 0.25, 0, 0.05 * r, r * 1.6);
      g.addColorStop(0, rgba(hex, a));
      g.addColorStop(1, rgba(hex, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0.05 * r, r * 1.6, 0, Math.PI * 2); ctx.fill();
    }

    // ---- tail (peeks out below, ends in a spade) --------------------------
    if (!tiny) {
      const tw = Math.sin(t * 2.2) * 0.08;
      ctx.beginPath();
      ctx.moveTo(0.10 * r, 0.74 * r);
      ctx.quadraticCurveTo(0.62 * r, (1.10 + tw) * r, 0.94 * r, (0.72 + tw) * r);
      ctx.strokeStyle = outline; ctx.lineWidth = r * 0.28; ctx.stroke();
      ctx.strokeStyle = cfg.body; ctx.lineWidth = r * 0.18; ctx.stroke();
      ctx.strokeStyle = outline; ctx.lineWidth = lw;
      polyPath(ctx, r, [[0.86, 0.74 + tw], [1.08, 0.50 + tw], [1.04, 0.84 + tw]]);
      fillStroke(ctx, cfg.spike);

    }

    // ---- wings (behind the body) ------------------------------------------
    drawDragonWing(ctx, r, cfg, flap, outline);
    ctx.save(); ctx.scale(-1, 1); drawDragonWing(ctx, r, cfg, flap, outline); ctx.restore();

    // ---- rear feet with talons --------------------------------------------
    if (!tiny) {
      [-1, 1].forEach((s) => {
        ctx.save(); ctx.scale(s, 1);
        ctx.beginPath(); ctx.ellipse(0.32 * r, 0.86 * r, r * 0.17, r * 0.08, 0, 0, Math.PI * 2);
        fillStroke(ctx, cfg.body);

    }

    // ---- torso, belly plates ----------------------------------------------
    ctx.beginPath();
    ctx.moveTo(-0.30 * r, -0.08 * r);
    ctx.bezierCurveTo(-0.76 * r, 0.00, -0.68 * r, 0.46 * r, -0.32 * r, 0.82 * r);

    ctx.bezierCurveTo(0.68 * r, 0.46 * r, 0.76 * r, 0.00, 0.30 * r, -0.08 * r);
    ctx.closePath();
    fillStroke(ctx, cfg.body);
    ctx.beginPath(); ctx.ellipse(0, 0.40 * r, r * 0.23, r * 0.42, 0, 0, Math.PI * 2);
    fillStroke(ctx, cfg.belly);
    if (detail) {
      // cel shading: dark band on the lower flanks, light rim on the shoulders
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-0.30 * r, -0.08 * r);
      ctx.bezierCurveTo(-0.76 * r, 0.00, -0.68 * r, 0.46 * r, -0.32 * r, 0.82 * r);
      ctx.lineTo(0.32 * r, 0.82 * r);
      ctx.bezierCurveTo(0.68 * r, 0.46 * r, 0.76 * r, 0.00, 0.30 * r, -0.08 * r);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = "rgba(0,0,0,0.20)";
      ctx.beginPath(); ctx.ellipse(0.1 * r, 1.0 * r, r * 0.9, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.13)";
      ctx.beginPath(); ctx.ellipse(-0.42 * r, 0.05 * r, r * 0.16, r * 0.34, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (detail) {
      ctx.strokeStyle = shade(cfg.belly, -0.4); ctx.lineWidth = r * 0.03;
      for (let i = 0; i < 4; i++) {
        const y = 0.12 + i * 0.12, hw = 0.20 - Math.abs(i - 1.2) * 0.015;

      ctx.save(); ctx.globalCompositeOperation = "lighter";

      [[0, 0.30], [-0.14, 0.50], [0.14, 0.50]].forEach(([x, y]) => {
        polyPath(ctx, r, [[x, y - 0.07], [x + 0.045, y], [x, y + 0.07], [x - 0.045, y]]); ctx.fill();
      });
      ctx.restore();
    }

    // ---- arms with claws, shoulder spikes ---------------------------------
    if (!tiny) {
      [-1, 1].forEach((s) => {
        ctx.save(); ctx.scale(s, 1);
        ctx.beginPath();
        ctx.moveTo(0.48 * r, 0.04 * r); ctx.lineTo(0.68 * r, 0.30 * r); ctx.lineTo(0.54 * r, 0.54 * r);
        ctx.strokeStyle = outline; ctx.lineWidth = r * 0.24; ctx.stroke();
        ctx.strokeStyle = cfg.body; ctx.lineWidth = r * 0.16; ctx.stroke();
        ctx.strokeStyle = outline; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(0.54 * r, 0.56 * r, r * 0.11, 0, Math.PI * 2); fillStroke(ctx, cfg.body);
        if (detail) {
          [0.43, 0.54, 0.65].forEach((x) => {
            ctx.beginPath();
            ctx.moveTo((x - 0.045) * r, 0.62 * r);
            ctx.quadraticCurveTo((x - 0.03) * r, 0.88 * r, (x - 0.10) * r, 0.96 * r);
            ctx.quadraticCurveTo((x + 0.05) * r, 0.84 * r, (x + 0.045) * r, 0.62 * r);
            ctx.closePath();
            fillStroke(ctx, "#f2ead0");
          });
        }
        // shoulder pauldron + spike (metal when armored)
        const armor = maxHp >= 3 ? "#ffcf4a" : (maxHp >= 2 ? "#aeb9c6" : cfg.spike);
        ctx.beginPath(); ctx.arc(0.50 * r, 0.00 * r, r * 0.17, 0, Math.PI * 2); fillStroke(ctx, armor);
        polyPath(ctx, r, [[0.50, -0.12], [0.66, -0.36], [0.62, -0.06]]);
        fillStroke(ctx, armor);
        ctx.restore();
      });

    }

    // ---- head frill spikes + horns (behind the head) -----------------------
    if (!tiny) [-1, 1].forEach((s) => {
      ctx.save(); ctx.scale(s, 1);
      [[[0.50, -0.70], [1.02, -0.88], [0.62, -0.52]], [[0.60, -0.52], [1.10, -0.54], [0.66, -0.36]], [[0.62, -0.38], [1.00, -0.18], [0.60, -0.24]]].forEach((pts) => {
        polyPath(ctx, r, pts); fillStroke(ctx, cfg.spike);

    });
    drawDragonHorn(ctx, r, cfg, outline);
    ctx.save(); ctx.scale(-1, 1); drawDragonHorn(ctx, r, cfg, outline); ctx.restore();

    // ---- crest spikes ------------------------------------------------------
    [[0, -0.78, 0.22], [-0.13, -0.77, 0.15], [0.13, -0.77, 0.15]].forEach(([x, y, h]) => {
      polyPath(ctx, r, [[x - 0.06, y + 0.03], [x, y - h], [x + 0.06, y + 0.03]]);

    if (anim.isBoss && cfg.crown) {

    } else if (maxHp >= 3) {

    }

    // ---- head: cranium with cheek spikes ----------------------------------
    const cranium = [[0, -0.80], [0.30, -0.76], [0.56, -0.64], [0.72, -0.44], [0.56, -0.38],
      [0.62, -0.20], [0.42, -0.14], [-0.42, -0.14], [-0.62, -0.20], [-0.56, -0.38],
      [-0.72, -0.44], [-0.56, -0.64], [-0.30, -0.76]];
    polyPath(ctx, r, cranium);
    fillStroke(ctx, cfg.body);
    // darker forehead scale line for depth
    ctx.save();
    polyPath(ctx, r, cranium); ctx.clip();
    ctx.fillStyle = "rgba(0,0,0,0.16)";
    ctx.beginPath(); ctx.ellipse(0, -0.86 * r, r * 0.62, r * 0.20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath(); ctx.ellipse(-0.30 * r, -0.64 * r, r * 0.22, r * 0.07, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // ---- mouth: dark interior, throat glow, tongue, fangs, chin -----------
    const yU = -0.14, yL = yU + 0.03 + mouth * 0.24;
    polyPath(ctx, r, [[-0.40, yU], [0.40, yU], [0.34, yL], [-0.34, yL]]);
    ctx.fillStyle = "#2a0608"; ctx.fill();
    if (!tiny) {
      ctx.save();
      ctx.clip();
      const mg = ctx.createRadialGradient(0, (yU + yL) / 2 * r, 0, 0, (yU + yL) / 2 * r, r * 0.34);
      mg.addColorStop(0, rgba(cfg.mouth, 0.95)); mg.addColorStop(1, rgba(cfg.mouth, 0));
      ctx.fillStyle = mg; ctx.fillRect(-0.5 * r, yU * r, r, (yL - yU) * r);
      ctx.fillStyle = "#c8505f";
      ctx.beginPath(); ctx.ellipse(0, (yL - 0.015) * r, r * 0.17, r * 0.05 + mouth * r * 0.03, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = outline; ctx.lineWidth = lw;
    polyPath(ctx, r, [[-0.40, yU], [0.40, yU], [0.34, yL], [-0.34, yL]]); ctx.stroke();
    // chin / lower jaw
    polyPath(ctx, r, [[-0.40, yL - 0.02], [-0.34, yL], [0.34, yL], [0.40, yL - 0.02], [0.30, yL + 0.14], [0, yL + 0.21], [-0.30, yL + 0.14]]);
    fillStroke(ctx, shade(cfg.body, -0.12));
    // fangs
    [[-0.34, 0.12], [-0.22, 0.17], [-0.10, 0.11], [0.10, 0.11], [0.22, 0.17], [0.34, 0.12]].forEach(([x, h]) => {
      polyPath(ctx, r, [[x - 0.045, yU], [x, yU + h], [x + 0.045, yU]]);
      fillStroke(ctx, "#fbf4dc");
    });
    [[-0.26, 0.10], [-0.10, 0.07], [0.10, 0.07], [0.26, 0.10]].forEach(([x, h]) => {
      polyPath(ctx, r, [[x - 0.04, yL], [x, yL - h], [x + 0.04, yL]]);
      fillStroke(ctx, "#fbf4dc");
    });

    // ---- snout ridge + nostrils --------------------------------------------
    polyPath(ctx, r, [[-0.10, -0.54], [0.10, -0.54], [0.15, -0.28], [0.08, -0.19], [-0.08, -0.19], [-0.15, -0.28]]);
    fillStroke(ctx, shade(cfg.body, 0.14));
    ctx.fillStyle = "#1a0a0a";
    [-1, 1].forEach((s) => { ctx.beginPath(); ctx.ellipse(s * 0.065 * r, -0.26 * r, r * 0.032, r * 0.022, 0, 0, Math.PI * 2); ctx.fill(); });

    // ---- eyes: narrow, glowing, under heavy scowling brows -----------------
    [-1, 1].forEach((s) => {
      ctx.save(); ctx.scale(s, 1);
      ctx.beginPath();
      ctx.moveTo(0.09 * r, -0.46 * r);
      ctx.quadraticCurveTo(0.27 * r, -0.71 * r, 0.50 * r, -0.62 * r);
      ctx.quadraticCurveTo(0.32 * r, -0.44 * r, 0.09 * r, -0.46 * r);
      ctx.closePath();
      fillStroke(ctx, cfg.eye);
      ctx.fillStyle = "#14080a";
      ctx.beginPath(); ctx.ellipse(0.29 * r, -0.555 * r, r * 0.03, r * 0.08, 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    // additive glow so the eyes burn
    if (!tiny) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      [-1, 1].forEach((s) => {
        const ex = s * 0.29 * r, ey = -0.55 * r;
        const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 0.26);
        g.addColorStop(0, rgba(cfg.eye, 0.35 + 0.2 * pulse)); g.addColorStop(1, rgba(cfg.eye, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, r * 0.26, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }
    // brows: thick, slanting down toward the nose
    [-1, 1].forEach((s) => {
      ctx.save(); ctx.scale(s, 1);
      polyPath(ctx, r, [[0.03, -0.55], [0.54, -0.80], [0.56, -0.70], [0.42, -0.66], [0.07, -0.47]]);
      fillStroke(ctx, shade(cfg.body, -0.45));
      ctx.restore();
    });
    if (cfg.visor) {
      ctx.fillStyle = "rgba(10,12,16,0.55)";
      polyPath(ctx, r, [[-0.50, -0.58], [0.50, -0.58], [0.44, -0.50], [-0.44, -0.50]]); ctx.fill();
    }

    // ---- species extras -----------------------------------------------------
    if (cfg.gear && detail) {
      drawCog(ctx, 0, -0.66 * r, r * 0.13, 8, t * 1.5, "#c6a15a", outline);
    }
    if (cfg.fireGlow) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 3; i++) {
        const k = (t * 0.9 + i / 3) % 1;
        ctx.fillStyle = `rgba(255,${150 + i * 30},60,${0.8 * (1 - k)})`;
        ctx.beginPath(); ctx.arc((i - 1) * 0.07 * r + Math.sin(t * 6 + i) * r * 0.02, (-0.28 - k * 0.38) * r, r * (0.045 - k * 0.02), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // ---- armor plates on the head (HP tiers) -------------------------------
    if (maxHp >= 2) {
      polyPath(ctx, r, [[-0.20, -0.66], [0.20, -0.66], [0.14, -0.58], [-0.14, -0.58]]);
      fillStroke(ctx, maxHp >= 3 ? "#ffcf4a" : "#aeb9c6");
    }
    ctx.restore();
  }

  // Monster HP mix by level index within a world (0 = first level, 2 = boss
  // level). Level 1 is always single-hit; later levels mix in armored (2 HP)
  // and, in the final level, elite (3 HP) dragons.
  const HP_DISTRIBUTION_BY_LEVEL_INDEX = [
    [{ hp: 1, weight: 1 }],
    [{ hp: 1, weight: 0.7 }, { hp: 2, weight: 0.3 }],
    [{ hp: 1, weight: 0.5 }, { hp: 2, weight: 0.3 }, { hp: 3, weight: 0.2 }],
  ];
  // Wave 5 of the final level also spawns the boss, which is already that
  // wave's HP challenge — regular dragons alongside it stay single-hit so the
  // boss fight doesn't stack with extra multi-HP pressure at the same time.
  const HP_DISTRIBUTION_LEVEL3_BOSS_WAVE = [{ hp: 1, weight: 1 }];
  function pickWeighted(options) {
    const total = options.reduce((s, o) => s + o.weight, 0);
    let r = Math.random() * total;
    for (const o of options) {
      if (r < o.weight) return o.hp;
      r -= o.weight;
    }
    return options[options.length - 1].hp;
  }
  function hpSpeedMultiplier(hp) {
    return 1 - BALANCE.HP_SPEED_PENALTY_PER_EXTRA_HP * (hp - 1);
  }

  // =========================================================================
  // QUESTION GENERATION — dispatches on level.kind
  // =========================================================================
  const DIFFICULTY_TIER_COUNT = 3;
  const SUBTRACTION_CHANCE_BY_TIER = [0.3, 0.5, 0.7];
  const MULDIV_DIVISION_CHANCE_BY_TIER = [0.3, 0.5, 0.7];
  const MULTIPLICATION_OPERAND_BAND_BY_TIER = [{ min: 1, max: 5 }, { min: 1, max: 8 }, { min: 1, max: 10 }];

  // Word-problem number ranges by tier are shared across languages (only the
  // phrasing and names differ). Templates are natural-language, not translations.
  const WORD_BANDS = {
    add: [{ min: 5, max: 10 }, { min: 8, max: 20 }, { min: 15, max: 50 }],
    sub: [{ min: 5, max: 10 }, { min: 8, max: 20 }, { min: 15, max: 50 }],
    mul: [{ min: 2, max: 5 }, { min: 2, max: 9 }, { min: 2, max: 12 }],
    div: [{ min: 2, max: 5 }, { min: 2, max: 9 }, { min: 2, max: 12 }],
  };

  // Name pools carry gender so English templates can use pronouns after the
  // first mention of a name instead of repeating it. Vietnamese templates
  // don't need this (repeating the name reads naturally in Vietnamese), but
  // the gender field is kept for structural symmetry between the two pools.
  const NAME_POOL_VI = [
    { name: "Lan", gender: "f" }, { name: "Minh", gender: "m" }, { name: "An", gender: "m" },
    { name: "Hoa", gender: "f" }, { name: "Nam", gender: "m" }, { name: "Mai", gender: "f" },
    { name: "Huy", gender: "m" }, { name: "Linh", gender: "f" }, { name: "Bình", gender: "m" },
    { name: "Trang", gender: "f" }, { name: "Long", gender: "m" }, { name: "Chi", gender: "f" },
  ];
  // Named separately (not inline in the array) so generateWordProblem can
  // recognize the classroom template by reference and cap its counts at 20 —
  // a class of 50 students reads as unrealistic even though the tier's normal
  // number band allows it.
  const CLASSROOM_TEMPLATE_VI = (name, a, b) => `Lớp học có ${a} bạn nam và ${b} bạn nữ. Hỏi lớp có tất cả bao nhiêu bạn?`;
  const ADD_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} viên kẹo, được cho thêm ${b} viên. Hỏi ${name} có tất cả bao nhiêu viên kẹo?`,
    CLASSROOM_TEMPLATE_VI,
    (name, a, b) => `${name} hái được ${a} quả táo buổi sáng và ${b} quả táo buổi chiều. Hỏi ${name} hái được tất cả bao nhiêu quả táo?`,
  ];
  const SUB_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} viên kẹo, cho bạn ${b} viên. Hỏi ${name} còn lại mấy viên kẹo?`,

    (name, a, b) => `${name} có ${a} quyển vở, dùng hết ${b} quyển. Hỏi ${name} còn lại mấy quyển vở?`,
  ];
  const MUL_TEMPLATES_VI = [

    (name, a, b) => `Có ${a} rổ táo, mỗi rổ có ${b} quả. Hỏi có tất cả bao nhiêu quả táo?`,

  const DIV_TEMPLATES_VI = [

    (name, a, b) => `Có ${a} quả cam chia đều vào ${b} rổ. Hỏi mỗi rổ có mấy quả cam?`,
    (name, a, b) => `${name} có ${a} cái bánh, xếp đều vào ${b} đĩa. Hỏi mỗi đĩa có mấy cái bánh?`,
  ];

  // English templates are written as natural word problems, not translated
  // from the Vietnamese set above. Templates that mention the name twice use
  // a pronoun (p) for the second mention, matched to the name's gender.
  const NAME_POOL_EN = [
    { name: "Emma", gender: "f" }, { name: "Liam", gender: "m" }, { name: "Noah", gender: "m" },
    { name: "Olivia", gender: "f" }, { name: "Ava", gender: "f" }, { name: "Ethan", gender: "m" },
    { name: "Mia", gender: "f" }, { name: "Lucas", gender: "m" }, { name: "Sophia", gender: "f" },
    { name: "Jack", gender: "m" }, { name: "Isla", gender: "f" }, { name: "Leo", gender: "m" },
  ];
  function pronounsFor(gender) {
    return gender === "f" ? { subj: "she", obj: "her", poss: "her" } : { subj: "he", obj: "him", poss: "his" };
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  const CLASSROOM_TEMPLATE_EN = (name, a, b) => `There are ${a} boys and ${b} girls in the class. How many students are there in total?`;
  const ADD_TEMPLATES_EN = [
    (name, a, b, p) => `${name} has ${a} candies. Then ${p.subj} gets ${b} more. How many candies does ${p.subj} have now?`,
    CLASSROOM_TEMPLATE_EN,
    (name, a, b, p) => `${name} picked ${a} apples in the morning and ${b} more in the afternoon. How many apples did ${p.subj} pick in all?`,
  ];
  const SUB_TEMPLATES_EN = [
    (name, a, b, p) => `${name} has ${a} candies. ${cap(p.subj)} gives ${b} to ${p.poss} friend. How many candies are left?`,
    (name, a, b) => `There were ${a} birds on a branch. ${b} of them flew away. How many birds are left?`,
    (name, a, b, p) => `${name} had ${a} notebooks and used ${b} of them. How many notebooks does ${p.subj} have left?`,
  ];
  const MUL_TEMPLATES_EN = [
    (name, a, b, p) => `${name} has ${a} boxes of pencils, with ${b} pencils in each box. How many pencils does ${p.subj} have in total?`,
    (name, a, b) => `There are ${a} baskets of apples, with ${b} apples in each basket. How many apples are there in total?`,
    (name, a, b, p) => `${name} set up ${a} rows of chairs, with ${b} chairs in each row. How many chairs did ${p.subj} set up in total?`,
  ];
  const DIV_TEMPLATES_EN = [
    (name, a, b) => `${name} has ${a} candies and shares them equally among ${b} friends. How many candies does each friend get?`,
    (name, a, b) => `There are ${a} oranges shared equally into ${b} baskets. How many oranges are in each basket?`,
    (name, a, b) => `${name} has ${a} cookies and arranges them equally on ${b} plates. How many cookies are on each plate?`,
  ];

  const WORD_TEMPLATES = {
    vi: { add: ADD_TEMPLATES_VI, sub: SUB_TEMPLATES_VI, mul: MUL_TEMPLATES_VI, div: DIV_TEMPLATES_VI, names: NAME_POOL_VI },
    en: { add: ADD_TEMPLATES_EN, sub: SUB_TEMPLATES_EN, mul: MUL_TEMPLATES_EN, div: DIV_TEMPLATES_EN, names: NAME_POOL_EN },
  };

  function pickFrom(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  // Picks a random entry from arr, but never the same one as `exclude` (used
  // to stop the same word-problem template from being served twice in a row).
  // Falls back to the only entry if the array has just one.
  function pickFromExcluding(arr, exclude) {
    if (arr.length <= 1) return arr[0];
    let choice;
    do {
      choice = arr[randInt(0, arr.length - 1)];
    } while (choice === exclude);
    return choice;
  }

  const CLASSROOM_COUNT_CAP = 20; // classroom-sized templates never exceed this per count, regardless of tier
  let lastWordTemplate = null; // tracks the last-served template fn across all operations/languages

  // Number constraints audited for degenerate word problems: addition/
  // multiplication/division bands all have a minimum of 2+ (so no "0 more",
  // "shares among 1 group", or "times 0/1" cases). Subtraction/giving-away
  // needs an explicit constraint below since b would otherwise range up to a.
  function generateWordProblem(levelConfig, tierIndex) {
    const op = pickFrom(levelConfig.opSet);
    const templates = WORD_TEMPLATES[currentLang];
    const nameEntry = pickFrom(templates.names);
    const name = nameEntry.name;
    const p = pronounsFor(nameEntry.gender);
    let a, b, answer, text, templateFn;
    if (op === "+") {
      templateFn = pickFromExcluding(templates.add, lastWordTemplate);
      const isClassroom = templateFn === CLASSROOM_TEMPLATE_VI || templateFn === CLASSROOM_TEMPLATE_EN;
      const rawBand = WORD_BANDS.add[tierIndex];
      const band = isClassroom ? { min: rawBand.min, max: Math.min(rawBand.max, CLASSROOM_COUNT_CAP) } : rawBand;
      a = randInt(band.min, band.max);
      b = randInt(band.min, band.max);
      answer = a + b;
      text = templateFn(name, a, b, p);
    } else if (op === "-") {
      templateFn = pickFromExcluding(templates.sub, lastWordTemplate);
      const band = WORD_BANDS.sub[tierIndex];
      a = randInt(band.min, band.max);
      b = randInt(1, a - 1); // strictly less than a, so the result is always > 0 and a != b
      answer = a - b;
      text = templateFn(name, a, b, p);
    } else if (op === "*") {
      templateFn = pickFromExcluding(templates.mul, lastWordTemplate);
      const band = WORD_BANDS.mul[tierIndex];
      a = randInt(band.min, band.max);
      b = randInt(band.min, band.max);
      answer = a * b;
      text = templateFn(name, a, b, p);
    } else {
      templateFn = pickFromExcluding(templates.div, lastWordTemplate);
      const band = WORD_BANDS.div[tierIndex];
      b = randInt(band.min, band.max);
      const quotient = randInt(band.min, band.max);
      a = b * quotient;
      answer = quotient;
      text = templateFn(name, a, b, p);
    }
    lastWordTemplate = templateFn;
    return { isWordProblem: true, text, answer };
  }

  function generateMultiplication(levelConfig, tierIndex) {
    const table = pickFrom(levelConfig.tables);
    const band = MULTIPLICATION_OPERAND_BAND_BY_TIER[tierIndex];
    const operand = randInt(band.min, band.max);
    const swap = Math.random() < 0.5;
    const a = swap ? operand : table;
    const b = swap ? table : operand;
    return { a, b, op: "×", answer: table * operand, isWordProblem: false };
  }

  function generateMixedMulDiv(levelConfig, tierIndex) {
    const doDivision = Math.random() < MULDIV_DIVISION_CHANCE_BY_TIER[tierIndex];
    const table = pickFrom(levelConfig.tables);
    const band = MULTIPLICATION_OPERAND_BAND_BY_TIER[tierIndex];
    const operand = randInt(band.min, band.max);
    if (doDivision) {
      const dividend = table * operand;
      return { a: dividend, b: table, op: "÷", answer: operand, isWordProblem: false };
    }
    const swap = Math.random() < 0.5;
    const a = swap ? operand : table;
    const b = swap ? table : operand;
    return { a, b, op: "×", answer: table * operand, isWordProblem: false };
  }

  function generateArithmetic(levelConfig, tierIndex) {
    const maxSum = levelConfig.maxSum;
    const allowSubtraction = levelConfig.allowSubtraction;
    const subtractionChance = allowSubtraction ? SUBTRACTION_CHANCE_BY_TIER[tierIndex] : 0;
    const doSubtraction = allowSubtraction && Math.random() < subtractionChance;
    let a, b, op, answer;
    if (doSubtraction) {
      a = randInt(2, maxSum);
      b = randInt(1, a);
      op = "-";
      answer = a - b;
    } else {
      a = randInt(0, maxSum);
      b = randInt(0, maxSum - a);
      if (a === 0 && b === 0) { a = randInt(1, maxSum); }
      op = "+";
      answer = a + b;
    }
    return { a, b, op, answer, isWordProblem: false };
  }

  function generateQuestionForLevel(levelConfig, tierIndex) {
    if (levelConfig.kind === "multiplication") return generateMultiplication(levelConfig, tierIndex);
    if (levelConfig.kind === "mixed_muldiv") return generateMixedMulDiv(levelConfig, tierIndex);
    if (levelConfig.kind === "wordproblem") return generateWordProblem(levelConfig, tierIndex);
    return generateArithmetic(levelConfig, tierIndex);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // =========================================================================
  // PROGRESS PERSISTENCE — localStorage only, gameplay unlock state, no PII
  // =========================================================================
  const PROGRESS_KEY = "mathKingdomProgressV2";

  function defaultProgress() {
    const worlds = {};
    WORLDS.forEach((w, i) => { worlds[w.id] = { unlocked: i === 0, unlockedLevel: 1 }; });
    return { worlds };
  }

  function loadProgress() {
    const fallback = defaultProgress();
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      const worlds = {};
      WORLDS.forEach((w, i) => {
        const saved = parsed.worlds && parsed.worlds[w.id];
        const unlocked = i === 0 ? true : !!(saved && saved.unlocked);
        const unlockedLevel = Math.min(w.levels.length, Math.max(1, parseInt(saved && saved.unlockedLevel, 10) || 1));
        worlds[w.id] = { unlocked, unlockedLevel };
      });
      return { worlds };
    } catch (e) {
      return fallback;
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  function getWorldProgress(worldId) {
    if (!progress.worlds[worldId]) {
      progress.worlds[worldId] = { unlocked: false, unlockedLevel: 1 };
    }
    return progress.worlds[worldId];
  }

  let progress = loadProgress();

  // =========================================================================
  // AUDIO — simple Web Audio API synthesized sound effects
  // =========================================================================
  const Audio_ = (function () {
    let ctx = null;
    function getCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
      }
      return ctx;
    }
    function tone(freq, duration, type, startGain, endGain, delay) {
      try {
        const c = getCtx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, c.currentTime + (delay || 0));
        gain.gain.setValueAtTime(startGain != null ? startGain : 0.2, c.currentTime + (delay || 0));
        gain.gain.exponentialRampToValueAtTime(
          Math.max(endGain != null ? endGain : 0.001, 0.001),
          c.currentTime + (delay || 0) + duration
        );
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(c.currentTime + (delay || 0));
        osc.stop(c.currentTime + (delay || 0) + duration);
      } catch (e) { /* audio not available, ignore */ }
    }
    return {
      shoot: function () { tone(880, 0.12, "square", 0.15, 0.001, 0); tone(1200, 0.08, "square", 0.1, 0.001, 0.03); },
      hit: function () { tone(220, 0.15, "sawtooth", 0.2, 0.001, 0); tone(150, 0.2, "sawtooth", 0.15, 0.001, 0.05); },
      wrong: function () { tone(180, 0.25, "sine", 0.18, 0.001, 0); },
      correct: function () { tone(660, 0.1, "sine", 0.15, 0.001, 0); tone(880, 0.12, "sine", 0.15, 0.001, 0.08); },
      heartLost: function () { tone(140, 0.3, "sawtooth", 0.25, 0.001, 0); tone(100, 0.35, "sawtooth", 0.2, 0.001, 0.1); },
      tierUp: function () { tone(523, 0.1, "sine", 0.15, 0.001, 0); tone(659, 0.1, "sine", 0.15, 0.001, 0.1); tone(784, 0.15, "sine", 0.15, 0.001, 0.2); },
      upgrade: function () { tone(700, 0.08, "square", 0.18, 0.001, 0); tone(1000, 0.08, "square", 0.15, 0.001, 0.08); tone(1300, 0.14, "square", 0.15, 0.001, 0.16); },
      victory: function () {
        [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, "sine", 0.2, 0.001, i * 0.15));
      },
      gameOver: function () {
        [400, 350, 300, 200].forEach((f, i) => tone(f, 0.3, "sawtooth", 0.2, 0.001, i * 0.2));
      },
      resumeCtx: function () {
        try {
          const c = getCtx();
          if (c.state === "suspended") c.resume();
        } catch (e) {}
      }
    };
  })();

  // =========================================================================
  // CANVAS SETUP
  // =========================================================================
  const canvas = document.getElementById("canvas");
  const ctx2d = canvas.getContext("2d");

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap: full redraw every frame
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    view = computeView(rect.width, rect.height);
    view.dpr = dpr;
    layersCache = {}; // scenery is repainted for the new size
  }

  // =========================================================================
  // GAME STATE
  // =========================================================================
  let state = {
    mode: "menu", // "menu" | "quiz" | "playing"
    worldIndex: 0,
    levelIndex: 0,
    hearts: BALANCE.TOTAL_HEARTS,
    score: 0,
    wave: 1,
    monstersRemainingToSpawn: 0,
    monstersAliveOrPending: 0,
    monsters: [],
    cannonballs: [],
    cannonRecoil: 0,
    particles: [],
    difficultyIndex: 0,
    correctStreak: 0,
    wrongStreak: 0,
    currentAnswer: "",
    currentQuestion: null,
    running: false,
    inputEnabled: false,
    spawnTimer: 0,
    spawnIntervalMs: BALANCE.BASE_SPAWN_INTERVAL_MS,
    lastFrameTime: 0,
    waveInProgress: false,
    waitingForNextQuestion: false,
    gameEnded: false,
    isBossWave: false,
    quickUnlockWorldId: null,
    quickUnlockStreak: 0,
    cannonStreak: 0,          // consecutive correct answers, drives cannon upgrades
    cannonLevel: 0,           // 0 = base, 1 = upgraded barrel, 2 = dual cannon
    pendingCannonDowngrade: false, // set on a wrong answer; applied at the next wave boundary, not instantly
    cannonSpread: 0,          // 0 = single centred cannon, 1 = two cannons side by side (animated)
    muzzleFlash: 0,           // 1 -> 0 flash at the muzzle right after firing
    shake: 0,                 // 1 -> 0 camera shake when a dragon hits the wall
    flash: 0,                 // 1 -> 0 red screen edge flash when a heart is lost
    laneBag: [],              // shuffled lanes so dragons spread across the width
  };

  function currentLevel() {
    return WORLDS[state.worldIndex].levels[state.levelIndex];
  }
  function currentWorld() {
    return WORLDS[state.worldIndex];
  }

  function newQuestion() {
    state.currentQuestion = generateQuestionForLevel(currentLevel(), state.difficultyIndex);
    state.currentAnswer = "";
    updateQuestionDisplay();
  }

  function updateQuestionDisplay() {
    const q = state.currentQuestion;
    const questionEl = document.getElementById("question");
    if (q.isWordProblem) {
      questionEl.textContent = q.text;
      questionEl.classList.add("wordProblemText");
    } else {
      questionEl.textContent = `${q.a} ${q.op} ${q.b} = ?`;
      questionEl.classList.remove("wordProblemText");
    }
    document.getElementById("answerDisplay").textContent = state.currentAnswer || " ";
  }

  // =========================================================================
  // DIFFICULTY ADAPTATION (adaptive tier within the current level)
  // =========================================================================
  function onCorrectAnswer() {
    state.correctStreak++;
    state.wrongStreak = 0;
    if (state.correctStreak >= BALANCE.STREAK_UP_THRESHOLD && state.difficultyIndex < DIFFICULTY_TIER_COUNT - 1) {
      state.difficultyIndex++;
      state.correctStreak = 0;
      Audio_.tierUp();
      showFeedback(t("niceStreak"), "#2b6cb0");
    }

    state.cannonStreak++;
    updateStreakDisplay();
    const newCannonLevel = cannonLevelForStreak(state.cannonStreak);
    if (newCannonLevel > state.cannonLevel) {
      state.cannonLevel = newCannonLevel;
      state.pendingCannonDowngrade = false;
      triggerCannonUpgradeEffect(newCannonLevel);
    }
  }

  function onWrongAnswer() {
    state.wrongStreak++;
    state.correctStreak = 0;
    if (state.wrongStreak >= BALANCE.STREAK_DOWN_THRESHOLD && state.difficultyIndex > 0) {
      state.difficultyIndex--;
      state.wrongStreak = 0;
    }

    state.cannonStreak = 0;
    state.pendingCannonDowngrade = true;
    updateStreakDisplay();
  }

  // =========================================================================
  // CANNON UPGRADES — driven by a consecutive-correct streak, independent of
  // the difficulty-tier streak above. Upgrades apply the instant they're
  // earned; a wrong answer resets the streak but the cannon itself only
  // downgrades at the next wave boundary (see startWave), so one mistake
  // doesn't feel like it costs you the upgrade immediately.
  // =========================================================================
  function cannonLevelForStreak(streak) {
    if (streak >= BALANCE.CANNON_STREAK_TIER2) return 2;
    if (streak >= BALANCE.CANNON_STREAK_TIER1) return 1;
    return 0;
  }

  function updateStreakDisplay() {
    const el = document.getElementById("streakDisplay");
    if (state.cannonStreak > 0) {
      el.textContent = `🔥 x${state.cannonStreak}`;
      el.style.visibility = "visible";
    } else {
      el.style.visibility = "hidden";
    }
  }

  function triggerCannonUpgradeEffect(level) {
    Audio_.upgrade();
    showFeedback(level >= 2 ? t("cannonUpgraded2") : t("cannonUpgraded1"), "#e8a400");
    const pose = cannonPose(0, null);
    burst(pose.mx, pose.my, 20, { hue: 45, hueRange: 15, speed: 6, up: 2, life: 34, r: 5, light: 68 });
    shockRing(pose.mx, pose.my, "rgba(255,214,77,0.95)", pose.u * 1.2);
  }

  function showFeedback(text, color) {
    const el = document.getElementById("feedback");
    el.textContent = text;
    el.style.color = color || "#333";
    clearTimeout(showFeedback._t);
    showFeedback._t = setTimeout(() => { el.textContent = " "; }, 1200);
  }

  // =========================================================================
  // FIRST-PERSON VIEW — the player stands on the castle rampart behind a
  // cannon and looks out at the horizon. Dragons spawn far away (p = 0) and
  // charge straight at the camera; p = 1 means they have reached the wall.
  // Everything on screen derives from p, a lane (left/right offset) and a
  // hover height, so BALANCE speeds keep their old meaning: "px per frame
  // along a lane BALANCE.TRAVEL_DISTANCE_PX long".
  // =========================================================================
  const VIEW = {
    HORIZON: 0.40,        // horizon line, as a fraction of canvas height
    WALL_TOP: 0.86,       // where an arriving dragon touches the wall
    FAR_SCALE: 0.22,      // apparent size at spawn relative to arrival size
    APPROACH_CURVE: 1.6,  // >1 = stays small for longer, then looms quickly
    SPRITE_H: 0.50,       // dragon height at arrival, fraction of canvas height
    LANE_REACH: 0.34,     // lateral reach at arrival, fraction of canvas width
  };

  function computeView(w, h) {
    return {
      w, h, cx: w / 2,
      horizonY: h * VIEW.HORIZON,
      wallTopY: h * VIEW.WALL_TOP,
      spriteBase: Math.min(h * VIEW.SPRITE_H, w * 0.5),
      laneReach: w * VIEW.LANE_REACH,
      dpr: 1,
    };
  }
  let view = computeView(800, 500);

  function scaleAt(p) {
    return VIEW.FAR_SCALE + (1 - VIEW.FAR_SCALE) * Math.pow(Math.min(1, Math.max(0, p)), VIEW.APPROACH_CURVE);
  }

  // Projects a dragon's (p, lane, hover) onto the screen. Called every frame
  // for every dragon so logic (aiming, hits) and drawing share one answer.
  function layoutMonster(m) {
    const v = view;
    const s = scaleAt(m.p);
    m.s = s;
    m.size = v.spriteBase * m.scale * s;
    m.groundY = v.horizonY + (v.wallTopY - v.horizonY) * s;
    m.sx = v.cx + m.lane * v.laneReach * s;
    m.sy = m.groundY - m.hover * v.spriteBase * s - m.size / 2;
  }

  // =========================================================================
  // MONSTER / WAVE MANAGEMENT
  // =========================================================================
  function monstersInWave(wave) {
    return BALANCE.BASE_MONSTERS_PER_WAVE + (wave - 1) * BALANCE.MONSTERS_PER_WAVE_INCREMENT;
  }
  function speedForWave(wave) {
    const lvl = currentLevel();
    return (BALANCE.BASE_MONSTER_SPEED + (wave - 1) * BALANCE.WAVE_SPEED_INCREMENT) * lvl.monsterSpeedMultiplier;
  }
  function spawnIntervalForWave(wave) {
    return Math.max(
      BALANCE.MIN_SPAWN_INTERVAL_MS,
      BALANCE.BASE_SPAWN_INTERVAL_MS - (wave - 1) * BALANCE.SPAWN_INTERVAL_DECREMENT_MS
    );
  }

  function waveDotsHtml(current) {
    let s = "";
    for (let i = 1; i <= BALANCE.TOTAL_WAVES; i++) {
      s += `<i class="dot${i < current ? " done" : (i === current ? " now" : "")}"></i>`;
    }
    return s;
  }

  function startWave(waveNum) {
    const world = currentWorld();
    const lvl = currentLevel();
    state.wave = waveNum;
    const regularCount = monstersInWave(waveNum);
    state.isBossWave = !!(lvl.hasBoss && waveNum === BALANCE.TOTAL_WAVES);
    state.monstersRemainingToSpawn = regularCount + (state.isBossWave ? 1 : 0);
    state.monstersAliveOrPending = state.monstersRemainingToSpawn;
    state.spawnIntervalMs = spawnIntervalForWave(waveNum);
    state.spawnTimer = 0;
    state.waveInProgress = true;
    document.getElementById("waveInfo").innerHTML =
      `<span class="waveName">${world.emoji} ${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)}</span>` +
      `<span class="waveDots" title="${t("waveLabel")} ${waveNum}/${BALANCE.TOTAL_WAVES}">${waveDotsHtml(waveNum)}</span>`;

    // Cannon downgrades only take effect at a wave boundary, never mid-wave.
    if (state.pendingCannonDowngrade) {
      const recomputed = cannonLevelForStreak(state.cannonStreak);
      if (recomputed < state.cannonLevel) {
        state.cannonLevel = recomputed;
      }
      state.pendingCannonDowngrade = false;
    }
  }

  // Lanes are dealt from a shuffled "bag" so consecutive dragons spread
  // across the whole width instead of piling into one column.
  function nextLane() {
    if (!state.laneBag || state.laneBag.length === 0) {
      const bag = [-0.85, -0.45, 0, 0.45, 0.85];
      for (let i = bag.length - 1; i > 0; i--) {
        const j = randInt(0, i);
        const tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
      }
      state.laneBag = bag;
    }
    return state.laneBag.pop() + (Math.random() - 0.5) * 0.16;
  }

  function spawnMonster() {
    const world = currentWorld();
    const lvl = currentLevel();
    const isBoss = state.isBossWave && state.monstersRemainingToSpawn === 1;
    const speciesList = DRAGON_SPECIES_BY_WORLD[world.id];
    const speciesKey = isBoss ? BOSS_DRAGON_SPECIES_BY_WORLD[world.id] : speciesList[(state.wave - 1) % speciesList.length];
    const isBossWaveOfFinalLevel = state.levelIndex === 2 && state.isBossWave;
    const hpDistribution = isBossWaveOfFinalLevel ? HP_DISTRIBUTION_LEVEL3_BOSS_WAVE : HP_DISTRIBUTION_BY_LEVEL_INDEX[state.levelIndex];
    const hp = isBoss ? BALANCE.BOSS_HP : pickWeighted(hpDistribution);
    const speed = speedForWave(state.wave) * (isBoss ? BALANCE.BOSS_SPEED_MULTIPLIER : hpSpeedMultiplier(hp));
    const travelPx = BALANCE.TRAVEL_DISTANCE_PX * (lvl.travelDistanceMultiplier || 1);
    const m = {
      p: 0,
      speedP: speed / travelPx,          // progress per 60fps frame
      lane: isBoss ? (Math.random() - 0.5) * 0.3 : nextLane(),
      hover: isBoss ? 0.16 : 0.12 + Math.random() * 0.62,
      speciesKey,
      hp,
      maxHp: hp,
      isBoss,
      scale: isBoss ? BALANCE.BOSS_SCALE : 1,
      dying: false,
      dieTimer: 0,
      hitTimer: 0,
      seed: Math.random() * 100,
    };
    layoutMonster(m);
    state.monsters.push(m);
    state.monstersRemainingToSpawn--;
  }

  // =========================================================================
  // CANNONS — first-person: you look over the breech of your cannon. The
  // barrel points at whichever dragon will arrive first. At cannon level 2 a
  // second cannon slides in beside the first.
  // =========================================================================
  function cannonUnit() {
    return Math.min(view.w * 0.14, view.h * 0.22);
  }

  // Menus and the quick-unlock quiz show the plain starting cannon.
  function resetCannonVisuals() {
    state.cannonLevel = 0;
    state.cannonStreak = 0;
    state.pendingCannonDowngrade = false;
  }

  // i: 0 = main cannon, 1 = second cannon. target: the dragon it aims at.
  function cannonPose(i, target) {
    const v = view;
    const u = cannonUnit();
    const spread = state.cannonSpread;
    const bs = state.cannonLevel >= 1 ? BALANCE.CANNON_TIER1_BARREL_SCALE : 1;
    const x = v.cx + (i === 0 ? -1 : 1) * v.w * 0.14 * spread;
    const baseY = v.h * 0.985 + (i === 1 ? (1 - spread) * u * 1.4 : 0);
    const bx = x;
    const by = baseY - u * 0.78 + state.cannonRecoil * u * 0.14;
    let dx = Math.sin(frameTime / 1500 + i * 2) * 0.05, dy = -1;
    if (target) {
      const ax = target.sx - bx, ay = target.sy - by;
      const len = Math.hypot(ax, ay) || 1;
      dx = ax / len;
      dy = Math.min(-0.32, ay / len);   // never point below the horizon of the wall
      const l2 = Math.hypot(dx, dy);
      dx /= l2; dy /= l2;
    }
    const rb = u * 0.36 * bs, rm = u * 0.26 * bs;
    const L = u * 1.2 * (0.62 + 0.38 * Math.abs(dx)) * bs;
    return { i, x, baseY, bx, by, dx, dy, rb, rm, L, u, bs, mx: bx + dx * L, my: by + dy * L };
  }

  // =========================================================================
  // PARTICLES — small helpers shared by hits, upgrades, strikes and popups.
  // =========================================================================
  function addParticle(p) {
    p.maxLife = p.life;
    if (p.r == null) p.r = 4;
    state.particles.push(p);
  }
  function burst(x, y, count, o) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = (0.3 + Math.random() * 0.7) * (o.speed || 5);
      addParticle({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - (o.up || 0),
        life: (o.life || 28) * (0.7 + Math.random() * 0.6),
        r: (o.r || 4) * (0.6 + Math.random() * 0.8),
        g: o.g == null ? 0.15 : o.g,
        color: `hsl(${o.hue + Math.random() * (o.hueRange || 0)}, 95%, ${o.light || 60}%)`,
      });
    }
  }
  function popText(x, y, text, color) {
    addParticle({ x, y, vx: 0, vy: -1.2, g: 0, life: 42, text, color });
  }
  function shockRing(x, y, color, size) {
    addParticle({ x, y, vx: 0, vy: 0, g: 0, life: 20, ring: true, r: size * 0.25, grow: size * 0.05, color });
  }

  // =========================================================================
  // SHOOTING
  // =========================================================================
  // Targeting priority is shortest time-to-wall (remaining progress / own
  // speed), not raw distance. Sorting by distance alone lets a slow, tanky
  // multi-HP dragon get perpetually bypassed by faster newcomers that spawn
  // later but overtake it — "closest" looks locally correct at every instant,
  // yet the slow one can go untouched for its whole approach and reach the
  // wall. Time-to-impact fixes that: whoever will actually arrive soonest
  // is engaged first. Ties (near-simultaneous arrival) favor lower remaining
  // HP, so nearly-dead dragons get finished off rather than left dangling.
  function sortByThreat(monsters) {
    return monsters.slice().sort((a, b) => {
      const ta = (1 - a.p) / a.speedP;
      const tb = (1 - b.p) / b.speedP;
      if (Math.abs(ta - tb) > 1e-6) return ta - tb;
      return a.hp - b.hp;
    });
  }

  // Below cannonLevel 2 this fires one cannonball at the most urgent dragon,
  // same as always. At level 2 (10-streak) each correct answer fires from
  // both cannons at once, targeting the two most urgent dragons.
  function fireAtClosestMonster() {
    const alive = state.monsters.filter(m => !m.dying);
    if (alive.length === 0) return false;
    const sorted = sortByThreat(alive);
    const dual = state.cannonLevel >= 2;
    const targets = dual ? sorted.slice(0, 2) : sorted.slice(0, 1);
    const speedMult = state.cannonLevel >= 1 ? BALANCE.CANNON_TIER1_SPEED_MULT : 1;

    targets.forEach((target, i) => {
      const pose = cannonPose(i, target);
      const dist = Math.max(1, Math.hypot(target.sx - pose.mx, target.sy - pose.my));
      state.cannonballs.push({
        x: pose.mx,
        y: pose.my,
        target,
        initialDist: dist,
        startR: pose.rm * 0.85,
        rotation: 0,
        speedMult,
        trail: [],
      });
      burst(pose.mx, pose.my, 7, { hue: 25, hueRange: 25, speed: 3.2, life: 16, r: 3.5, g: -0.02, light: 70 });
      // smoke drifting up from the muzzle
      for (let k = 0; k < 3; k++) {
        addParticle({ x: pose.mx, y: pose.my, vx: (Math.random() - 0.5) * 1.2, vy: -0.5 - Math.random() * 0.8, g: -0.01, life: 34, r: 7 + Math.random() * 5, smoke: true, color: "rgba(230,230,235,0.55)" });
      }
    });
    state.cannonRecoil = 1;
    state.muzzleFlash = 1;
    Audio_.shoot();
    return true;
  }

  // Small burst of particles at the cannonball's impact point, distinct from
  // the particles hitMonster() spawns at the monster itself.
  function spawnImpactBurst(x, y) {
    burst(x, y, 10, { hue: 20, hueRange: 30, speed: 6, up: 1, life: 20, r: 4, light: 62 });
  }

  // A cannonball landing: regular monsters die in one hit, the boss takes
  // BALANCE.BOSS_HP hits before dying.
  function hitMonster(m) {
    m.hp--;
    state.score += BALANCE.SCORE_PER_CORRECT;
    document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
    Audio_.hit();
    m.hitTimer = 180;
    m.p = Math.max(0, m.p - 0.012); // small knock-back
    burst(m.sx, m.sy, 8, { hue: 30, hueRange: 40, speed: 5, up: 1, life: 28, r: 4 });
    popText(m.sx, m.sy - m.size * 0.45, `+${BALANCE.SCORE_PER_CORRECT}`, "#fff2a8");

    if (m.hp <= 0) {
      m.dying = true;
      m.dieTimer = 0;
      if (m.isBoss) {
        state.score += BALANCE.BOSS_KILL_BONUS;
        document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
        showFeedback(t("bossDefeated"), "#e8590c");
        popText(m.sx, m.sy - m.size * 0.6, `+${BALANCE.BOSS_KILL_BONUS}`, "#ffd24d");
        state.shake = Math.max(state.shake, 0.6);
      }
      burst(m.sx, m.sy, m.isBoss ? 30 : 14, { hue: 15, hueRange: 45, speed: 7, up: 1, life: 34, r: 5 });
      shockRing(m.sx, m.sy, "rgba(255,240,180,0.9)", m.size);
    } else if (m.isBoss) {
      showFeedback(tf("bossHitLeft", { hp: m.hp, maxHp: m.maxHp }), "#e8590c");
    }
  }

  // A dragon reaching the wall: camera shake + red flash + debris.
  function onDragonStrike(m) {
    state.shake = 1;
    state.flash = 1;
    const y = view.wallTopY;
    burst(m.sx, y, 18, { hue: 0, hueRange: 40, speed: 7, up: 3, life: 30, r: 5 });
    shockRing(m.sx, y, "rgba(255,120,90,0.9)", Math.max(60, m.size));
  }

  // =========================================================================
  // HEARTS / GAME END
  // =========================================================================
  function loseHeart() {
    state.hearts--;
    updateHeartsDisplay();
    Audio_.heartLost();
    if (state.hearts <= 0) {
      endGame("gameover");
    }
  }

  function updateHeartsDisplay() {
    let s = "";
    for (let i = 0; i < BALANCE.TOTAL_HEARTS; i++) {
      s += i < state.hearts ? "❤️" : "🖤";
    }
    document.getElementById("hearts").textContent = s;
  }

  function setBottomPanelEnabled(enabled) {
    document.getElementById("bottomPanel").classList.toggle("disabled", !enabled);
  }

  // Word-problem levels reserve three lines of question text, so the panel
  // (and the 3D scene above it) keeps one height for the whole level.
  // Menus use the full screen; the question panel only exists while playing.
  function setMenuLayout(on) {
    document.getElementById("gameContainer").classList.toggle("menuMode", on);
  }
  function setPanelMode(kind) {
    document.getElementById("bottomPanel").classList.toggle("wordMode", kind === "wordproblem");
  }

  function setHudMode(mode) {
    document.getElementById("hudNormal").style.display = mode === "playing" ? "flex" : "none";
    document.getElementById("quickUnlockBar").style.display = mode === "quiz" ? "flex" : "none";
    if (mode !== "playing") {
      document.getElementById("streakDisplay").style.visibility = "hidden";
    }
  }

  // outcome: "gameover" | "levelComplete" | "worldComplete" | "victory"
  function endGame(outcome) {
    if (state.gameEnded) return;
    state.gameEnded = true;
    state.running = false;
    state.inputEnabled = false;
    setBottomPanelEnabled(false);

    const world = currentWorld();
    const lvl = currentLevel();
    const titleEl = document.getElementById("overlayTitle");
    const subEl = document.getElementById("overlaySubtitle");
    const primaryBtn = document.getElementById("primaryBtn");
    document.getElementById("levelSelectBtn").textContent = t("chooseLevel");

    if (outcome === "gameover") {
      titleEl.textContent = t("gameOverTitle");
      subEl.textContent = `${t("scoreLabel")}: ${state.score}`;
      primaryBtn.textContent = t("retryLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      Audio_.gameOver();
    } else if (outcome === "levelComplete") {
      const wp = getWorldProgress(world.id);
      if (wp.unlockedLevel <= lvl.id && lvl.id < world.levels.length) {
        wp.unlockedLevel = lvl.id + 1;
        saveProgress();
      }
      const nextLvl = world.levels[lvl.id];
      titleEl.textContent = `${t("levelCompleteTitle")} ${lvl.emoji}`;
      subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${levelName(world.id, nextLvl.id)}`;
      primaryBtn.textContent = t("nextLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, nextLvl.id); };
      Audio_.victory();
      startConfetti();
    } else if (outcome === "worldComplete") {
      const isLastWorld = world.id >= WORLDS.length;
      if (!isLastWorld) {
        const nextWorld = WORLDS[world.id];
        const nwp = getWorldProgress(nextWorld.id);
        nwp.unlocked = true;
        saveProgress();
        titleEl.textContent = `${t("worldCompleteTitle")} ${world.emoji}`;
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${worldName(nextWorld.id)}`;
        primaryBtn.textContent = t("nextWorld");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); showLevelSelect(nextWorld.id); };
      } else {
        titleEl.textContent = t("victoryTitle");
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("savedKingdom")}`;
        primaryBtn.textContent = t("retryLevel");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      }
      Audio_.victory();
      startConfetti();
    }

    document.getElementById("overlay").classList.add("active");
  }

  // Confetti particles for victory (canvas-drawn, separate lightweight system)
  let confetti = [];
  function startConfetti() {
    confetti = [];
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < 80; i++) {
      confetti.push({
        x: Math.random() * rect.width,
        y: -20 - Math.random() * rect.height,
        vy: 2 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 2,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`,
        size: 4 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

    document.getElementById("langBtnVi").classList.toggle("activeLang", currentLang === "vi");
    document.getElementById("langBtnEn").classList.toggle("activeLang", currentLang === "en");
  }

  function setLanguage(lang) {
    if (lang !== "vi" && lang !== "en") return;
    currentLang = lang;
    saveLang(lang);
