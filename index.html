<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Kingdom</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(#87CEEB, #B0E0E6);
    font-family: 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
    touch-action: manipulation;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #canvasWrapper {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10px 16px;
    pointer-events: none;
    z-index: 10;
  }
  #hudNormal, #quickUnlockBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  #hearts, #score, #waveInfo, #quickUnlockProgress {
    font-size: clamp(13px, 3vw, 22px);
    font-weight: bold;
    color: #3b2a1a;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff;
    white-space: nowrap;
  }
  #quickUnlockCancelBtn {
    pointer-events: auto;
    padding: 6px 14px;
    font-size: 14px;
  }
  #bottomPanel {
    flex: 0 0 auto;
    background: #fff8e7;
    border-top: 4px solid #d4a94c;
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
  }
  #bottomPanel.disabled {
    opacity: 0.45;
    pointer-events: none;
  }
  #question {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: bold;
    color: #4a3728;
    letter-spacing: 2px;
  }
  #question.wordProblemText {
    font-size: clamp(14px, 2.8vw, 21px);
    letter-spacing: normal;
    line-height: 1.35;
    max-width: 620px;
    font-weight: bold;
  }
  #feedback {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    min-height: 1.4em;
    transition: opacity 0.2s;
  }
  #answerDisplay {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: bold;
    color: #2b6cb0;
    min-height: 1.2em;
    border-bottom: 3px solid #2b6cb0;
    padding: 0 12px;
    min-width: 60px;
    text-align: center;
  }
  #numpad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 480px;
  }
  .numBtn {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: bold;
    padding: 10px 0;
    border-radius: 10px;
    border: none;
    background: linear-gradient(#ffd166, #f4a825);
    color: #4a3728;
    box-shadow: 0 3px 0 #b5791b;
    cursor: pointer;
  }
  .numBtn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b5791b;
  }
  .numBtn.clear { background: linear-gradient(#ff8a80, #e5544a); box-shadow: 0 3px 0 #a13a32; }
  .numBtn.enter { background: linear-gradient(#8bd17c, #57a349); box-shadow: 0 3px 0 #3d7332; }

  /* Overlays are sized to canvasWrapper only, so they never cover the number pad */
  #overlay, #worldSelectOverlay, #levelSelectOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 16px;
    overflow-y: auto;
  }
  #overlay {
    background: rgba(0,0,0,0.68);
    z-index: 20;
  }
  #overlay.active { display: flex; }
  #worldSelectOverlay, #levelSelectOverlay {
    background: rgba(20,20,40,0.82);
    z-index: 30;
  }
  #worldSelectOverlay.active, #levelSelectOverlay.active { display: flex; }
  #overlayTitle {
    font-size: clamp(30px, 7vw, 56px);
    font-weight: bold;
    margin-bottom: 8px;
  }
  #overlaySubtitle {
    font-size: clamp(16px, 3.5vw, 22px);
    margin-bottom: 20px;
  }
  #overlayButtons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .overlayBtn {
    font-size: clamp(18px, 4.2vw, 26px);
    font-weight: bold;
    padding: 12px 32px;
    border-radius: 14px;
    border: none;
    color: white;
    cursor: pointer;
  }
  .overlayBtn.primary {
    background: linear-gradient(#8bd17c, #57a349);
    box-shadow: 0 5px 0 #3d7332;
  }
  .overlayBtn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #3d7332; }
  .overlayBtn.secondary {
    background: linear-gradient(#74b9ff, #3f8efc);
    box-shadow: 0 5px 0 #2a5da0;
  }
  .overlayBtn.secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 #2a5da0; }

  #worldSelectOverlay h1, #levelSelectOverlay h1 { font-size: clamp(26px, 6.5vw, 44px); margin: 0 0 6px; }
  #worldSelectOverlay p, #levelSelectOverlay p { font-size: clamp(13px, 3vw, 17px); max-width: 560px; margin: 4px 0 12px; }

  #langToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
  }
  .langBtn {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.15);
    color: white;
    cursor: pointer;
  }
  .langBtn.activeLang {
    background: rgba(255,255,255,0.92);
    color: #222;
    border-color: #fff;
    font-weight: bold;
  }

  #levelSelectHeader {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  #backToWorldsBtn {
    font-size: clamp(13px, 3vw, 16px);
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    cursor: pointer;
  }

  #worldCards, #levelCards {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 640px;
  }
  .worldCard {
    width: 175px;
    padding: 16px 12px;
    border-radius: 16px;
    background: linear-gradient(#6dd5ed, #2193b0);
    box-shadow: 0 4px 0 #1a6f85;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .worldCard.locked {
    background: linear-gradient(#8a8a8a, #5a5a5a);
    box-shadow: 0 4px 0 #333;
    opacity: 0.9;
  }
  .worldCardEmoji { font-size: 34px; }
  .worldCardTitle { font-weight: bold; font-size: 14px; margin-top: 4px; }
  .worldCardAge { font-size: 12px; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 8px; }
  .worldCardSub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .worldActionBtn {
    margin-top: 8px;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    color: white;
    cursor: pointer;
    width: 100%;
  }
  .worldActionBtn.primary { background: linear-gradient(#8bd17c, #57a349); box-shadow: 0 3px 0 #3d7332; }
  .worldActionBtn.secondary { background: linear-gradient(#f4a825, #d4820f); box-shadow: 0 3px 0 #8a5606; }
  .worldActionBtn:active { transform: translateY(2px); }

  .levelCard {
    width: 150px;
    padding: 16px 10px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(#6dd5ed, #2193b0);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 0 #1a6f85;
  }
  .levelCard:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a6f85; }
  .levelCard.locked {
    background: linear-gradient(#8a8a8a, #5a5a5a);
    cursor: not-allowed;
    box-shadow: 0 4px 0 #333;
    opacity: 0.75;
  }
  .levelCardEmoji { font-size: 36px; }
  .levelCardTitle { font-weight: bold; font-size: 15px; margin-top: 6px; }
  .levelCardSub { font-size: 12px; margin-top: 4px; opacity: 0.9; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="canvasWrapper">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="hudNormal">
        <div id="hearts">❤️❤️❤️</div>
        <div id="waveInfo">Select a World</div>
        <div id="score">Score: 0</div>
      </div>
      <div id="quickUnlockBar" style="display:none;">
        <div id="quickUnlockProgress">Quick Unlock: 0/3</div>
        <button id="quickUnlockCancelBtn" class="overlayBtn secondary">✕ Cancel</button>
      </div>
    </div>
    <div id="overlay">
      <div id="overlayTitle">Game Over</div>
      <div id="overlaySubtitle">Score: 0</div>
      <div id="overlayButtons">
        <button id="primaryBtn" class="overlayBtn primary">Retry Level</button>
        <button id="levelSelectBtn" class="overlayBtn secondary">Choose Level</button>
      </div>
    </div>
    <div id="worldSelectOverlay" class="active">
      <div id="langToggle">
        <button id="langBtnVi" class="langBtn">🇻🇳 VI</button>
        <button id="langBtnEn" class="langBtn">🇬🇧 EN</button>
      </div>
      <h1>🏰 Math Kingdom 👾</h1>
      <p>Choose your world!</p>
      <div id="worldCards"></div>
    </div>
    <div id="levelSelectOverlay">
      <div id="levelSelectHeader">
        <button id="backToWorldsBtn">← Worlds</button>
        <h1 id="levelSelectTitle" style="margin:0;">World</h1>
      </div>
      <div id="levelCards"></div>
    </div>
  </div>
  <div id="bottomPanel" class="disabled">
    <div id="question">7 + 5 = ?</div>
    <div id="feedback">&nbsp;</div>
    <div id="answerDisplay">&nbsp;</div>
    <div id="numpad">
      <button class="numBtn" data-key="1">1</button>
      <button class="numBtn" data-key="2">2</button>
      <button class="numBtn" data-key="3">3</button>
      <button class="numBtn" data-key="4">4</button>
      <button class="numBtn" data-key="5">5</button>
      <button class="numBtn clear" data-key="clear">C</button>
      <button class="numBtn" data-key="6">6</button>
      <button class="numBtn" data-key="7">7</button>
      <button class="numBtn" data-key="8">8</button>
      <button class="numBtn" data-key="9">9</button>
      <button class="numBtn" data-key="0">0</button>
      <button class="numBtn enter" data-key="enter">✓</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // =========================================================================
  // GAME BALANCE CONSTANTS — tune these to change difficulty/feel
  // =========================================================================
  const BALANCE = {
    TOTAL_HEARTS: 3,              // lives before Game Over
    TOTAL_WAVES: 5,               // waves to clear per level
    BASE_MONSTER_SPEED: 0.35,     // px/frame at wave 1 (base, before per-wave scaling)
    WAVE_SPEED_INCREMENT: 0.07,   // added to monster speed per wave
    BASE_MONSTERS_PER_WAVE: 4,    // monsters in wave 1
    MONSTERS_PER_WAVE_INCREMENT: 2, // extra monsters added each subsequent wave
    BASE_SPAWN_INTERVAL_MS: 2600, // ms between spawns at wave 1
    SPAWN_INTERVAL_DECREMENT_MS: 250, // spawn gets faster (smaller interval) each wave
    MIN_SPAWN_INTERVAL_MS: 900,   // floor for spawn interval
    ARROW_SPEED: 9,               // px/frame for arrow projectile
    SCORE_PER_CORRECT: 10,        // points per monster kill (or per boss hit)
    STREAK_UP_THRESHOLD: 5,       // consecutive correct answers to raise difficulty tier
    STREAK_DOWN_THRESHOLD: 2,     // consecutive wrong answers to lower difficulty tier
    WRONG_ANSWER_DISPLAY_MS: 1500,// how long the correct answer is shown after a wrong guess
    MONSTER_EMOJIS: ["👾", "🧟", "🐉", "👹", "🦖"], // cycled per wave
    CASTLE_X_FRACTION: 0.08,      // castle position as fraction of canvas width from left
    SPAWN_X_FRACTION: 0.98,       // default spawn position as fraction of canvas width from left
    BOSS_EMOJI: "🐲",             // default final-wave boss sprite (overridable per level)
    BOSS_HP: 3,                   // correct answers needed to defeat the boss
    BOSS_KILL_BONUS: 30,          // extra score on top of per-hit score when boss dies
    BOSS_SCALE: 1.7,              // boss render size multiplier vs a regular monster
    BOSS_SPEED_MULTIPLIER: 0.8,   // boss moves a bit slower than regular monsters despite being tougher
    QUICK_UNLOCK_STREAK_REQUIRED: 3, // consecutive correct sample answers to skip-unlock a world
  };

  // =========================================================================
  // I18N — every user-facing string lives here. Default language: Vietnamese.
  // =========================================================================
  const I18N = {
    vi: {
      gameTitle: "🏰 Math Kingdom 👾",
      tagline: "Chọn thế giới của bạn! Quái vật đang tiến về lâu đài — giải toán để bắn hạ chúng.",
      selectWorldPlaceholder: "Chọn Thế Giới",
      worldLabel: "Thế giới",
      levelLabel: "Cấp",
      waveLabel: "Màn",
      scoreLabel: "Điểm",
      play: "Chơi",
      lockedWorldSub: "Khóa — hoàn thành world trước để mở, hoặc:",
      quickUnlock: "Mở khóa nhanh ⚡",
      tapToPlay: "Chạm để chơi",
      locked: "Khóa",
      backToWorlds: "← Thế giới",
      chooseLevel: "Chọn Level",
      retryLevel: "Chơi lại",
      nextLevel: "Level tiếp theo",
      nextWorld: "Thế giới tiếp theo",
      gameOverTitle: "Thua rồi!",
      levelCompleteTitle: "Xong Level!",
      worldCompleteTitle: "Xong Thế giới!",
      victoryTitle: "Chiến thắng! 🎉",
      nextUp: "Tiếp theo",
      savedKingdom: "Bạn đã cứu vương quốc!",
      correct: "Đúng rồi! 🎯",
      oopsAnswerWas: "Sai rồi! Đáp án đúng là",
      niceStreak: "Giỏi quá! Câu khó hơn nhé 🌟",
      bossDefeated: "Đã hạ gục Trùm! 💥",
      bossHitLeft: "Trúng Trùm! Còn {hp}/{maxHp} 🛡️",
      cancel: "✕ Hủy",
      quickUnlockProgressLabel: "Mở khóa nhanh",
      correctInARow: "đúng liên tiếp",
      quickUnlockWrong: "Sai rồi! Đáp án là {ans}. Thử lại nhé!",
      worlds: {
        1: "Vương Quốc Cộng Trừ",
        2: "Vương quốc Phép Nhân",
        3: "Xứ sở Toán Đố",
      },
      ageRanges: { 1: "6-8 tuổi", 2: "8-10 tuổi", 3: "10-12 tuổi" },
      levels: {
        "1-1": "Làng", "1-2": "Rừng", "1-3": "Lâu đài Rồng",
        "2-1": "Chợ Nhân", "2-2": "Xưởng Máy", "2-3": "Tháp Pháp Sư",
        "3-1": "Làng Kể Chuyện", "3-2": "Chợ Bài Toán", "3-3": "Đền Trí Tuệ",
      },
    },
    en: {
      gameTitle: "🏰 Math Kingdom 👾",
      tagline: "Choose your world! Monsters are marching on the castle — solve the math to shoot them down.",
      selectWorldPlaceholder: "Select a World",
      worldLabel: "World",
      levelLabel: "Level",
      waveLabel: "Wave",
      scoreLabel: "Score",
      play: "Play",
      lockedWorldSub: "Locked — finish the previous world to unlock, or:",
      quickUnlock: "Quick Unlock ⚡",
      tapToPlay: "Tap to play",
      locked: "Locked",
      backToWorlds: "← Worlds",
      chooseLevel: "Choose Level",
      retryLevel: "Retry Level",
      nextLevel: "Next Level",
      nextWorld: "Next World",
      gameOverTitle: "Game Over",
      levelCompleteTitle: "Level Complete!",
      worldCompleteTitle: "World Complete!",
      victoryTitle: "Victory! 🎉",
      nextUp: "Next up",
      savedKingdom: "You saved the kingdom!",
      correct: "Correct! 🎯",
      oopsAnswerWas: "Oops! Answer was",
      niceStreak: "Nice streak! Harder questions 🌟",
      bossDefeated: "Boss defeated! 💥",
      bossHitLeft: "Boss hit! {hp}/{maxHp} left 🛡️",
      cancel: "✕ Cancel",
      quickUnlockProgressLabel: "Quick Unlock",
      correctInARow: "correct in a row",
      quickUnlockWrong: "Not quite! The answer was {ans}. Try again!",
      worlds: {
        1: "Addition & Subtraction Kingdom",
        2: "Multiplication Kingdom",
        3: "Word Problem Land",
      },
      ageRanges: { 1: "ages 6-8", 2: "ages 8-10", 3: "ages 10-12" },
      levels: {
        "1-1": "Village", "1-2": "Forest", "1-3": "Dragon Castle",
        "2-1": "Market", "2-2": "Factory", "2-3": "Wizard Tower",
        "3-1": "Story Village", "3-2": "Word Bazaar", "3-3": "Temple of Wisdom",
      },
    },
  };

  const LANG_KEY = "mathKingdomLang";
  function loadLang() {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "vi" || saved === "en") return saved;
    } catch (e) { /* storage unavailable */ }
    return "vi";
  }
  function saveLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable */ }
  }
  let currentLang = loadLang();

  function t(key) { return I18N[currentLang][key]; }
  function tf(key, vars) {
    let s = I18N[currentLang][key];
    Object.keys(vars).forEach((k) => { s = s.replace(`{${k}}`, vars[k]); });
    return s;
  }
  function worldName(worldId) { return I18N[currentLang].worlds[worldId]; }
  function levelName(worldId, levelId) { return I18N[currentLang].levels[`${worldId}-${levelId}`]; }
  function ageRangeText(worldId) { return I18N[currentLang].ageRanges[worldId]; }

  // =========================================================================
  // WORLDS — each world is a themed set of 3 levels (level 3 = boss wave).
  // Names/labels are looked up from I18N by id, not stored here, so the
  // whole game can be relanguaged without touching this structure.
  // =========================================================================
  const WORLDS = [
    {
      id: 1,
      emoji: "🏰",
      levels: [
        { id: 1, emoji: "🏘️", kind: "arithmetic", maxSum: 10, allowSubtraction: false, monsterSpeedMultiplier: 1.0, hasBoss: false },
        { id: 2, emoji: "🌲", kind: "arithmetic", maxSum: 20, allowSubtraction: true, monsterSpeedMultiplier: 1.0, hasBoss: false },
        { id: 3, emoji: "🐉", kind: "arithmetic", maxSum: 20, allowSubtraction: true, monsterSpeedMultiplier: 1.35, hasBoss: true, bossEmoji: "🐲" },
      ],
    },
    {
      id: 2,
      emoji: "✖️",
      levels: [
        { id: 1, emoji: "🛒", kind: "multiplication", tables: [2, 3, 4, 5], monsterSpeedMultiplier: 1.0, hasBoss: false },
        { id: 2, emoji: "⚙️", kind: "multiplication", tables: [6, 7, 8, 9], monsterSpeedMultiplier: 1.0, hasBoss: false },
        { id: 3, emoji: "🔮", kind: "mixed_muldiv", tables: [2, 3, 4, 5, 6, 7, 8, 9], monsterSpeedMultiplier: 1.35, hasBoss: true, bossEmoji: "🧙" },
      ],
    },
    {
      id: 3,
      emoji: "📖",
      levels: [
        { id: 1, emoji: "📗", kind: "wordproblem", opSet: ["+", "-"], monsterSpeedMultiplier: 0.7, spawnXFraction: 1.15, hasBoss: false },
        { id: 2, emoji: "📘", kind: "wordproblem", opSet: ["+", "-", "*"], monsterSpeedMultiplier: 0.7, spawnXFraction: 1.15, hasBoss: false },
        { id: 3, emoji: "📕", kind: "wordproblem", opSet: ["+", "-", "*", "/"], monsterSpeedMultiplier: 0.7, spawnXFraction: 1.15, hasBoss: true, bossEmoji: "🦉" },
      ],
    },
  ];

  function getWorld(worldId) {
    return WORLDS.find(w => w.id === worldId);
  }

  // =========================================================================
  // QUESTION GENERATION — dispatches on level.kind
  // =========================================================================
  const DIFFICULTY_TIER_COUNT = 3;
  const SUBTRACTION_CHANCE_BY_TIER = [0.3, 0.5, 0.7];
  const MULDIV_DIVISION_CHANCE_BY_TIER = [0.3, 0.5, 0.7];
  const MULTIPLICATION_OPERAND_BAND_BY_TIER = [{ min: 1, max: 5 }, { min: 1, max: 8 }, { min: 1, max: 10 }];

  // Word-problem number ranges by tier are shared across languages (only the
  // phrasing and names differ). Templates are natural-language, not translations.
  const WORD_BANDS = {
    add: [{ min: 5, max: 10 }, { min: 8, max: 20 }, { min: 15, max: 50 }],
    sub: [{ min: 5, max: 10 }, { min: 8, max: 20 }, { min: 15, max: 50 }],
    mul: [{ min: 2, max: 5 }, { min: 2, max: 9 }, { min: 2, max: 12 }],
    div: [{ min: 2, max: 5 }, { min: 2, max: 9 }, { min: 2, max: 12 }],
  };

  const NAME_POOL_VI = ["Lan", "Minh", "An", "Hoa", "Nam", "Mai", "Huy", "Linh", "Bình", "Trang", "Long", "Chi"];
  const ADD_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} viên kẹo, được cho thêm ${b} viên. Hỏi ${name} có tất cả bao nhiêu viên kẹo?`,
    (name, a, b) => `Lớp học có ${a} bạn nam và ${b} bạn nữ. Hỏi lớp có tất cả bao nhiêu bạn?`,
    (name, a, b) => `${name} hái được ${a} quả táo buổi sáng và ${b} quả táo buổi chiều. Hỏi ${name} hái được tất cả bao nhiêu quả táo?`,
  ];
  const SUB_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} viên kẹo, cho bạn ${b} viên. Hỏi ${name} còn lại mấy viên kẹo?`,
    (name, a, b) => `Trên cây có ${a} con chim, ${b} con bay đi. Hỏi trên cây còn lại mấy con chim?`,
    (name, a, b) => `${name} có ${a} quyển vở, dùng hết ${b} quyển. Hỏi ${name} còn lại mấy quyển vở?`,
  ];
  const MUL_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} hộp bút, mỗi hộp có ${b} cái bút. Hỏi ${name} có tất cả bao nhiêu cái bút?`,
    (name, a, b) => `Có ${a} rổ táo, mỗi rổ có ${b} quả. Hỏi có tất cả bao nhiêu quả táo?`,
    (name, a, b) => `${name} xếp ${a} hàng ghế, mỗi hàng có ${b} cái ghế. Hỏi có tất cả bao nhiêu cái ghế?`,
  ];
  const DIV_TEMPLATES_VI = [
    (name, a, b) => `${name} có ${a} viên kẹo, chia đều cho ${b} bạn. Hỏi mỗi bạn được mấy viên kẹo?`,
    (name, a, b) => `Có ${a} quả cam chia đều vào ${b} rổ. Hỏi mỗi rổ có mấy quả cam?`,
    (name, a, b) => `${name} có ${a} cái bánh, xếp đều vào ${b} đĩa. Hỏi mỗi đĩa có mấy cái bánh?`,
  ];

  // English templates are written as natural word problems, not translated
  // from the Vietnamese set above.
  const NAME_POOL_EN = ["Emma", "Liam", "Noah", "Olivia", "Ava", "Ethan", "Mia", "Lucas", "Sophia", "Jack", "Isla", "Leo"];
  const ADD_TEMPLATES_EN = [
    (name, a, b) => `${name} has ${a} candies. Then ${name} gets ${b} more. How many candies does ${name} have now?`,
    (name, a, b) => `There are ${a} boys and ${b} girls in the class. How many students are there in total?`,
    (name, a, b) => `${name} picked ${a} apples in the morning and ${b} apples in the afternoon. How many apples in all?`,
  ];
  const SUB_TEMPLATES_EN = [
    (name, a, b) => `${name} has ${a} candies. ${name} gives ${b} to a friend. How many candies are left?`,
    (name, a, b) => `There were ${a} birds on a branch. ${b} of them flew away. How many birds are left?`,
    (name, a, b) => `${name} had ${a} notebooks and used ${b} of them. How many notebooks does ${name} have left?`,
  ];
  const MUL_TEMPLATES_EN = [
    (name, a, b) => `${name} has ${a} boxes of pencils, with ${b} pencils in each box. How many pencils in total?`,
    (name, a, b) => `There are ${a} baskets of apples, with ${b} apples in each basket. How many apples in total?`,
    (name, a, b) => `${name} set up ${a} rows of chairs, with ${b} chairs in each row. How many chairs in total?`,
  ];
  const DIV_TEMPLATES_EN = [
    (name, a, b) => `${name} has ${a} candies and shares them equally among ${b} friends. How many candies does each friend get?`,
    (name, a, b) => `There are ${a} oranges shared equally into ${b} baskets. How many oranges are in each basket?`,
    (name, a, b) => `${name} has ${a} cookies arranged equally on ${b} plates. How many cookies are on each plate?`,
  ];

  const WORD_TEMPLATES = {
    vi: { add: ADD_TEMPLATES_VI, sub: SUB_TEMPLATES_VI, mul: MUL_TEMPLATES_VI, div: DIV_TEMPLATES_VI, names: NAME_POOL_VI },
    en: { add: ADD_TEMPLATES_EN, sub: SUB_TEMPLATES_EN, mul: MUL_TEMPLATES_EN, div: DIV_TEMPLATES_EN, names: NAME_POOL_EN },
  };

  function pickFrom(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  function generateWordProblem(levelConfig, tierIndex) {
    const op = pickFrom(levelConfig.opSet);
    const templates = WORD_TEMPLATES[currentLang];
    const name = pickFrom(templates.names);
    let a, b, answer, text;
    if (op === "+") {
      const band = WORD_BANDS.add[tierIndex];
      a = randInt(band.min, band.max);
      b = randInt(band.min, band.max);
      answer = a + b;
      text = pickFrom(templates.add)(name, a, b);
    } else if (op === "-") {
      const band = WORD_BANDS.sub[tierIndex];
      a = randInt(band.min, band.max);
      b = randInt(1, a);
      answer = a - b;
      text = pickFrom(templates.sub)(name, a, b);
    } else if (op === "*") {
      const band = WORD_BANDS.mul[tierIndex];
      a = randInt(band.min, band.max);
      b = randInt(band.min, band.max);
      answer = a * b;
      text = pickFrom(templates.mul)(name, a, b);
    } else {
      const band = WORD_BANDS.div[tierIndex];
      b = randInt(band.min, band.max);
      const quotient = randInt(band.min, band.max);
      a = b * quotient;
      answer = quotient;
      text = pickFrom(templates.div)(name, a, b);
    }
    return { isWordProblem: true, text, answer };
  }

  function generateMultiplication(levelConfig, tierIndex) {
    const table = pickFrom(levelConfig.tables);
    const band = MULTIPLICATION_OPERAND_BAND_BY_TIER[tierIndex];
    const operand = randInt(band.min, band.max);
    const swap = Math.random() < 0.5;
    const a = swap ? operand : table;
    const b = swap ? table : operand;
    return { a, b, op: "×", answer: table * operand, isWordProblem: false };
  }

  function generateMixedMulDiv(levelConfig, tierIndex) {
    const doDivision = Math.random() < MULDIV_DIVISION_CHANCE_BY_TIER[tierIndex];
    const table = pickFrom(levelConfig.tables);
    const band = MULTIPLICATION_OPERAND_BAND_BY_TIER[tierIndex];
    const operand = randInt(band.min, band.max);
    if (doDivision) {
      const dividend = table * operand;
      return { a: dividend, b: table, op: "÷", answer: operand, isWordProblem: false };
    }
    const swap = Math.random() < 0.5;
    const a = swap ? operand : table;
    const b = swap ? table : operand;
    return { a, b, op: "×", answer: table * operand, isWordProblem: false };
  }

  function generateArithmetic(levelConfig, tierIndex) {
    const maxSum = levelConfig.maxSum;
    const allowSubtraction = levelConfig.allowSubtraction;
    const subtractionChance = allowSubtraction ? SUBTRACTION_CHANCE_BY_TIER[tierIndex] : 0;
    const doSubtraction = allowSubtraction && Math.random() < subtractionChance;
    let a, b, op, answer;
    if (doSubtraction) {
      a = randInt(2, maxSum);
      b = randInt(1, a);
      op = "-";
      answer = a - b;
    } else {
      a = randInt(0, maxSum);
      b = randInt(0, maxSum - a);
      if (a === 0 && b === 0) { a = randInt(1, maxSum); }
      op = "+";
      answer = a + b;
    }
    return { a, b, op, answer, isWordProblem: false };
  }

  function generateQuestionForLevel(levelConfig, tierIndex) {
    if (levelConfig.kind === "multiplication") return generateMultiplication(levelConfig, tierIndex);
    if (levelConfig.kind === "mixed_muldiv") return generateMixedMulDiv(levelConfig, tierIndex);
    if (levelConfig.kind === "wordproblem") return generateWordProblem(levelConfig, tierIndex);
    return generateArithmetic(levelConfig, tierIndex);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // =========================================================================
  // PROGRESS PERSISTENCE — localStorage only, gameplay unlock state, no PII
  // =========================================================================
  const PROGRESS_KEY = "mathKingdomProgressV2";

  function defaultProgress() {
    const worlds = {};
    WORLDS.forEach((w, i) => { worlds[w.id] = { unlocked: i === 0, unlockedLevel: 1 }; });
    return { worlds };
  }

  function loadProgress() {
    const fallback = defaultProgress();
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      const worlds = {};
      WORLDS.forEach((w, i) => {
        const saved = parsed.worlds && parsed.worlds[w.id];
        const unlocked = i === 0 ? true : !!(saved && saved.unlocked);
        const unlockedLevel = Math.min(w.levels.length, Math.max(1, parseInt(saved && saved.unlockedLevel, 10) || 1));
        worlds[w.id] = { unlocked, unlockedLevel };
      });
      return { worlds };
    } catch (e) {
      return fallback;
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  function getWorldProgress(worldId) {
    if (!progress.worlds[worldId]) {
      progress.worlds[worldId] = { unlocked: false, unlockedLevel: 1 };
    }
    return progress.worlds[worldId];
  }

  let progress = loadProgress();

  // =========================================================================
  // AUDIO — simple Web Audio API synthesized sound effects
  // =========================================================================
  const Audio_ = (function () {
    let ctx = null;
    function getCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
      }
      return ctx;
    }
    function tone(freq, duration, type, startGain, endGain, delay) {
      try {
        const c = getCtx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, c.currentTime + (delay || 0));
        gain.gain.setValueAtTime(startGain != null ? startGain : 0.2, c.currentTime + (delay || 0));
        gain.gain.exponentialRampToValueAtTime(
          Math.max(endGain != null ? endGain : 0.001, 0.001),
          c.currentTime + (delay || 0) + duration
        );
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(c.currentTime + (delay || 0));
        osc.stop(c.currentTime + (delay || 0) + duration);
      } catch (e) { /* audio not available, ignore */ }
    }
    return {
      shoot: function () { tone(880, 0.12, "square", 0.15, 0.001, 0); tone(1200, 0.08, "square", 0.1, 0.001, 0.03); },
      hit: function () { tone(220, 0.15, "sawtooth", 0.2, 0.001, 0); tone(150, 0.2, "sawtooth", 0.15, 0.001, 0.05); },
      wrong: function () { tone(180, 0.25, "sine", 0.18, 0.001, 0); },
      correct: function () { tone(660, 0.1, "sine", 0.15, 0.001, 0); tone(880, 0.12, "sine", 0.15, 0.001, 0.08); },
      heartLost: function () { tone(140, 0.3, "sawtooth", 0.25, 0.001, 0); tone(100, 0.35, "sawtooth", 0.2, 0.001, 0.1); },
      tierUp: function () { tone(523, 0.1, "sine", 0.15, 0.001, 0); tone(659, 0.1, "sine", 0.15, 0.001, 0.1); tone(784, 0.15, "sine", 0.15, 0.001, 0.2); },
      victory: function () {
        [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, "sine", 0.2, 0.001, i * 0.15));
      },
      gameOver: function () {
        [400, 350, 300, 200].forEach((f, i) => tone(f, 0.3, "sawtooth", 0.2, 0.001, i * 0.2));
      },
      resumeCtx: function () {
        try {
          const c = getCtx();
          if (c.state === "suspended") c.resume();
        } catch (e) {}
      }
    };
  })();

  // =========================================================================
  // CANVAS SETUP
  // =========================================================================
  const canvas = document.getElementById("canvas");
  const ctx2d = canvas.getContext("2d");

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx2d.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }

  // =========================================================================
  // GAME STATE
  // =========================================================================
  let state = {
    mode: "menu", // "menu" | "quiz" | "playing"
    worldIndex: 0,
    levelIndex: 0,
    hearts: BALANCE.TOTAL_HEARTS,
    score: 0,
    wave: 1,
    monstersRemainingToSpawn: 0,
    monstersAliveOrPending: 0,
    monsters: [],
    arrows: [],
    particles: [],
    difficultyIndex: 0,
    correctStreak: 0,
    wrongStreak: 0,
    currentAnswer: "",
    currentQuestion: null,
    running: false,
    inputEnabled: false,
    spawnTimer: 0,
    spawnIntervalMs: BALANCE.BASE_SPAWN_INTERVAL_MS,
    lastFrameTime: 0,
    waveInProgress: false,
    waitingForNextQuestion: false,
    gameEnded: false,
    isBossWave: false,
    quickUnlockWorldId: null,
    quickUnlockStreak: 0,
  };

  function currentLevel() {
    return WORLDS[state.worldIndex].levels[state.levelIndex];
  }
  function currentWorld() {
    return WORLDS[state.worldIndex];
  }

  function newQuestion() {
    state.currentQuestion = generateQuestionForLevel(currentLevel(), state.difficultyIndex);
    state.currentAnswer = "";
    updateQuestionDisplay();
  }

  function updateQuestionDisplay() {
    const q = state.currentQuestion;
    const questionEl = document.getElementById("question");
    if (q.isWordProblem) {
      questionEl.textContent = q.text;
      questionEl.classList.add("wordProblemText");
    } else {
      questionEl.textContent = `${q.a} ${q.op} ${q.b} = ?`;
      questionEl.classList.remove("wordProblemText");
    }
    document.getElementById("answerDisplay").textContent = state.currentAnswer || " ";
  }

  // =========================================================================
  // DIFFICULTY ADAPTATION (adaptive tier within the current level)
  // =========================================================================
  function onCorrectAnswer() {
    state.correctStreak++;
    state.wrongStreak = 0;
    if (state.correctStreak >= BALANCE.STREAK_UP_THRESHOLD && state.difficultyIndex < DIFFICULTY_TIER_COUNT - 1) {
      state.difficultyIndex++;
      state.correctStreak = 0;
      Audio_.tierUp();
      showFeedback(t("niceStreak"), "#2b6cb0");
    }
  }

  function onWrongAnswer() {
    state.wrongStreak++;
    state.correctStreak = 0;
    if (state.wrongStreak >= BALANCE.STREAK_DOWN_THRESHOLD && state.difficultyIndex > 0) {
      state.difficultyIndex--;
      state.wrongStreak = 0;
    }
  }

  function showFeedback(text, color) {
    const el = document.getElementById("feedback");
    el.textContent = text;
    el.style.color = color || "#333";
    clearTimeout(showFeedback._t);
    showFeedback._t = setTimeout(() => { el.textContent = " "; }, 1200);
  }

  // =========================================================================
  // MONSTER / WAVE MANAGEMENT
  // =========================================================================
  function monstersInWave(wave) {
    return BALANCE.BASE_MONSTERS_PER_WAVE + (wave - 1) * BALANCE.MONSTERS_PER_WAVE_INCREMENT;
  }
  function speedForWave(wave) {
    const lvl = currentLevel();
    return (BALANCE.BASE_MONSTER_SPEED + (wave - 1) * BALANCE.WAVE_SPEED_INCREMENT) * lvl.monsterSpeedMultiplier;
  }
  function spawnIntervalForWave(wave) {
    return Math.max(
      BALANCE.MIN_SPAWN_INTERVAL_MS,
      BALANCE.BASE_SPAWN_INTERVAL_MS - (wave - 1) * BALANCE.SPAWN_INTERVAL_DECREMENT_MS
    );
  }

  function startWave(waveNum) {
    const world = currentWorld();
    const lvl = currentLevel();
    state.wave = waveNum;
    const regularCount = monstersInWave(waveNum);
    state.isBossWave = !!(lvl.hasBoss && waveNum === BALANCE.TOTAL_WAVES);
    state.monstersRemainingToSpawn = regularCount + (state.isBossWave ? 1 : 0);
    state.monstersAliveOrPending = state.monstersRemainingToSpawn;
    state.spawnIntervalMs = spawnIntervalForWave(waveNum);
    state.spawnTimer = 0;
    state.waveInProgress = true;
    document.getElementById("waveInfo").textContent =
      `${world.emoji} ${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)} — ${t("waveLabel")} ${waveNum}/${BALANCE.TOTAL_WAVES}`;
  }

  function spawnMonster() {
    const rect = canvas.getBoundingClientRect();
    const lvl = currentLevel();
    const isBoss = state.isBossWave && state.monstersRemainingToSpawn === 1;
    const spawnXFraction = lvl.spawnXFraction || BALANCE.SPAWN_X_FRACTION;
    const laneY = rect.height * (0.25 + Math.random() * 0.5);
    state.monsters.push({
      x: rect.width * spawnXFraction,
      y: isBoss ? rect.height * 0.5 : laneY,
      emoji: isBoss ? (lvl.bossEmoji || BALANCE.BOSS_EMOJI) : BALANCE.MONSTER_EMOJIS[(state.wave - 1) % BALANCE.MONSTER_EMOJIS.length],
      speed: speedForWave(state.wave) * (isBoss ? BALANCE.BOSS_SPEED_MULTIPLIER : 1),
      hp: isBoss ? BALANCE.BOSS_HP : 1,
      maxHp: isBoss ? BALANCE.BOSS_HP : 1,
      isBoss: isBoss,
      scale: isBoss ? BALANCE.BOSS_SCALE : 1,
      dying: false,
      dieTimer: 0,
      bobOffset: Math.random() * Math.PI * 2,
    });
    state.monstersRemainingToSpawn--;
  }

  function castleX() {
    return canvas.getBoundingClientRect().width * BALANCE.CASTLE_X_FRACTION;
  }

  // =========================================================================
  // SHOOTING
  // =========================================================================
  function fireAtClosestMonster() {
    const alive = state.monsters.filter(m => !m.dying);
    if (alive.length === 0) return false;
    let closest = alive[0];
    for (const m of alive) {
      if (m.x < closest.x) closest = m;
    }
    const rect = canvas.getBoundingClientRect();
    state.arrows.push({
      x: rect.width * BALANCE.CASTLE_X_FRACTION + 30,
      y: rect.height * 0.5,
      target: closest,
    });
    Audio_.shoot();
    return true;
  }

  // An arrow hitting its target: regular monsters die in one hit, the boss
  // takes BALANCE.BOSS_HP hits before dying.
  function hitMonster(m) {
    m.hp--;
    state.score += BALANCE.SCORE_PER_CORRECT;
    document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
    Audio_.hit();

    for (let i = 0; i < 4; i++) {
      state.particles.push({
        x: m.x, y: m.y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 1,
        life: 30,
        color: `hsl(${Math.random() * 60 + 30}, 90%, 60%)`,
      });
    }

    if (m.hp <= 0) {
      m.dying = true;
      m.dieTimer = 0;
      if (m.isBoss) {
        state.score += BALANCE.BOSS_KILL_BONUS;
        document.getElementById("score").textContent = `${t("scoreLabel")}: ${state.score}`;
        showFeedback(t("bossDefeated"), "#e8590c");
      }
      for (let i = 0; i < (m.isBoss ? 20 : 8); i++) {
        state.particles.push({
          x: m.x, y: m.y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 1,
          life: 34,
          color: `hsl(${Math.random() * 60 + 30}, 90%, 60%)`,
        });
      }
    } else if (m.isBoss) {
      showFeedback(tf("bossHitLeft", { hp: m.hp, maxHp: m.maxHp }), "#e8590c");
    }
  }

  // =========================================================================
  // HEARTS / GAME END
  // =========================================================================
  function loseHeart() {
    state.hearts--;
    updateHeartsDisplay();
    Audio_.heartLost();
    if (state.hearts <= 0) {
      endGame("gameover");
    }
  }

  function updateHeartsDisplay() {
    let s = "";
    for (let i = 0; i < BALANCE.TOTAL_HEARTS; i++) {
      s += i < state.hearts ? "❤️" : "🖤";
    }
    document.getElementById("hearts").textContent = s;
  }

  function setBottomPanelEnabled(enabled) {
    document.getElementById("bottomPanel").classList.toggle("disabled", !enabled);
  }

  function setHudMode(mode) {
    document.getElementById("hudNormal").style.display = mode === "quiz" ? "none" : "flex";
    document.getElementById("quickUnlockBar").style.display = mode === "quiz" ? "flex" : "none";
  }

  // outcome: "gameover" | "levelComplete" | "worldComplete" | "victory"
  function endGame(outcome) {
    if (state.gameEnded) return;
    state.gameEnded = true;
    state.running = false;
    state.inputEnabled = false;
    setBottomPanelEnabled(false);

    const world = currentWorld();
    const lvl = currentLevel();
    const titleEl = document.getElementById("overlayTitle");
    const subEl = document.getElementById("overlaySubtitle");
    const primaryBtn = document.getElementById("primaryBtn");
    document.getElementById("levelSelectBtn").textContent = t("chooseLevel");

    if (outcome === "gameover") {
      titleEl.textContent = t("gameOverTitle");
      subEl.textContent = `${t("scoreLabel")}: ${state.score}`;
      primaryBtn.textContent = t("retryLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      Audio_.gameOver();
    } else if (outcome === "levelComplete") {
      const wp = getWorldProgress(world.id);
      if (wp.unlockedLevel <= lvl.id && lvl.id < world.levels.length) {
        wp.unlockedLevel = lvl.id + 1;
        saveProgress();
      }
      const nextLvl = world.levels[lvl.id];
      titleEl.textContent = `${t("levelCompleteTitle")} ${lvl.emoji}`;
      subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${levelName(world.id, nextLvl.id)}`;
      primaryBtn.textContent = t("nextLevel");
      primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, nextLvl.id); };
      Audio_.victory();
      startConfetti();
    } else if (outcome === "worldComplete") {
      const isLastWorld = world.id >= WORLDS.length;
      if (!isLastWorld) {
        const nextWorld = WORLDS[world.id];
        const nwp = getWorldProgress(nextWorld.id);
        nwp.unlocked = true;
        saveProgress();
        titleEl.textContent = `${t("worldCompleteTitle")} ${world.emoji}`;
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("nextUp")}: ${worldName(nextWorld.id)}`;
        primaryBtn.textContent = t("nextWorld");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); showLevelSelect(nextWorld.id); };
      } else {
        titleEl.textContent = t("victoryTitle");
        subEl.textContent = `${t("scoreLabel")}: ${state.score} — ${t("savedKingdom")}`;
        primaryBtn.textContent = t("retryLevel");
        primaryBtn.onclick = () => { Audio_.resumeCtx(); startLevel(world.id, lvl.id); };
      }
      Audio_.victory();
      startConfetti();
    }

    document.getElementById("overlay").classList.add("active");
  }

  // Confetti particles for victory (canvas-drawn, separate lightweight system)
  let confetti = [];
  function startConfetti() {
    confetti = [];
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < 80; i++) {
      confetti.push({
        x: Math.random() * rect.width,
        y: -20 - Math.random() * rect.height,
        vy: 2 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 2,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`,
        size: 4 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  // =========================================================================
  // LANGUAGE TOGGLE
  // =========================================================================
  function updateLangToggleUI() {
    document.getElementById("langBtnVi").classList.toggle("activeLang", currentLang === "vi");
    document.getElementById("langBtnEn").classList.toggle("activeLang", currentLang === "en");
  }

  function setLanguage(lang) {
    if (lang !== "vi" && lang !== "en") return;
    currentLang = lang;
    saveLang(lang);
    showWorldSelect();
  }

  document.getElementById("langBtnVi").addEventListener("click", () => setLanguage("vi"));
  document.getElementById("langBtnEn").addEventListener("click", () => setLanguage("en"));

  // =========================================================================
  // WORLD SELECT / LEVEL SELECT SCREENS
  // =========================================================================
  function renderWorldCards() {
    const container = document.getElementById("worldCards");
    container.innerHTML = "";
    WORLDS.forEach((world) => {
      const wp = getWorldProgress(world.id);
      const card = document.createElement("div");
      card.className = "worldCard" + (wp.unlocked ? "" : " locked");
      card.innerHTML =
        `<div class="worldCardEmoji">${wp.unlocked ? world.emoji : "🔒"}</div>` +
        `<div class="worldCardTitle">${t("worldLabel")} ${world.id}: ${worldName(world.id)}</div>` +
        `<div class="worldCardAge">${ageRangeText(world.id)}</div>`;
      if (wp.unlocked) {
        const playBtn = document.createElement("button");
        playBtn.className = "worldActionBtn primary";
        playBtn.textContent = t("play");
        playBtn.addEventListener("click", () => { Audio_.resumeCtx(); showLevelSelect(world.id); });
        card.appendChild(playBtn);
      } else {
        const sub = document.createElement("div");
        sub.className = "worldCardSub";
        sub.textContent = t("lockedWorldSub");
        card.appendChild(sub);
        const quickBtn = document.createElement("button");
        quickBtn.className = "worldActionBtn secondary";
        quickBtn.textContent = t("quickUnlock");
        quickBtn.addEventListener("click", () => startQuickUnlockQuiz(world.id));
        card.appendChild(quickBtn);
      }
      container.appendChild(card);
    });
  }

  function renderLevelCards(worldId) {
    const world = getWorld(worldId);
    const wp = getWorldProgress(worldId);
    document.getElementById("levelSelectTitle").textContent = `${t("worldLabel")} ${world.id}: ${worldName(world.id)}`;
    const container = document.getElementById("levelCards");
    container.innerHTML = "";
    world.levels.forEach((lvl) => {
      const unlocked = lvl.id <= wp.unlockedLevel;
      const btn = document.createElement("button");
      btn.className = "levelCard" + (unlocked ? "" : " locked");
      btn.disabled = !unlocked;
      btn.innerHTML =
        `<div class="levelCardEmoji">${unlocked ? lvl.emoji : "🔒"}</div>` +
        `<div class="levelCardTitle">${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)}</div>` +
        `<div class="levelCardSub">${unlocked ? t("tapToPlay") : t("locked")}</div>`;
      if (unlocked) {
        btn.addEventListener("click", () => startLevel(world.id, lvl.id));
      }
      container.appendChild(btn);
    });
  }

  function showWorldSelect() {
    state.mode = "menu";
    state.running = false;
    state.inputEnabled = false;
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.querySelector("#worldSelectOverlay h1").textContent = t("gameTitle");
    document.querySelector("#worldSelectOverlay p").textContent = t("tagline");
    document.getElementById("waveInfo").textContent = t("selectWorldPlaceholder");
    updateLangToggleUI();
    renderWorldCards();
    document.getElementById("worldSelectOverlay").classList.add("active");
    setBottomPanelEnabled(false);
    setHudMode("menu");
  }

  function showLevelSelect(worldId) {
    state.mode = "menu";
    state.running = false;
    state.inputEnabled = false;
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("backToWorldsBtn").textContent = t("backToWorlds");
    renderLevelCards(worldId);
    document.getElementById("levelSelectOverlay").classList.add("active");
    setBottomPanelEnabled(false);
    setHudMode("menu");
  }

  document.getElementById("levelSelectBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showLevelSelect(currentWorld().id);
  });
  document.getElementById("backToWorldsBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();
  });

  function startLevel(worldId, levelId) {
    Audio_.resumeCtx();
    state.worldIndex = WORLDS.findIndex(w => w.id === worldId);
    state.levelIndex = getWorld(worldId).levels.findIndex(l => l.id === levelId);
    state.mode = "playing";
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    setHudMode("playing");
    resetState();
  }

  // =========================================================================
  // QUICK UNLOCK — answer 3 sample questions correctly in a row to skip ahead
  // =========================================================================
  function startQuickUnlockQuiz(worldId) {
    Audio_.resumeCtx();
    state.mode = "quiz";
    state.quickUnlockWorldId = worldId;
    state.quickUnlockStreak = 0;
    state.running = false;
    state.inputEnabled = true;
    state.waitingForNextQuestion = false;
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("quickUnlockCancelBtn").textContent = t("cancel");
    setBottomPanelEnabled(true);
    setHudMode("quiz");
    updateQuickUnlockProgress();
    generateQuizQuestion();
  }

  function updateQuickUnlockProgress() {
    const world = getWorld(state.quickUnlockWorldId);
    document.getElementById("quickUnlockProgress").textContent =
      `${t("quickUnlockProgressLabel")}: ${worldName(world.id)} — ${state.quickUnlockStreak}/${BALANCE.QUICK_UNLOCK_STREAK_REQUIRED} ${t("correctInARow")}`;
  }

  function generateQuizQuestion() {
    const world = getWorld(state.quickUnlockWorldId);
    state.currentQuestion = generateQuestionForLevel(world.levels[0], 1);
    state.currentAnswer = "";
    updateQuestionDisplay();
  }

  document.getElementById("quickUnlockCancelBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();
  });

  function submitQuickUnlockAnswer() {
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      state.quickUnlockStreak++;
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      if (state.quickUnlockStreak >= BALANCE.QUICK_UNLOCK_STREAK_REQUIRED) {
        const wp = getWorldProgress(state.quickUnlockWorldId);
        wp.unlocked = true;
        saveProgress();
        Audio_.tierUp();
        const worldId = state.quickUnlockWorldId;
        state.mode = "menu";
        showLevelSelect(worldId);
        return;
      }
      updateQuickUnlockProgress();
      generateQuizQuestion();
    } else {
      state.quickUnlockStreak = 0;
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(tf("quickUnlockWrong", { ans: correctAns }), "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      updateQuickUnlockProgress();
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        generateQuizQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  // =========================================================================
  // INPUT HANDLING
  // =========================================================================
  function handleKey(key) {
    if (!state.inputEnabled || state.waitingForNextQuestion) return;
    if (key === "clear") {
      state.currentAnswer = "";
    } else if (key === "enter") {
      submitAnswer();
      return;
    } else {
      if (state.currentAnswer.length < 3) {
        state.currentAnswer += key;
      }
    }
    updateQuestionDisplay();
  }

  function submitAnswer() {
    if (state.currentAnswer === "") return;
    if (state.mode === "quiz") {
      submitQuickUnlockAnswer();
      return;
    }
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      fireAtClosestMonster();
      onCorrectAnswer();
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      newQuestion();
    } else {
      onWrongAnswer();
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(`${t("oopsAnswerWas")} ${correctAns}`, "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        newQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  document.getElementById("numpad").addEventListener("click", (e) => {
    const btn = e.target.closest(".numBtn");
    if (!btn) return;
    Audio_.resumeCtx();
    handleKey(btn.dataset.key);
  });

  window.addEventListener("keydown", (e) => {
    Audio_.resumeCtx();
    if (e.key >= "0" && e.key <= "9") {
      handleKey(e.key);
    } else if (e.key === "Enter") {
      handleKey("enter");
    } else if (e.key === "Backspace" || e.key === "Escape") {
      handleKey("clear");
    }
  });

  // =========================================================================
  // MAIN UPDATE / RENDER LOOP
  // =========================================================================
  function update(dt) {
    // spawning
    if (state.waveInProgress && state.monstersRemainingToSpawn > 0) {
      state.spawnTimer += dt;
      if (state.spawnTimer >= state.spawnIntervalMs) {
        state.spawnTimer = 0;
        spawnMonster();
      }
    }

    // monsters
    const cx = castleX();
    for (let i = state.monsters.length - 1; i >= 0; i--) {
      const m = state.monsters[i];
      if (m.dying) {
        m.dieTimer += dt;
        if (m.dieTimer > 300) {
          state.monsters.splice(i, 1);
          state.monstersAliveOrPending--;
        }
        continue;
      }
      m.x -= m.speed * (dt / 16.6667);
      if (m.x <= cx + 20) {
        state.monsters.splice(i, 1);
        state.monstersAliveOrPending--;
        loseHeart();
      }
    }

    // arrows
    for (let i = state.arrows.length - 1; i >= 0; i--) {
      const arrow = state.arrows[i];
      if (arrow.target.dying || !state.monsters.includes(arrow.target)) {
        state.arrows.splice(i, 1);
        continue;
      }
      const dx = arrow.target.x - arrow.x;
      const dy = arrow.target.y - arrow.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 15) {
        hitMonster(arrow.target);
        state.arrows.splice(i, 1);
      } else {
        const speed = BALANCE.ARROW_SPEED * (dt / 16.6667);
        arrow.x += (dx / dist) * speed;
        arrow.y += (dy / dist) * speed;
      }
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // confetti
    if (confetti.length > 0) {
      const rect = canvas.getBoundingClientRect();
      for (const c of confetti) {
        c.y += c.vy * (dt / 16.6667);
        c.x += c.vx * (dt / 16.6667);
        c.rot += c.vrot;
        if (c.y > rect.height + 20) {
          c.y = -20;
          c.x = Math.random() * rect.width;
        }
      }
    }

    // wave completion check
    if (!state.gameEnded && state.waveInProgress && state.monstersRemainingToSpawn <= 0 && state.monstersAliveOrPending <= 0) {
      state.waveInProgress = false;
      if (state.wave >= BALANCE.TOTAL_WAVES) {
        const lvl = currentLevel();
        const world = currentWorld();
        if (lvl.id < world.levels.length) {
          endGame("levelComplete");
        } else {
          endGame("worldComplete");
        }
      } else {
        setTimeout(() => {
          if (!state.gameEnded) startWave(state.wave + 1);
        }, 1500);
      }
    }
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    ctx2d.clearRect(0, 0, w, h);

    // background ground
    const grad = ctx2d.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#bfe6f5");
    grad.addColorStop(1, "#d9f2c4");
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0, 0, w, h);

    // ground strip
    ctx2d.fillStyle = "#8fbf5f";
    ctx2d.fillRect(0, h * 0.75, w, h * 0.25);

    // castle
    const cx = castleX();
    ctx2d.font = `${Math.min(80, h * 0.35)}px serif`;
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    ctx2d.fillText("🏰", cx, h * 0.5);

    // monsters
    for (const m of state.monsters) {
      ctx2d.save();
      const bob = Math.sin(Date.now() / 200 + m.bobOffset) * 4;
      let alpha = 1, scale = 1;
      if (m.dying) {
        const t2 = m.dieTimer / 300;
        alpha = 1 - t2;
        scale = 1 + t2 * 0.5;
      }
      const renderScale = scale * (m.scale || 1);
      ctx2d.globalAlpha = alpha;
      ctx2d.font = `${40 * renderScale}px serif`;
      ctx2d.textAlign = "center";
      ctx2d.textBaseline = "middle";
      ctx2d.fillText(m.emoji, m.x, m.y + bob);
      if (m.isBoss && !m.dying) {
        ctx2d.font = "16px sans-serif";
        ctx2d.fillStyle = "#e8590c";
        ctx2d.fillText(`❤ ${m.hp}/${m.maxHp}`, m.x, m.y + bob - 20 * renderScale - 8);
      }
      ctx2d.restore();
    }

    // arrows
    ctx2d.save();
    ctx2d.font = "24px serif";
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    for (const a of state.arrows) {
      const angle = Math.atan2(a.target.y - a.y, a.target.x - a.x);
      ctx2d.save();
      ctx2d.translate(a.x, a.y);
      ctx2d.rotate(angle);
      ctx2d.fillText("➤", 0, 0);
      ctx2d.restore();
    }
    ctx2d.restore();

    // particles
    for (const p of state.particles) {
      ctx2d.globalAlpha = Math.max(0, p.life / 30);
      ctx2d.fillStyle = p.color;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx2d.fill();
    }
    ctx2d.globalAlpha = 1;

    // confetti
    for (const c of confetti) {
      ctx2d.save();
      ctx2d.translate(c.x, c.y);
      ctx2d.rotate(c.rot);
      ctx2d.fillStyle = c.color;
      ctx2d.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
      ctx2d.restore();
    }
  }

  function loop(timestamp) {
    if (!state.lastFrameTime) state.lastFrameTime = timestamp;
    const dt = timestamp - state.lastFrameTime;
    state.lastFrameTime = timestamp;

    if (state.running) {
      update(dt);
    }
    if (confetti.length > 0 && !state.running) {
      // keep animating confetti after game ends
      const rect = canvas.getBoundingClientRect();
      for (const c of confetti) {
        c.y += c.vy * (dt / 16.6667);
        c.x += c.vx * (dt / 16.6667);
        c.rot += c.vrot;
        if (c.y > rect.height + 20) { c.y = -20; c.x = Math.random() * rect.width; }
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // GAME LIFECYCLE
  // =========================================================================
  function resetState() {
    state.hearts = BALANCE.TOTAL_HEARTS;
    state.score = 0;
    state.wave = 1;
    state.monsters = [];
    state.arrows = [];
    state.particles = [];
    state.difficultyIndex = 0;
    state.correctStreak = 0;
    state.wrongStreak = 0;
    state.currentAnswer = "";
    state.running = true;
    state.inputEnabled = true;
    state.gameEnded = false;
    state.waveInProgress = false;
    state.waitingForNextQuestion = false;
    confetti = [];
    document.getElementById("score").textContent = `${t("scoreLabel")}: 0`;
    updateHeartsDisplay();
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    setBottomPanelEnabled(true);
    newQuestion();
    startWave(1);
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  updateHeartsDisplay();
  showWorldSelect();
  requestAnimationFrame(loop);
})();
</script>
</body>
