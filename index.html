  document.getElementById("langBtnEn").addEventListener("click", () => setLanguage("en"));

  // =========================================================================
  // WORLD SELECT / LEVEL SELECT SCREENS
  // =========================================================================
  function renderWorldCards() {
    const container = document.getElementById("worldCards");
    container.innerHTML = "";
    WORLDS.forEach((world) => {
      const wp = getWorldProgress(world.id);
      const card = document.createElement("div");
      card.className = "worldCard" + (wp.unlocked ? "" : " locked");
      card.dataset.world = world.id;
      card.innerHTML =
        `<div class="worldCardEmoji">${wp.unlocked ? world.emoji : "🔒"}</div>` +
        `<div class="worldCardTitle">${t("worldLabel")} ${world.id}: ${worldName(world.id)}</div>` +
        `<div class="worldCardAge">${ageRangeText(world.id)}</div>`;
      if (wp.unlocked) {
        const playBtn = document.createElement("button");
        playBtn.className = "worldActionBtn primary";
        playBtn.textContent = t("play");
        playBtn.addEventListener("click", () => { Audio_.resumeCtx(); showLevelSelect(world.id); });
        card.appendChild(playBtn);
      } else {
        const sub = document.createElement("div");
        sub.className = "worldCardSub";
        sub.textContent = t("lockedWorldSub");
        card.appendChild(sub);
        const quickBtn = document.createElement("button");
        quickBtn.className = "worldActionBtn secondary";
        quickBtn.textContent = t("quickUnlock");
        quickBtn.addEventListener("click", () => startQuickUnlockQuiz(world.id));
        card.appendChild(quickBtn);
      }
      container.appendChild(card);
    });
  }

  function renderLevelCards(worldId) {
    const world = getWorld(worldId);
    const wp = getWorldProgress(worldId);
    document.getElementById("levelSelectTitle").textContent = `${t("worldLabel")} ${world.id}: ${worldName(world.id)}`;
    const container = document.getElementById("levelCards");
    container.innerHTML = "";
    world.levels.forEach((lvl) => {
      const unlocked = lvl.id <= wp.unlockedLevel;
      const btn = document.createElement("button");
      btn.className = "levelCard" + (unlocked ? "" : " locked");
      btn.dataset.world = worldId;
      btn.disabled = !unlocked;
      btn.innerHTML =
        `<div class="levelCardEmoji">${unlocked ? lvl.emoji : "🔒"}</div>` +
        `<div class="levelCardTitle">${t("levelLabel")} ${lvl.id}: ${levelName(world.id, lvl.id)}</div>` +
        `<div class="levelCardSub">${unlocked ? t("tapToPlay") : t("locked")}</div>`;
      if (unlocked) {
        btn.addEventListener("click", () => startLevel(world.id, lvl.id));
      }
      container.appendChild(btn);
    });
  }

    menuWorldId = 1;
    resetAmbient();
    resetCannonVisuals();
    setPanelMode(null);
    setMenuLayout(true);
    state.running = false;
    state.inputEnabled = false;
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.querySelector("#worldSelectOverlay h1").textContent = t("gameTitle");
    document.querySelector("#worldSelectOverlay p").textContent = t("tagline");
    document.getElementById("waveInfo").textContent = t("selectWorldPlaceholder");
    updateLangToggleUI();
    renderWorldCards();
    document.getElementById("worldSelectOverlay").classList.add("active");
    setBottomPanelEnabled(false);
    setHudMode("menu");

    resetAmbient();

    setPanelMode(getWorld(worldId).levels[0].kind);

    showLevelSelect(currentWorld().id);

  document.getElementById("backToWorldsBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();

  function startLevel(worldId, levelId) {
    Audio_.resumeCtx();
    state.worldIndex = WORLDS.findIndex(w => w.id === worldId);
    state.levelIndex = getWorld(worldId).levels.findIndex(l => l.id === levelId);
    state.mode = "playing";
    setPanelMode(currentLevel().kind);
    setMenuLayout(false);
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    setHudMode("playing");
    resetState();

  // =========================================================================
  // QUICK UNLOCK — answer 3 sample questions correctly in a row to skip ahead
  // =========================================================================
  function startQuickUnlockQuiz(worldId) {
    Audio_.resumeCtx();
    state.mode = "quiz";
    state.quickUnlockWorldId = worldId;
    resetCannonVisuals();
    setPanelMode(getWorld(worldId).levels[0].kind);
    setMenuLayout(false);
    state.quickUnlockStreak = 0;
    state.running = false;
    state.inputEnabled = true;
    state.waitingForNextQuestion = false;
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("quickUnlockCancelBtn").textContent = t("cancel");
    setBottomPanelEnabled(true);
    setHudMode("quiz");
    updateQuickUnlockProgress();
    generateQuizQuestion();
  }

  function updateQuickUnlockProgress() {
    const world = getWorld(state.quickUnlockWorldId);
    document.getElementById("quickUnlockProgress").textContent =
      `${t("quickUnlockProgressLabel")}: ${worldName(world.id)} — ${state.quickUnlockStreak}/${BALANCE.QUICK_UNLOCK_STREAK_REQUIRED} ${t("correctInARow")}`;
  }

  function generateQuizQuestion() {
    const world = getWorld(state.quickUnlockWorldId);
    state.currentQuestion = generateQuestionForLevel(world.levels[0], 1);
    state.currentAnswer = "";
    updateQuestionDisplay();
  }

  document.getElementById("quickUnlockCancelBtn").addEventListener("click", () => {
    Audio_.resumeCtx();
    showWorldSelect();
  });

  function submitQuickUnlockAnswer() {
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      state.quickUnlockStreak++;
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      if (state.quickUnlockStreak >= BALANCE.QUICK_UNLOCK_STREAK_REQUIRED) {
        const wp = getWorldProgress(state.quickUnlockWorldId);
        wp.unlocked = true;
        saveProgress();
        Audio_.tierUp();
        const worldId = state.quickUnlockWorldId;
        state.mode = "menu";
        showLevelSelect(worldId);
        return;
      }
      updateQuickUnlockProgress();
      generateQuizQuestion();
    } else {
      state.quickUnlockStreak = 0;
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(tf("quickUnlockWrong", { ans: correctAns }), "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      updateQuickUnlockProgress();
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        generateQuizQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  // =========================================================================
  // INPUT HANDLING
  // =========================================================================
  function handleKey(key) {
    if (!state.inputEnabled || state.waitingForNextQuestion) return;
    if (key === "clear") {
      state.currentAnswer = "";
    } else if (key === "enter") {
      submitAnswer();
      return;
    } else {
      if (state.currentAnswer.length < 3) {
        state.currentAnswer += key;
      }
    }
    updateQuestionDisplay();
  }

  function submitAnswer() {
    if (state.currentAnswer === "") return;
    if (state.mode === "quiz") {
      submitQuickUnlockAnswer();
      return;
    }
    const userVal = parseInt(state.currentAnswer, 10);
    const correct = userVal === state.currentQuestion.answer;
    if (correct) {
      fireAtClosestMonster();
      onCorrectAnswer();
      Audio_.correct();
      showFeedback(t("correct"), "#2f9e44");
      newQuestion();
    } else {
      onWrongAnswer();
      Audio_.wrong();
      const correctAns = state.currentQuestion.answer;
      showFeedback(`${t("oopsAnswerWas")} ${correctAns}`, "#e03131");
      document.getElementById("answerDisplay").textContent = String(correctAns);
      state.waitingForNextQuestion = true;
      setTimeout(() => {
        state.waitingForNextQuestion = false;
        newQuestion();
      }, BALANCE.WRONG_ANSWER_DISPLAY_MS);
    }
  }

  document.getElementById("numpad").addEventListener("click", (e) => {
    const btn = e.target.closest(".numBtn");
    if (!btn) return;
    Audio_.resumeCtx();
    handleKey(btn.dataset.key);
  });

  window.addEventListener("keydown", (e) => {
    Audio_.resumeCtx();
    if (e.key >= "0" && e.key <= "9") {
      handleKey(e.key);
    } else if (e.key === "Enter") {
      handleKey("enter");
    } else if (e.key === "Backspace" || e.key === "Escape") {
      handleKey("clear");
    }
  });

  // =========================================================================
  // MAIN UPDATE / RENDER LOOP
  // =========================================================================
  // Gameplay: only runs while a level is in progress.
  function update(dt) {
    const dtF = dt / 16.6667;

    // spawning
    if (state.waveInProgress && state.monstersRemainingToSpawn > 0) {
      state.spawnTimer += dt;
      if (state.spawnTimer >= state.spawnIntervalMs) {
        state.spawnTimer = 0;
        spawnMonster();
      }
    }

    // dragons charge toward the wall; one that arrives costs a heart
    for (let i = state.monsters.length - 1; i >= 0; i--) {
      const m = state.monsters[i];
      if (m.dying) {
        m.dieTimer += dt;
        layoutMonster(m);
        if (m.dieTimer > 360) {
          state.monsters.splice(i, 1);
          state.monstersAliveOrPending--;
        }
        continue;
      }
      if (m.hitTimer > 0) m.hitTimer -= dt;
      m.p += m.speedP * dtF;
      layoutMonster(m);
      if (m.p >= 1) {
        state.monsters.splice(i, 1);
        state.monstersAliveOrPending--;
        onDragonStrike(m);
        loseHeart();
      }
    }

    // cannonballs chase their target across the screen
    for (let i = state.cannonballs.length - 1; i >= 0; i--) {
      const ball = state.cannonballs[i];
      if (ball.target.dying || !state.monsters.includes(ball.target)) {
        burst(ball.x, ball.y, 5, { hue: 200, hueRange: 30, speed: 2.5, life: 14, r: 3, g: 0 });
        state.cannonballs.splice(i, 1);
        continue;
      }
      const dx = ball.target.sx - ball.x;
      const dy = ball.target.sy - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const speed = BALANCE.CANNONBALL_SPEED * (ball.speedMult || 1) * dtF;
      // Register a hit whenever this frame's movement would reach or pass the
      // target, not just when already close — a large dt (a throttled
      // background tab, a slow device) can otherwise let a fast cannonball
      // overshoot its target in a single step and never register the hit,
      // wasting the shot while the dragon keeps charging untouched.
      if (dist < Math.max(10, ball.target.size * 0.1) || speed >= dist) {
        hitMonster(ball.target);
        spawnImpactBurst(ball.target.sx, ball.target.sy);
        state.cannonballs.splice(i, 1);
      } else {
        ball.trail.push({ x: ball.x, y: ball.y, r: Math.max(2, ball.startR * (dist / ball.initialDist) * 0.8) });
        if (ball.trail.length > 6) ball.trail.shift();
        ball.x += (dx / dist) * speed;
        ball.y += (dy / dist) * speed;
      }
    }

    // wave completion check
    if (!state.gameEnded && state.waveInProgress && state.monstersRemainingToSpawn <= 0 && state.monstersAliveOrPending <= 0) {
      state.waveInProgress = false;
      if (state.wave >= BALANCE.TOTAL_WAVES) {
        const lvl = currentLevel();
        const world = currentWorld();
        if (lvl.id < world.levels.length) {
          endGame("levelComplete");
        } else {
          endGame("worldComplete");
        }
      } else {
        setTimeout(() => {
          if (!state.gameEnded) startWave(state.wave + 1);
        }, 1500);
      }
    }
  }

  // Visual-only state: keeps settling after the game ends so a final
  // explosion or screen shake never freezes behind the result overlay.
  function updateEffects(dt) {
    const dtF = dt / 16.6667;
    state.cannonRecoil = Math.max(0, state.cannonRecoil - dt / 150);
    state.muzzleFlash = Math.max(0, state.muzzleFlash - dt / 110);
    state.shake = Math.max(0, state.shake - dt / 380);
    state.flash = Math.max(0, state.flash - dt / 650);
    state.cannonSpread += ((state.cannonLevel >= 2 ? 1 : 0) - state.cannonSpread) * Math.min(1, dt / 180);

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dtF; p.y += p.vy * dtF; p.vy += (p.g == null ? 0.15 : p.g) * dtF;
      if (p.ring) p.r += p.grow * dtF;
      p.life -= dtF;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    if (confetti.length > 0) {
      for (const c of confetti) {
        c.y += c.vy * dtF;
        c.x += c.vx * dtF;
        c.rot += c.vrot * dtF;
        if (c.y > view.h + 20) {
          c.y = -20;
          c.x = Math.random() * view.w;
        }
      }
    }
  }

  function loop(timestamp) {
    if (!state.lastFrameTime) state.lastFrameTime = timestamp;
    // Clamp: after a hidden tab or a long hitch the game just resumes instead
    // of teleporting every dragon to the wall.
    const dt = Math.min(100, timestamp - state.lastFrameTime);
    state.lastFrameTime = timestamp;
    frameTime = timestamp;

    if (state.running) update(dt);
    else if (state.mode === "menu") updateAmbient(dt);
    updateEffects(dt);
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // SCENERY — procedural, painted once per world/size into cached layers
  // (sky, land, wall) that are blitted every frame. Clouds, cogs, stars,
  // islands, smoke and windmill blades animate live between the layers.
  // Palettes follow the Canva concept art for each world.
  // =========================================================================
  let frameTime = 0;

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let x = Math.imul(a ^ (a >>> 15), 1 | a);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const THEMES = {
    1: { // sunny meadow kingdom
      sky: [[0, "#3f9df0"], [0.55, "#8fd2ff"], [1, "#e4f6ff"]],
      haze: "228,246,255",
      stone: { base: "#a3a9b3", light: "#d3d8e0", dark: "#6e7580", mortar: "rgba(40,45,60,0.38)" },
      floor: ["#b7b0a2", "#8c8576"],
    },
    2: { // clockwork valley at sunset
      sky: [[0, "#d9662a"], [0.5, "#ffa95f"], [1, "#ffe5b4"]],
      haze: "255,222,170",
      stone: { base: "#9a7656", light: "#c79c72", dark: "#5f442f", mortar: "rgba(35,18,6,0.42)" },
      floor: ["#a47a55", "#6d4c33"],
    },
    3: { // mystic twilight
      sky: [[0, "#120a3c"], [0.5, "#4f2594"], [1, "#e07bb6"]],
      haze: "224,140,190",
      stone: { base: "#5d6289", light: "#8d93c2", dark: "#34385c", mortar: "rgba(8,8,36,0.5)" },
      floor: ["#3d4172", "#22264e"],
    },
  };

  // ---- small painting helpers ---------------------------------------------
  function ridge(g, w, baseY, amp, seed, fill) {
    const rnd = mulberry32(seed);
    const a = rnd() * 6.28, b = rnd() * 6.28, c = rnd() * 6.28;
    g.beginPath();
    g.moveTo(-6, baseY + amp);
    for (let x = -6; x <= w + 6; x += 6) {
      const k = x / w;
      g.lineTo(x, baseY - amp * (0.55 + 0.25 * Math.sin(k * 4.2 + a) + 0.15 * Math.sin(k * 9.5 + b) + 0.06 * Math.sin(k * 23 + c)));
    }
    g.lineTo(w + 6, baseY + amp);
    g.closePath();
    g.fillStyle = fill;
    g.fill();
  }

  function peaks(g, w, baseY, maxH, seed, fill, snow) {
    const rnd = mulberry32(seed);
    const tops = [];
    g.fillStyle = fill;
    g.beginPath();
    g.moveTo(-10, baseY + 4);
    let x = -10;
    while (x < w + 40) {
      const pw = w * (0.07 + rnd() * 0.07), ph = maxH * (0.45 + rnd() * 0.55);
      tops.push({ x: x + pw / 2, y: baseY - ph, pw, ph });
      g.lineTo(x + pw / 2, baseY - ph);
      g.lineTo(x + pw, baseY - ph * (0.12 + rnd() * 0.22));
      x += pw;
    }
    g.lineTo(w + 40, baseY + 4);
    g.closePath();
    g.fill();
    if (snow) {
      g.fillStyle = "rgba(255,255,255,0.92)";
      tops.forEach((p) => {
        if (p.ph < maxH * 0.62) return;
        const cw = p.pw * 0.2, ch = p.ph * 0.24;
        g.beginPath();
        g.moveTo(p.x, p.y);
        g.lineTo(p.x - cw, p.y + ch);
        g.lineTo(p.x - cw * 0.3, p.y + ch * 0.7);
        g.lineTo(p.x + cw * 0.15, p.y + ch);
        g.lineTo(p.x + cw, p.y + ch * 0.8);
        g.closePath();
        g.fill();
      });
    }
  }

  function cloudShape(g, x, y, s, a) {
    g.fillStyle = `rgba(255,255,255,${a})`;
    g.beginPath();
    [[0, 0, 1], [0.95, -0.28, 1.25], [1.95, -0.1, 1.1], [2.8, 0.06, 0.85], [-0.85, 0.12, 0.8]].forEach(([dx, dy, r]) => {
      g.moveTo(x + dx * s + r * s, y + dy * s);
      g.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
    });
    g.fill();
    g.fillStyle = `rgba(140,175,225,${a * 0.28})`;
    g.beginPath();
    g.ellipse(x + 1.0 * s, y + 0.75 * s, 2.5 * s, 0.32 * s, 0, 0, Math.PI * 2);
    g.fill();
  }

  function cogPath(g, x, y, rad, teeth, rot) {
    g.beginPath();
    const n = teeth * 4;
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const rr = i % 4 < 2 ? rad : rad * 0.8;
      g[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath();
  }

  function drawCogShape(g, x, y, rad, teeth, rot, fill, dark) {
    cogPath(g, x, y, rad, teeth, rot);
    g.fillStyle = fill; g.fill();
    g.lineWidth = Math.max(1, rad * 0.04); g.strokeStyle = dark; g.stroke();
    g.beginPath(); g.arc(x, y, rad * 0.62, 0, Math.PI * 2);
    g.strokeStyle = dark; g.stroke();
    g.fillStyle = dark;
    g.beginPath(); g.arc(x, y, rad * 0.2, 0, Math.PI * 2); g.fill();
    for (let k = 0; k < 4; k++) {
      const a = rot + k * Math.PI / 2;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * rad * 0.62, y + Math.sin(a) * rad * 0.62);
      g.lineWidth = rad * 0.1; g.stroke();
    }
  }

  // Ground with perspective bands + optional converging grid lines.
  function paintGround(g, w, h, hy, cA, cB, theme, grid) {
    const N = 18;
    for (let i = 0; i < N; i++) {
      const y0 = hy + (h - hy) * Math.pow(i / N, 1.9);
      const y1 = hy + (h - hy) * Math.pow((i + 1) / N, 1.9);
      g.fillStyle = i % 2 ? cA : cB;
      g.fillRect(0, y0, w, y1 - y0 + 1);
    }
    if (grid) {
      g.strokeStyle = grid.color; g.lineWidth = grid.width || 1;
      for (let k = -9; k <= 9; k++) {
        g.beginPath();
        g.moveTo(w / 2 + k * w * 0.012, hy);
        g.lineTo(w / 2 + k * w * 0.2, h);
        g.stroke();
      }
    }
    // atmospheric haze hugging the horizon
    const hz = g.createLinearGradient(0, hy - h * 0.03, 0, hy + h * 0.14);
    hz.addColorStop(0, `rgba(${theme.haze},0.0)`);
    hz.addColorStop(0.25, `rgba(${theme.haze},0.55)`);
    hz.addColorStop(1, `rgba(${theme.haze},0)`);
    g.fillStyle = hz;
    g.fillRect(0, hy - h * 0.03, w, h * 0.17);
  }

  // ---- sky layers -----------------------------------------------------------
  function paintSky(g, w, h, hy, worldId) {
    const theme = THEMES[worldId];
    const grad = g.createLinearGradient(0, 0, 0, hy);
    theme.sky.forEach(([o, col]) => grad.addColorStop(o, col));
    g.fillStyle = grad;
    g.fillRect(0, 0, w, hy + 2);
    g.fillStyle = theme.sky[theme.sky.length - 1][1];
    g.fillRect(0, hy, w, h - hy);
    if (worldId === 1) {
      const sx = w * 0.82, sy = hy * 0.34;
      const sg = g.createRadialGradient(sx, sy, 0, sx, sy, h * 0.3);
      sg.addColorStop(0, "rgba(255,250,210,0.95)"); sg.addColorStop(0.18, "rgba(255,245,190,0.55)"); sg.addColorStop(1, "rgba(255,245,190,0)");
      g.fillStyle = sg; g.fillRect(0, 0, w, hy);
      g.fillStyle = "#fffbe0"; g.beginPath(); g.arc(sx, sy, h * 0.045, 0, Math.PI * 2); g.fill();
    } else if (worldId === 2) {
      const sx = w * 0.3, sy = hy - h * 0.045;
      const sg = g.createRadialGradient(sx, sy, 0, sx, sy, h * 0.5);
      sg.addColorStop(0, "rgba(255,240,190,1)"); sg.addColorStop(0.12, "rgba(255,200,120,0.75)"); sg.addColorStop(1, "rgba(255,160,80,0)");
      g.fillStyle = sg; g.fillRect(0, 0, w, hy);
      g.fillStyle = "#fff1c4"; g.beginPath(); g.arc(sx, sy, h * 0.085, 0, Math.PI * 2); g.fill();
    } else {
      const mx = w * 0.22, my = hy * 0.36, mr = h * 0.075;
      const mg = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 4);
      mg.addColorStop(0, "rgba(255,246,220,0.55)"); mg.addColorStop(1, "rgba(200,170,255,0)");
      g.fillStyle = mg; g.fillRect(0, 0, w, hy);
      g.fillStyle = "#fff8e4"; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(190,175,200,0.45)";
      [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.3], [-0.1, 0.4, 0.16]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(mx + dx * mr, my + dy * mr, r * mr, 0, Math.PI * 2); g.fill(); });
    }
  }

  // ---- land layers (mountains → ground), transparent above the ridges ------
  function paintLand(g, w, h, hy, worldId) {
    const theme = THEMES[worldId];
    const rnd = mulberry32(worldId * 977);
    if (worldId === 1) {
      peaks(g, w, hy + 2, h * 0.2, 11, "#a9bde9", true);
      peaks(g, w, hy + 2, h * 0.12, 29, "#8fa8de", false);
      ridge(g, w, hy + 4, h * 0.07, 7, "#93d975");
      // village on a knoll (right)
      const kx = w * 0.74, ky = hy - h * 0.006;
      g.fillStyle = "#7fd062"; g.beginPath(); g.ellipse(kx, ky + h * 0.01, w * 0.17, h * 0.045, 0, Math.PI, 0); g.fill();
      for (let i = 0; i < 6; i++) {
        const hx = kx - w * 0.12 + i * w * 0.042 + rnd() * 8, hw = w * 0.026, hh = h * 0.026, yy = ky - (i % 2) * h * 0.012;
        g.fillStyle = "#f5ead2"; g.fillRect(hx, yy - hh, hw, hh);
        g.fillStyle = i % 2 ? "#d9503f" : "#c4402f";
        g.beginPath(); g.moveTo(hx - 2, yy - hh); g.lineTo(hx + hw / 2, yy - hh - h * 0.02); g.lineTo(hx + hw + 2, yy - hh); g.closePath(); g.fill();
      }
      // windmill tower (blades are animated live)
      g.fillStyle = "#efe3c8";
      g.beginPath(); g.moveTo(w * 0.86 - w * 0.012, ky); g.lineTo(w * 0.86 - w * 0.007, ky - h * 0.1); g.lineTo(w * 0.86 + w * 0.007, ky - h * 0.1); g.lineTo(w * 0.86 + w * 0.012, ky); g.closePath(); g.fill();
      g.fillStyle = "#b9452f";
      g.beginPath(); g.moveTo(w * 0.86 - w * 0.01, ky - h * 0.1); g.lineTo(w * 0.86, ky - h * 0.125); g.lineTo(w * 0.86 + w * 0.01, ky - h * 0.1); g.closePath(); g.fill();
      ridge(g, w, hy + 6, h * 0.045, 23, "#75c85a");
      // round trees on the near ridge
      for (let i = 0; i < 14; i++) {
        const tx = rnd() * w, ty = hy - h * (0.002 + rnd() * 0.012), tr = h * (0.014 + rnd() * 0.012);
        g.fillStyle = "#6b4a2b"; g.fillRect(tx - 1.5, ty - tr * 0.2, 3, tr * 0.9);
        g.fillStyle = rnd() > 0.5 ? "#3f9c47" : "#4faa4a";
        g.beginPath(); g.arc(tx, ty - tr * 0.9, tr, 0, Math.PI * 2); g.fill();
      }
      paintGround(g, w, h, hy, "#79cc58", "#6dc04e", theme, { color: "rgba(255,255,255,0.06)", width: 2 });
      // wildflowers / grass tufts, sized by depth
      for (let i = 0; i < 90; i++) {
        const k = Math.pow(rnd(), 1.5), y = hy + h * 0.02 + (h - hy) * k, x = rnd() * w, s = 1 + k * 5;
        g.fillStyle = "rgba(40,120,50,0.5)"; g.fillRect(x - s * 0.15, y - s * 1.4, s * 0.3, s * 1.4);
        g.fillStyle = ["#ffffff", "#ffd93d", "#ff8fb1", "#c9a3ff"][i % 4];
        g.beginPath(); g.arc(x, y - s * 1.5, s * 0.55, 0, Math.PI * 2); g.fill();
      }
    } else if (worldId === 2) {
      ridge(g, w, hy + 4, h * 0.075, 5, "#d98a4a");
      // factory skyline: boxes, chimneys, glowing windows
      g.fillStyle = "#7a4a2a";
      for (let i = 0; i < 12; i++) {
        const bw = w * (0.04 + rnd() * 0.05), bh = h * (0.02 + rnd() * 0.045), bx = i * w * 0.09 + rnd() * w * 0.03;
        g.fillRect(bx, hy - bh, bw, bh + 3);
        if (rnd() > 0.5) { const cw = bw * 0.22; g.fillRect(bx + bw * 0.55, hy - bh - h * 0.05, cw, h * 0.05); g.fillRect(bx + bw * 0.55 - 2, hy - bh - h * 0.054, cw + 4, 4); }
        g.fillStyle = "rgba(255,200,90,0.85)";
        for (let k = 0; k < 3; k++) g.fillRect(bx + bw * (0.12 + k * 0.28), hy - bh * 0.7, 3, 3);
        g.fillStyle = "#7a4a2a";
      }
      ridge(g, w, hy + 6, h * 0.04, 17, "#8a512b");
      // copper pipe along the horizon
      const pg = g.createLinearGradient(0, hy - 6, 0, hy + 8);
      pg.addColorStop(0, "#e9a56a"); pg.addColorStop(0.5, "#b86a34"); pg.addColorStop(1, "#6f3d1c");
      g.fillStyle = pg; g.fillRect(0, hy - 3, w, 9);
      paintGround(g, w, h, hy, "#a8703f", "#9b6538", theme, { color: "rgba(255,190,110,0.16)", width: 2 });
      // riveted plates + glowing seams
      for (let i = 0; i < 70; i++) {
        const k = Math.pow(rnd(), 1.4), y = hy + h * 0.02 + (h - hy) * k, x = rnd() * w, s = 1 + k * 4;
        g.fillStyle = "rgba(60,30,10,0.45)"; g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(255,200,130,0.5)"; g.beginPath(); g.arc(x - s * 0.25, y - s * 0.25, s * 0.4, 0, Math.PI * 2); g.fill();
      }
    } else {
      peaks(g, w, hy + 2, h * 0.17, 41, "#4a2f8f", false);
      ridge(g, w, hy + 4, h * 0.06, 13, "#3a2478");
      // temple on the right hill
      const tx = w * 0.7, ty = hy - h * 0.005;
      g.fillStyle = "#2c1a63"; g.beginPath(); g.ellipse(tx, ty + h * 0.01, w * 0.15, h * 0.04, 0, Math.PI, 0); g.fill();
      g.fillStyle = "#7a6cc0"; g.fillRect(tx - w * 0.07, ty - h * 0.012, w * 0.14, h * 0.012);
      for (let i = 0; i < 6; i++) { g.fillStyle = "#9a8de0"; g.fillRect(tx - w * 0.062 + i * w * 0.0235, ty - h * 0.058, w * 0.008, h * 0.046); }
      g.fillStyle = "#8d7fd2"; g.beginPath(); g.moveTo(tx - w * 0.075, ty - h * 0.058); g.lineTo(tx, ty - h * 0.092); g.lineTo(tx + w * 0.075, ty - h * 0.058); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,230,140,0.9)"; g.beginPath(); g.arc(tx, ty - h * 0.062, h * 0.007, 0, Math.PI * 2); g.fill();
      // crystal clusters on the near ridge
      ridge(g, w, hy + 6, h * 0.035, 31, "#271657");
      for (let i = 0; i < 9; i++) {
        const cx = rnd() * w, cy = hy - h * 0.004, ch = h * (0.02 + rnd() * 0.035);
        g.fillStyle = i % 2 ? "#6ff0ff" : "#ff7be0";
        g.beginPath(); g.moveTo(cx - ch * 0.18, cy); g.lineTo(cx, cy - ch); g.lineTo(cx + ch * 0.18, cy); g.closePath(); g.fill();
        g.fillStyle = "rgba(255,255,255,0.45)"; g.beginPath(); g.moveTo(cx - ch * 0.04, cy); g.lineTo(cx, cy - ch); g.lineTo(cx + ch * 0.06, cy); g.closePath(); g.fill();
      }
      paintGround(g, w, h, hy, "#2a2e66", "#232759", theme, { color: "rgba(120,240,255,0.30)", width: 2 });
      // glowing rune diamonds scattered on the ground
      for (let i = 0; i < 40; i++) {
        const k = Math.pow(rnd(), 1.4), y = hy + h * 0.025 + (h - hy) * k, x = rnd() * w, s = 2 + k * 9;
        g.fillStyle = i % 3 ? "rgba(120,240,255,0.55)" : "rgba(255,130,230,0.55)";
        g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.6, y); g.lineTo(x, y + s * 0.4); g.lineTo(x - s * 0.6, y); g.closePath(); g.fill();
      }
    }
  }

  // ---- foreground: the stone parapet you shoot over --------------------------
  function paintWall(g, w, h, hy, worldId) {
    const theme = THEMES[worldId], st = theme.stone;
    const rnd = mulberry32(worldId * 313);
    const topY = h * VIEW.WALL_TOP;           // top of the wall's face
    const faceBottom = h * 0.935;
    const rowH = h * 0.034, brickW = w * 0.07;
    // face
    const fg = g.createLinearGradient(0, topY, 0, faceBottom);
    fg.addColorStop(0, st.light); fg.addColorStop(0.12, st.base); fg.addColorStop(1, st.dark);
    g.fillStyle = fg; g.fillRect(0, topY, w, faceBottom - topY);
    const rows = Math.ceil((faceBottom - topY) / rowH);
    for (let r = 0; r < rows; r++) {
      const y = topY + r * rowH, off = (r % 2) * brickW * 0.5;
      for (let x = -off; x < w; x += brickW) {
        g.fillStyle = `rgba(${rnd() > 0.5 ? "255,255,255" : "0,0,0"},${0.02 + rnd() * 0.07})`;
        g.fillRect(x + 1, y + 1, brickW - 2, rowH - 2);
      }
      g.fillStyle = st.mortar;
      g.fillRect(0, y, w, 1.5);
      for (let x = -off; x < w; x += brickW) g.fillRect(x, y, 1.5, rowH);
    }
    // crenellations: low merlons standing on the lip
    const mW = w * 0.075, period = w * 0.18, mH = h * 0.075;
    for (let k = -3; k <= 2; k++) {
      const cxm = w * 0.5 + (k + 0.5) * period, mx = cxm - mW / 2, my = topY - mH;
      const mg = g.createLinearGradient(0, my, 0, topY);
      mg.addColorStop(0, st.light); mg.addColorStop(0.2, st.base); mg.addColorStop(1, st.dark);
      g.fillStyle = mg; g.fillRect(mx, my, mW, mH + 2);
      g.fillStyle = st.mortar; g.fillRect(mx, my + mH * 0.5, mW, 1.5); g.fillRect(mx + mW * 0.5, my, 1.5, mH * 0.5); g.fillRect(mx + mW * 0.25, my + mH * 0.5, 1.5, mH * 0.5);
      g.fillStyle = st.light; roundRectPath(g, mx - 3, my - 5, mW + 6, 8, 3); g.fill();
      g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(mx + mW - 4, my + 3, 4, mH);
    }
    // lip (coping stone) along the whole wall
    const lg = g.createLinearGradient(0, topY - h * 0.016, 0, topY + h * 0.012);
    lg.addColorStop(0, st.light); lg.addColorStop(1, st.base);
    g.fillStyle = lg; g.fillRect(0, topY - h * 0.012, w, h * 0.024);
    g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(0, topY + h * 0.012, w, 3);
    g.fillStyle = "rgba(255,255,255,0.35)"; g.fillRect(0, topY - h * 0.012, w, 2);
    // walkway floor in perspective
    const fl = g.createLinearGradient(0, faceBottom, 0, h);
    fl.addColorStop(0, theme.floor[0]); fl.addColorStop(1, theme.floor[1]);
    g.fillStyle = fl; g.fillRect(0, faceBottom, w, h - faceBottom);
    g.strokeStyle = st.mortar; g.lineWidth = 1.5;
    for (let k = -7; k <= 7; k++) { g.beginPath(); g.moveTo(w / 2 + k * w * 0.075, faceBottom); g.lineTo(w / 2 + k * w * 0.16, h); g.stroke(); }
    for (let j = 1; j < 3; j++) { const y = faceBottom + (h - faceBottom) * (j / 3) ** 1.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.fillStyle = "rgba(0,0,0,0.3)"; g.fillRect(0, faceBottom, w, 3);
    // world flavour
    if (worldId === 2) {
      g.fillStyle = "#e0a066";
      for (let x = w * 0.03; x < w; x += w * 0.06) { g.beginPath(); g.arc(x, topY + h * 0.022, 3, 0, Math.PI * 2); g.fill(); }
    } else if (worldId === 3) {
      g.strokeStyle = "rgba(120,240,255,0.75)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, topY + h * 0.018); g.lineTo(w, topY + h * 0.018); g.stroke();
      g.strokeStyle = "rgba(120,240,255,0.25)"; g.lineWidth = 6;
      g.beginPath(); g.moveTo(0, topY + h * 0.018); g.lineTo(w, topY + h * 0.018); g.stroke();
    }
  }

  // ---- layer cache ------------------------------------------------------------
  let layersCache = {};
  function getLayers(worldId) {
    const v = view;
    const key = `${worldId}|${v.w}|${v.h}|${v.dpr}`;
    let L = layersCache[worldId];
    if (L && L.key === key) return L;
    const mk = () => {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.ceil(v.w * v.dpr));
      c.height = Math.max(1, Math.ceil(v.h * v.dpr));
      const g = c.getContext("2d");
      g.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
      return { c, g };
    };
    L = { key, sky: mk(), land: mk(), wall: mk() };
    paintSky(L.sky.g, v.w, v.h, v.horizonY, worldId);
    paintLand(L.land.g, v.w, v.h, v.horizonY, worldId);
    paintWall(L.wall.g, v.w, v.h, v.horizonY, worldId);
    // deterministic items for the animated bits
    const rnd = mulberry32(worldId * 71 + 5);
    L.clouds = [];
    for (let i = 0; i < (worldId === 3 ? 3 : 6); i++) {
      L.clouds.push({ x: rnd() * (v.w + 300), y: v.horizonY * (0.12 + rnd() * 0.6), s: v.h * (0.018 + rnd() * 0.02), speed: 0.004 + rnd() * 0.01, a: worldId === 3 ? 0.18 : (worldId === 2 ? 0.45 : 0.9) });
    }
    L.stars = [];
    for (let i = 0; i < 80; i++) L.stars.push({ x: rnd() * v.w, y: rnd() * v.horizonY * 0.9, r: 0.6 + rnd() * 1.4, ph: rnd() * 6.28 });
    layersCache[worldId] = L;
    return L;
  }

  // Animated pieces that sit BEHIND the land layer
  function paintDynamicBack(g, worldId, L, tm) {
    const v = view, hy = v.horizonY;
    if (worldId === 3) {
      L.stars.forEach((s) => {
        g.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * (0.5 + 0.5 * Math.sin(tm / 600 + s.ph))})`;
        g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
      });
      // floating crystal islands
      [[0.46, 0.2, 1], [0.62, 0.34, 0.7], [0.36, 0.42, 0.55]].forEach(([fx, fy, sc], i) => {
        const x = v.w * fx, y = hy * fy + Math.sin(tm / 1400 + i * 2) * 4, s = v.h * 0.05 * sc;
        g.fillStyle = "#3b2a78"; g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + s, y); g.lineTo(x + s * 0.2, y + s * 0.9); g.lineTo(x - s * 0.3, y + s * 0.7); g.closePath(); g.fill();
        g.fillStyle = "#5fbf6a"; g.fillRect(x - s, y - s * 0.12, s * 2, s * 0.14);
        g.fillStyle = i % 2 ? "#6ff0ff" : "#ff7be0";
        g.beginPath(); g.moveTo(x - s * 0.2, y - s * 0.1); g.lineTo(x, y - s * 0.9); g.lineTo(x + s * 0.2, y - s * 0.1); g.closePath(); g.fill();
      });
    }
    L.clouds.forEach((c) => {
      const x = ((c.x + tm * c.speed) % (v.w + 320)) - 160;
      cloudShape(g, x, c.y, c.s, c.a);
    });
    if (worldId === 2) {
      // slowly turning cogs on the horizon, half hidden by the land layer
      [[0.16, 0.115, 11, 1], [0.44, 0.085, 9, -1.4], [0.70, 0.15, 14, 0.8], [0.93, 0.09, 9, -1.2]].forEach(([fx, rr, teeth, spd]) => {
        drawCogShape(g, v.w * fx, hy + v.h * 0.012, v.h * rr, teeth, tm / 5000 * spd, "#b8703a", "#5b3318");
      });
    }
  }

  // Animated pieces in FRONT of the land layer
  function paintDynamicFront(g, worldId, L, tm) {
    const v = view, hy = v.horizonY;
    if (worldId === 1) {
      const hx = v.w * 0.86, hyb = hy - v.h * 0.134, len = v.h * 0.062;
      g.save(); g.translate(hx, hyb); g.rotate(tm / 2600);
      for (let k = 0; k < 4; k++) {
        g.rotate(Math.PI / 2);
        g.fillStyle = "#f7f1e2"; g.fillRect(-len * 0.09, 0, len * 0.18, len);
        g.fillStyle = "#c9b79a"; g.fillRect(-len * 0.09, 0, len * 0.04, len);
      }
      g.fillStyle = "#6b4a2b"; g.beginPath(); g.arc(0, 0, len * 0.1, 0, Math.PI * 2); g.fill();
      g.restore();
    } else if (worldId === 2) {
      [[0.31, 0.10], [0.69, 0.14]].forEach(([fx, hh], i) => {
        for (let k = 0; k < 5; k++) {
          const age = ((tm / 3200) + k / 5 + i * 0.3) % 1;
          g.fillStyle = `rgba(90,60,40,${0.4 * (1 - age)})`;
          g.beginPath(); g.arc(v.w * fx + age * v.w * 0.04, hy - v.h * hh - age * v.h * 0.12, v.h * (0.008 + age * 0.02), 0, Math.PI * 2); g.fill();
        }
      });
    }
  }

  // =========================================================================
  // MONSTER / CANNON DRAWING
  // =========================================================================
  function drawBossHpBar(g, m) {
    const barWidth = Math.max(80, m.size * 0.9);
    const barHeight = 10;
    const x = m.sx - barWidth / 2;
    const y = Math.max(78, m.sy - m.size * 0.5 - 16); // stays clear of the HUD pills
    g.fillStyle = "rgba(0,0,0,0.55)";
    roundRectPath(g, x - 2, y - 2, barWidth + 4, barHeight + 4, 6); g.fill();
    const hpFrac = Math.max(0, m.hp / m.maxHp);
    const bg = g.createLinearGradient(0, y, 0, y + barHeight);
    bg.addColorStop(0, "#ff9a3c"); bg.addColorStop(1, "#e8590c");
    g.fillStyle = bg;
    roundRectPath(g, x, y, Math.max(2, barWidth * hpFrac), barHeight, 5); g.fill();
    g.font = "bold 13px 'Baloo 2', 'Trebuchet MS', sans-serif";
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "bottom";
    g.fillText(`${m.hp}/${m.maxHp}`, m.sx, y - 3);
  }

  // Small HP pips above armored/elite dragons (the boss gets a full bar).
  function drawHpPips(g, m) {
    const pipR = Math.max(3, Math.min(6, m.size * 0.04));
    const spacing = pipR * 2.6;
    const startX = m.sx - ((m.maxHp - 1) * spacing) / 2;
    const y = Math.max(66, m.sy - m.size * 0.5 - pipR * 2.5);
    for (let i = 0; i < m.maxHp; i++) {
      g.beginPath();
      g.arc(startX + i * spacing, y, pipR, 0, Math.PI * 2);
      g.fillStyle = i < m.hp ? "#ff7a1a" : "rgba(0,0,0,0.35)";
      g.fill();
      g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 1.2; g.stroke();
    }
  }

  function drawMonster(g, m, tm) {
    const cfg = DRAGON_SPECIES[m.speciesKey];
    let alpha = m.alpha == null ? 1 : m.alpha, pop = 1;
    if (m.dying) {
      const k = Math.min(1, m.dieTimer / 360);
      pop = 1 + k * 0.4;
      alpha *= 1 - k;
    }
    if (alpha <= 0.01) return;
    // ground shadow: smaller and fainter the higher the dragon flies
    const hoverPx = m.hover * view.spriteBase * m.s;
    const sa = 0.22 * alpha * (1 - Math.min(1, hoverPx / (view.h * 0.55)));
    if (sa > 0.01) {
      g.fillStyle = `rgba(0,0,0,${sa})`;
      g.beginPath(); g.ellipse(m.sx, m.groundY, m.size * 0.5, m.size * 0.09, 0, 0, Math.PI * 2); g.fill();
    }
    const bob = Math.sin(tm / 260 + m.seed) * m.size * 0.025;
    const roar = Math.min(1, Math.max(0, (m.p - 0.6) / 0.3));
    const mouth = 0.3 + 0.18 * Math.sin(tm / 380 + m.seed) + 0.55 * roar;
    const pulse = m.hitTimer > 0 ? 1 + (m.hitTimer / 180) * 0.1 : 1;
    g.save();
    g.globalAlpha = alpha;
    g.translate(m.sx, m.sy + bob);
    g.scale(pop * pulse, pop * pulse);
    drawDragon(g, m.size, cfg, { time: tm, seed: m.seed, mouth, maxHp: m.maxHp, isBoss: m.isBoss });
    if (m.hitTimer > 0) {
      g.globalCompositeOperation = "lighter";
      const rr = m.size * 0.6, fg = g.createRadialGradient(0, 0, 0, 0, 0, rr);
      fg.addColorStop(0, `rgba(255,255,255,${0.7 * m.hitTimer / 180})`); fg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = fg; g.beginPath(); g.arc(0, 0, rr, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    if (!m.dying && !m.ambient) {
      if (m.isBoss) drawBossHpBar(g, m);
      else if (m.maxHp > 1) drawHpPips(g, m);
    }
  }

  // Lock-on brackets around the dragons the cannons are about to fire at.
  function drawReticle(g, m, color, tm) {
    const rad = Math.max(16, m.size * 0.58);
    g.save();
    g.translate(m.sx, m.sy);
    g.rotate(tm / 1400);
    g.lineCap = "round";
    for (let pass = 0; pass < 2; pass++) {
      g.strokeStyle = pass ? color : color.replace(/[\d.]+\)$/, "0.25)");
      g.lineWidth = pass ? Math.max(2, rad * 0.06) : Math.max(5, rad * 0.16);
      for (let k = 0; k < 4; k++) {
        g.beginPath(); g.arc(0, 0, rad, k * Math.PI / 2 + 0.22, k * Math.PI / 2 + Math.PI / 2 - 0.22); g.stroke();
      }
    }
    g.restore();
  }

  function drawCannon(g, pose, tm) {
    const { x, baseY, bx, by, dx, dy, rb, rm, L, u } = pose;
    const alpha = pose.i === 1 ? Math.min(1, state.cannonSpread * 1.6) : 1;
    if (alpha <= 0.02) return;
    const tier = state.cannonLevel;
    g.save();
    g.globalAlpha = alpha;
    const wood1 = "#94622f", wood2 = "#5b3819", iron = "#26282e", edge = "#0d0e11";
    g.lineJoin = "round";

    // wheels (seen edge-on from behind)
    [-1, 1].forEach((s) => {
      const wx = x + s * u * 0.86, wy = baseY - u * 0.34, rx = u * 0.15, ry = u * 0.56;
      g.fillStyle = iron; g.beginPath(); g.ellipse(wx, wy, rx + u * 0.045, ry + u * 0.045, 0, 0, Math.PI * 2); g.fill();
      const wg = g.createLinearGradient(wx - rx, 0, wx + rx, 0);
      wg.addColorStop(0, wood2); wg.addColorStop(0.5, wood1); wg.addColorStop(1, wood2);
      g.fillStyle = wg; g.beginPath(); g.ellipse(wx, wy, rx, ry, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = iron; g.lineWidth = u * 0.04;
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 4;
        g.beginPath(); g.moveTo(wx - Math.sin(a) * rx * 0.9, wy - Math.cos(a) * ry * 0.9); g.lineTo(wx + Math.sin(a) * rx * 0.9, wy + Math.cos(a) * ry * 0.9); g.stroke();
      }
      g.fillStyle = "#c9ced6"; g.beginPath(); g.arc(wx, wy, u * 0.05, 0, Math.PI * 2); g.fill();
    });

    // carriage body
    const cg = g.createLinearGradient(0, by, 0, baseY);
    cg.addColorStop(0, wood1); cg.addColorStop(1, wood2);
    g.beginPath();
    g.moveTo(x - u * 0.50, by + u * 0.08); g.lineTo(x + u * 0.50, by + u * 0.08);
    g.lineTo(x + u * 0.82, baseY + 6); g.lineTo(x - u * 0.82, baseY + 6);
    g.closePath();
    g.fillStyle = cg; g.fill(); g.lineWidth = u * 0.03; g.strokeStyle = edge; g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 1.5;
    for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(x + k * u * 0.22, by + u * 0.1); g.lineTo(x + k * u * 0.36, baseY); g.stroke(); }
    g.fillStyle = iron;
    [0.38, 0.74].forEach((f) => {
      const yy = by + (baseY - by) * f, hw = u * (0.5 + 0.32 * f);
      g.fillRect(x - hw, yy, hw * 2, u * 0.07);
    });
    // trunnion cheeks flanking the breech
    [-1, 1].forEach((s) => {
      g.fillStyle = wood2; roundRectPath(g, x + s * rb * 1.02 - u * 0.09, by - u * 0.16, u * 0.18, u * 0.5, u * 0.05); g.fill();
      g.lineWidth = u * 0.025; g.strokeStyle = edge; g.stroke();
    });

    // barrel: tapered tube from the breech toward the muzzle
    const nx = -dy, ny = dx;
    const Bx = bx, By = by, Mx = bx + dx * L, My = by + dy * L;
    g.beginPath();
    g.moveTo(Bx + nx * rb, By + ny * rb); g.lineTo(Mx + nx * rm, My + ny * rm);
    g.lineTo(Mx - nx * rm, My - ny * rm); g.lineTo(Bx - nx * rb, By - ny * rb);
    g.closePath();
    const bg = g.createLinearGradient(Bx - nx * rb, By - ny * rb, Bx + nx * rb, By + ny * rb);
    bg.addColorStop(0, "#1b1d22"); bg.addColorStop(0.28, "#59606b"); bg.addColorStop(0.46, "#98a0ac");
    bg.addColorStop(0.7, "#3b3f48"); bg.addColorStop(1, "#15161a");
    g.fillStyle = bg; g.fill(); g.lineWidth = u * 0.03; g.strokeStyle = edge; g.stroke();
    // reinforcing bands (gold once the cannon is upgraded)
    [0.3, 0.62].forEach((f) => {
      const r0 = rb + (rm - rb) * f, px = Bx + dx * L * f, py = By + dy * L * f, th = L * 0.08;
      g.beginPath();
      g.moveTo(px + nx * r0 * 1.06, py + ny * r0 * 1.06); g.lineTo(px + dx * th + nx * r0 * 1.06, py + dy * th + ny * r0 * 1.06);
      g.lineTo(px + dx * th - nx * r0 * 1.06, py + dy * th - ny * r0 * 1.06); g.lineTo(px - nx * r0 * 1.06, py - ny * r0 * 1.06);
      g.closePath();
      g.fillStyle = tier >= 1 ? "#f2c14e" : "#3b3e46"; g.fill(); g.lineWidth = u * 0.022; g.strokeStyle = edge; g.stroke();
    });
    // muzzle swell
    const mth = L * 0.12;
    g.beginPath();
    g.moveTo(Mx + nx * rm * 1.16, My + ny * rm * 1.16); g.lineTo(Mx - nx * rm * 1.16, My - ny * rm * 1.16);
    g.lineTo(Mx - dx * mth - nx * rm * 1.02, My - dy * mth - ny * rm * 1.02); g.lineTo(Mx - dx * mth + nx * rm * 1.02, My - dy * mth + ny * rm * 1.02);
    g.closePath();
    g.fillStyle = tier >= 1 ? "#d9a63a" : "#2d3037"; g.fill(); g.lineWidth = u * 0.025; g.strokeStyle = edge; g.stroke();
    // breech: the round rear face you look at
    const rg = g.createRadialGradient(Bx - rb * 0.3, By - rb * 0.3, rb * 0.1, Bx, By, rb * 1.1);
    rg.addColorStop(0, "#a4acb8"); rg.addColorStop(0.55, "#4a5059"); rg.addColorStop(1, "#1a1c21");
    g.fillStyle = rg; g.beginPath(); g.arc(Bx, By, rb * 1.08, 0, Math.PI * 2); g.fill();
    g.lineWidth = u * 0.03; g.strokeStyle = edge; g.stroke();
    g.strokeStyle = tier >= 1 ? "#f2c14e" : "#6d747f"; g.lineWidth = u * 0.03;
    g.beginPath(); g.arc(Bx, By, rb * 0.72, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#2a2d33"; g.beginPath(); g.arc(Bx, By, rb * 0.3, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.35)"; g.beginPath(); g.arc(Bx - rb * 0.1, By - rb * 0.12, rb * 0.1, 0, Math.PI * 2); g.fill();

    // muzzle flash
    if (state.muzzleFlash > 0.02) {
      const f = state.muzzleFlash, fr = u * (0.5 + 0.7 * f);
      g.globalCompositeOperation = "lighter";
      const fg = g.createRadialGradient(Mx, My, 0, Mx, My, fr);
      fg.addColorStop(0, `rgba(255,250,210,${0.95 * f})`); fg.addColorStop(0.35, `rgba(255,190,70,${0.7 * f})`); fg.addColorStop(1, "rgba(255,120,30,0)");
      g.fillStyle = fg; g.beginPath(); g.arc(Mx, My, fr, 0, Math.PI * 2); g.fill();
      g.fillStyle = `rgba(255,240,170,${0.8 * f})`;
      g.beginPath();
      for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 + tm / 90, rr = k % 2 ? fr * 0.35 : fr * 0.9; g.lineTo(Mx + Math.cos(a) * rr, My + Math.sin(a) * rr); }
      g.closePath(); g.fill();
    }
    g.restore();
  }

  function sceneWorldId() {
    if (state.mode === "menu") return menuWorldId;
    if (state.mode === "quiz") return state.quickUnlockWorldId || 1;
    return currentWorld().id;
  }

  // ---- ambient dragons drifting in the sky behind the menus -----------------
  let menuWorldId = 1;
  let ambient = [];
  function resetAmbient() {
    ambient = [];
    const list = DRAGON_SPECIES_BY_WORLD[menuWorldId];
    [[-0.78, 0.7, 0.10], [0.72, 0.35, 0.22], [-0.25, 0.9, 0.34], [0.3, 0.55, 0.44]].forEach(([lane, hover, p0], i) => {
      const m = {
        p: p0, speedP: 0.00028 + i * 0.00004, lane, hover, speciesKey: list[i % list.length], scale: 1,
        hp: 1, maxHp: 1, isBoss: false, dying: false, dieTimer: 0, hitTimer: 0, seed: i * 7.3, ambient: true, alpha: 1,
      };
      layoutMonster(m);
      ambient.push(m);
    });
  }
  function updateAmbient(dt) {
    ambient.forEach((m) => {
      m.p += m.speedP * (dt / 16.6667);
      if (m.p > 0.5) m.p = 0.02;
      m.alpha = Math.min(1, m.p / 0.06) * Math.min(1, (0.5 - m.p) / 0.08);
      layoutMonster(m);
    });
  }

  function render() {
    const g = ctx2d, v = view, w = v.w, h = v.h;
    const tm = frameTime;
    g.clearRect(0, 0, w, h);
    const worldId = sceneWorldId();
    const L = getLayers(worldId);
    const playing = state.mode === "playing";

    g.save();
    if (state.shake > 0) {
      const k = state.shake * state.shake;
      g.translate((Math.random() - 0.5) * 18 * k, (Math.random() - 0.5) * 18 * k);
    }
    g.drawImage(L.sky.c, 0, 0, w, h);
    paintDynamicBack(g, worldId, L, tm);
    g.drawImage(L.land.c, 0, 0, w, h);
    paintDynamicFront(g, worldId, L, tm);

    // dragons, far to near
    const list = state.mode === "menu" ? ambient : (playing ? state.monsters : []);
    const sorted = list.slice().sort((a, b) => a.s - b.s);
    for (const m of sorted) drawMonster(g, m, tm);

    // which dragons the cannons are aiming at (shortest time-to-wall first)
    const aliveSorted = playing ? sortByThreat(state.monsters.filter(m => !m.dying)) : [];
    if (state.running && aliveSorted[0]) {
      drawReticle(g, aliveSorted[0], "rgba(255,214,77,0.95)", tm);
      if (state.cannonLevel >= 2 && aliveSorted[1]) drawReticle(g, aliveSorted[1], "rgba(120,235,255,0.95)", tm);
    }

    // cannonballs shrink as they fly away from you
    if (playing) {
      for (const b of state.cannonballs) {
        const rem = Math.hypot(b.target.sx - b.x, b.target.sy - b.y);
        const prog = Math.min(1, Math.max(0, 1 - rem / b.initialDist));
        const endR = Math.max(3, b.target.size * 0.045);
        const rad = b.startR + (endR - b.startR) * prog;
        g.globalCompositeOperation = "lighter";
        b.trail.forEach((p, k) => {
          const a = (k + 1) / (b.trail.length + 1);
          g.fillStyle = `rgba(255,${150 + 60 * a | 0},60,${0.35 * a})`;
          g.beginPath(); g.arc(p.x, p.y, p.r * (0.5 + 0.5 * a), 0, Math.PI * 2); g.fill();
        });
        g.globalCompositeOperation = "source-over";
        g.fillStyle = "#23252b"; g.beginPath(); g.arc(b.x, b.y, rad, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(255,255,255,0.35)"; g.beginPath(); g.arc(b.x - rad * 0.3, b.y - rad * 0.3, rad * 0.32, 0, Math.PI * 2); g.fill();
      }
    }

    g.drawImage(L.wall.c, 0, 0, w, h);

    // cannons stand in front of the wall
    drawCannon(g, cannonPose(0, aliveSorted[0] || null), tm);
    if (state.cannonSpread > 0.02) drawCannon(g, cannonPose(1, aliveSorted[1] || aliveSorted[0] || null), tm);

    // particles (hits, smoke, popups, rings)
    if (playing) {
      for (const p of state.particles) {
        const a = Math.max(0, p.life / p.maxLife);
        if (p.text) {
          g.globalAlpha = Math.min(1, a * 1.6);
          g.font = "800 22px 'Baloo 2', 'Trebuchet MS', sans-serif";
          g.textAlign = "center"; g.textBaseline = "middle";
          g.lineWidth = 4; g.strokeStyle = "rgba(60,30,0,0.8)"; g.strokeText(p.text, p.x, p.y);
          g.fillStyle = p.color; g.fillText(p.text, p.x, p.y);
        } else if (p.ring) {
          g.globalAlpha = a; g.strokeStyle = p.color; g.lineWidth = 3 + 4 * a;
          g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.stroke();
        } else if (p.smoke) {
          g.globalAlpha = a * 0.6; g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r * (1.6 - a * 0.6), 0, Math.PI * 2); g.fill();
        } else {
          g.globalAlpha = a; g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r * (0.4 + 0.6 * a), 0, Math.PI * 2); g.fill();
        }
      }
      g.globalAlpha = 1;
    }
    g.restore();

    // screen-space moods: damage flash + boss-wave vignette
    if (playing && (state.flash > 0.01 || state.isBossWave)) {
      const fa = Math.max(state.flash * 0.6, state.isBossWave ? 0.16 + 0.07 * Math.sin(tm / 380) : 0);
      const vg = g.createRadialGradient(w / 2, h * 0.55, Math.min(w, h) * 0.25, w / 2, h * 0.55, Math.max(w, h) * 0.75);
      vg.addColorStop(0, "rgba(255,30,30,0)"); vg.addColorStop(1, `rgba(${state.flash > 0.01 ? "255,30,30" : "120,0,30"},${fa})`);
      g.fillStyle = vg; g.fillRect(0, 0, w, h);
    }

    // confetti (celebration): not affected by shake
    for (const c of confetti) {
      g.save();
      g.translate(c.x, c.y);
      g.rotate(c.rot);
      g.fillStyle = c.color;
      g.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
      g.restore();
    }
  }

  // =========================================================================
  // GAME LIFECYCLE
  // =========================================================================
  function resetState() {
    state.hearts = BALANCE.TOTAL_HEARTS;
    state.score = 0;
    state.wave = 1;
    state.monsters = [];
    state.cannonballs = [];
    state.cannonRecoil = 0;
    state.muzzleFlash = 0;
    state.shake = 0;
    state.flash = 0;
    state.cannonSpread = 0;
    state.laneBag = [];
    state.particles = [];
    state.difficultyIndex = 0;
    state.correctStreak = 0;
    state.wrongStreak = 0;
    state.cannonStreak = 0;
    state.cannonLevel = 0;
    state.pendingCannonDowngrade = false;
    state.currentAnswer = "";
    state.running = true;
    state.inputEnabled = true;
    state.gameEnded = false;
    state.waveInProgress = false;
    state.waitingForNextQuestion = false;
    confetti = [];
    document.getElementById("score").textContent = `${t("scoreLabel")}: 0`;
    updateHeartsDisplay();
    updateStreakDisplay();
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("worldSelectOverlay").classList.remove("active");
    document.getElementById("levelSelectOverlay").classList.remove("active");
    setBottomPanelEnabled(true);
    newQuestion();
    startWave(1);
  }

  window.addEventListener("resize", resizeCanvas);
  // The canvas height changes whenever the panel below it does, which no
  // window event reports; observe the wrapper directly.
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(resizeCanvas).observe(document.getElementById("canvasWrapper"));
  }
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 100));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resizeCanvas);
  }
  resizeCanvas();
  updateHeartsDisplay();
  showWorldSelect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
